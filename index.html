:root {

const { useState, useEffect, useCallback } = React;

/* ---------------- CONFIG ---------------- */
const CONFIG = {
  firebase: {
    apiKey: "AIzaSyDdEyxvsd2RjgKVYTGYJfYUB_637lV3n5I",
    authDomain: "starteasy-zambia.firebaseapp.com",
    projectId: "starteasy-zambia",
    storageBucket: "starteasy-zambia.firebasestorage.app",
    messagingSenderId: "54136399237",
    appId: "1:54136399237:web:2f9f2d7f86bfdfb4be50ec"
  },
  mainSiteUrl: 'https://starteasyzambia.com',
  adminWhatsapp: '260762499581',
  attributionDays: 30,
  minPayoutZmw: 200,
  clearingDays: 7,
  commissionTable: { micro: 40, basic: 30, standard: 25, complex: 22, checkup: 22, regularise: 18, venture: 20, ongoing_filing: 20, ongoing_standard: 20, ongoing_managed: 15 }
};

const SE_AGENTS = 'se_agents';
const SE_COMMISSIONS = 'se_commissions';
const SE_PAYOUTS = 'se_payouts';
const SE_PAYMENTS = 'se_payments';
const SE_EVENTS = 'se_events';
const REF_KEY = 'starteasy.ref.v1';
const CODE_RX = /^SE-[A-Z0-9-]{3,32}$/;

/* ---------------- FIREBASE ---------------- */
let db = null, auth = null, fbReady = false;
try {
  if (!firebase.apps.length) firebase.initializeApp(CONFIG.firebase);
  db = firebase.firestore();
  auth = firebase.auth();
  fbReady = true;
  auth.signInAnonymously().catch(() => {});
} catch (e) { console.error(e); }

/* ---------------- HELPERS ---------------- */
const fmtZmw = n => 'K' + (Number(n) || 0).toFixed(2);
const fmtInt = n => String(Number(n) || 0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const timeAgo = ts => {
  if (!ts) return '';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
};
const copyText = async t => {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(t); return true; }
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); return true;
  } catch (e) { return false; }
};
const isMobileUA = () => /android|iphone|ipad|ipod|mobile/i.test((navigator.userAgent || '').toLowerCase());
const waUrl = (msg, phone) => {
  const p = phone || CONFIG.adminWhatsapp; const e = encodeURIComponent(msg);
  return isMobileUA() ? 'whatsapp://send?phone=' + p + '&text=' + e : 'https://wa.me/' + p + '?text=' + e;
};
const baseUrl = () => window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/');
const generateAgentCode = name => {
  const clean = String(name || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 8) || 'AGENT';
  return 'SE-' + clean + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
};
const resolveServiceType = payment => {
  const code = String(payment.serviceCode || '').toUpperCase();
  if (code === 'P0' || code === 'P1') return 'micro';
  if (code === 'P2') return 'complex';
  if (code === 'C1') return 'checkup';
  if (code === 'C2') return 'regularise';
  if (code === 'C3') return 'ongoing_managed';
  if (code.startsWith('V-')) return 'venture';
  if (payment.ongoing === 'managed') return 'ongoing_managed';
  if (payment.ongoing === 'standard') return 'ongoing_standard';
  if (payment.ongoing === 'filing') return 'ongoing_filing';
  return 'standard';
};
const calcCommission = (type, gross) => {
  const pct = CONFIG.commissionTable[type] || 20;
  return { pct, amount: Math.round(gross * pct) / 100 };
};

/* ---------------- ATTRIBUTION ---------------- */
const storeAttribution = code => {
  try {
    const c = String(code).toUpperCase().trim();
    if (!CODE_RX.test(c)) return null;
    const rec = { code: c, at: Date.now(), src: window.location.href };
    localStorage.setItem(REF_KEY, JSON.stringify(rec));
    return rec;
  } catch (e) { return null; }
};
const logReferralClick = async code => {
  if (!fbReady) return;
  try {
    await db.collection(SE_EVENTS).add({ type: 'referral_click', agentCode: code, at: Date.now(), route: 'redirect' });
    const q = await db.collection(SE_AGENTS).where('agentCode', '==', code).limit(1).get();
    if (!q.empty) {
      const ref = q.docs[0].ref;
      await db.runTransaction(async t => {
        const s = await t.get(ref);
        if (!s.exists) return;
        t.update(ref, { 'totals.clicks': ((s.data().totals || {}).clicks || 0) + 1 });
      });
    }
  } catch (e) {}
};

/* ---------------- UI COMPONENTS ---------------- */
const Mark = ({ size = 36 }) => (
  <span style={{ width: size, height: size, borderRadius: '50%', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: 'linear-gradient(135deg,#E8730F,#F5A623)', color: '#fff', fontFamily: "'Playfair Display',serif", fontWeight: 800, fontSize: size * 0.5, flexShrink: 0 }}>S</span>
);

const Btn = ({ children, onClick, variant = 'primary', size = 'md', disabled, style, type = 'button' }) => {
  const base = { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, border: 'none', borderRadius: 8, cursor: disabled ? 'not-allowed' : 'pointer', fontFamily: 'inherit', fontWeight: 700, transition: 'all .2s', opacity: disabled ? 0.55 : 1, whiteSpace: 'nowrap' };
  const sizes = { sm: { padding: '8px 14px', fontSize: 12 }, md: { padding: '11px 20px', fontSize: 13.5 }, lg: { padding: '14px 24px', fontSize: 14.5 } };
  const variants = {
    primary: { background: 'linear-gradient(135deg,#E8730F,#F5A623)', color: '#fff' },
    dark: { background: '#0A1F12', color: '#fff' },
    ghost: { background: '#fff', color: '#0A1F12', border: '1px solid rgba(10,31,18,.15)' },

  };
  return <button type={type} onClick={onClick} disabled={disabled} style={{ ...base, ...sizes[size], ...variants[variant], ...style }}>{children}</button>;
};

const Spinner = ({ label }) => (
  <div style={{ padding: 80, textAlign: 'center' }}>
    <i className="fas fa-circle-notch spin" style={{ fontSize: 28, color: '#E8730F' }}></i>
    {label && <p style={{ marginTop: 14, fontSize: 13, color: 'rgba(10,31,18,.6)' }}>{label}</p>}
  </div>
);

const Badge = ({ status }) => {
  const m = {
    active: { label: 'Active', color: '#1E7B3C', bg: '#EAF7EE', icon: 'fa-circle-check' },
    pending: { label: 'Pending', color: '#8A6828', bg: '#FFF4E5', icon: 'fa-clock' },
    earned: { label: 'Earned', color: '#1E7B3C', bg: '#EAF7EE', icon: 'fa-circle-check' },
    paid: { label: 'Paid', color: '#0E7C7B', bg: '#E6F4F4', icon: 'fa-money-bill-wave' }
  }[status] || { label: status, color: '#666', bg: '#eee', icon: 'fa-circle' };
  return <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 10px', borderRadius: 99, fontSize: 10.5, fontWeight: 800, letterSpacing: '.05em', textTransform: 'uppercase', background: m.bg, color: m.color, border: `1px solid ${m.color}33` }}><i className={`fas ${m.icon}`}></i> {m.label}</span>;
};

const Kpi = ({ label, value, sub, color = '#E8730F', icon }) => (
  <div style={{ background: '#fff', border: '1px solid rgba(10,31,18,.08)', borderRadius: 12, padding: '16px 18px', borderTopWidth: 3, borderTopColor: color }}>
    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
      <span style={{ fontSize: 10.5, letterSpacing: '.1em', textTransform: 'uppercase', fontWeight: 800, color: 'rgba(10,31,18,.5)' }}>{label}</span>
      {icon && <i className={`fas ${icon}`} style={{ color, fontSize: 12 }}></i>}

    <div className="serif" style={{ fontSize: 24, fontWeight: 800, color: '#0A1F12', lineHeight: 1.1, marginBottom: 2 }}>{value}</div>
    {sub && <div style={{ fontSize: 11, color: 'rgba(10,31,18,.5)' }}>{sub}</div>}

/* INSTANT ONBOARDING: OFFICIAL AGREEMENT */
function JoinPage({ go, onAuth }) {
  const [form, setForm] = useState({ name: '', email: '', phone: '', location: '', password: '' });
  const [agreed, setAgreed] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  const submit = async () => {
    setErr('');
    if (!form.name.trim()) return setErr('Please type your full name on the signature line.');
    if (!form.email.trim() || !/^\S+@\S+\.\S+$/.test(form.email)) return setErr('Please enter a valid email.');
    if (!form.phone.trim() || form.phone.replace(/\D/g, '').length < 9) return setErr('Please enter a valid phone number.');
    if (!form.location) return setErr('Please select your location.');
    if (!form.password || form.password.length < 6) return setErr('Password must be at least 6 characters.');
    if (!agreed) return setErr('You must check the agreement box to proceed.');

    setBusy(true);
    try {
      // 1. Create Auth Account
      const cred = await auth.createUserWithEmailAndPassword(form.email.trim().toLowerCase(), form.password);
      
      // 2. Generate Code
      const agentCode = generateAgentCode(form.name);

      // 3. Save Profile Instantly
      await db.collection(SE_AGENTS).doc(cred.user.uid).set({
        uid: cred.user.uid,
        agentCode: agentCode,
        displayName: form.name.trim(),
        email: form.email.trim().toLowerCase(),
        phone: form.phone.trim(),
        location: form.location,
        status: 'active',
        commissionPct: 20,
        createdAt: Date.now(),
        totals: { clicks: 0, conversions: 0, earnedZmw: 0, paidZmw: 0, pendingZmw: 0 }
      });

      onAuth(); // Redirect to Dashboard
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') setErr('This email is already registered. Please sign in.');
      else setErr(e.message || 'Registration failed.');
    } finally { setBusy(false); }
  };

  return (
    <div style={{ background: '#F5FAF6', padding: '40px 16px', minHeight: '100vh' }}>
      
      {/* EXACT MAIN PLATFORM LETTER STYLE */}
      <div className="el fadein printable">
        <div className="eh">
          <div>
            <div className="brand">Start<em>Easy</em></div>
            <div className="sub">StartEasy Zambia</div>
          </div>
          <div>
            <div className="dt">OPPORTUNITY ENGAGEMENT</div>
            <div className="mt">
              {new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}<br/>
              Ref: SE-AGT-{new Date().getFullYear()}-{String(Math.floor(Math.random()*9000)+1000)}
            </div>
          </div>
        </div>

        {/* DYNAMIC GREETING - NO "APPLICANT" FALLBACK */}
        <p><strong>Dear {form.name.trim() ? form.name.trim() : '___________________'},</strong></p>
        
        <p>Thank you for considering an opportunity engagement with StartEasy Zambia. This agreement sets out the terms of your participation in our Referral Program as an independent agent.</p>

        <h4>1. Nature of Engagement</h4>
        <p>You are joining as an independent Referral Agent. This is <strong>NOT</strong> an employment contract. You are not an employee of StartEasy Zambia, and there is no salary, no guaranteed income, and no employee benefits. Your earnings depend solely on the volume and value of approved sales you refer.</p>

        <h4>2. Commission & Payouts</h4>

function LoginPage({ go, onAuth }) {
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  const submit = async () => {
    setErr('');
    if (!email.trim() || !pw) return setErr('Enter your email and password.');
    setBusy(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), pw);
      onAuth();
    } catch (e) { setErr('Incorrect email or password.'); }
    finally { setBusy(false); }
  };

  return (
    <div style={{ minHeight: '70vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '40px 20px' }}>
      <div style={{ background: '#fff', borderRadius: 14, padding: '32px 28px', maxWidth: 400, width: '100%', boxShadow: '0 20px 60px rgba(0,0,0,.08)' }}>
        <h1 className="serif" style={{ fontSize: 24, color: '#0A1F12', marginBottom: 6 }}>Welcome back</h1>
        <p style={{ fontSize: 13, color: 'rgba(10,31,18,.6)', marginBottom: 24 }}>Sign in to view your dashboard.</p>
        <label style={{ display: 'block', fontSize: 12.5, fontWeight: 700, marginBottom: 6 }}>Email</label>
        <input type="email" value={email} onChange={e => setEmail(e.target.value)} style={{ width: '100%', padding: 12, border: '1px solid #ccc', borderRadius: 8, marginBottom: 16 }} />
        <label style={{ display: 'block', fontSize: 12.5, fontWeight: 700, marginBottom: 6 }}>Password</label>
        <input type="password" value={pw} onChange={e => setPw(e.target.value)} style={{ width: '100%', padding: 12, border: '1px solid #ccc', borderRadius: 8, marginBottom: 16 }} />
        {err && <div style={{ color: '#B8564F', fontSize: 12.5, marginBottom: 16 }}>{err}</div>}
        <Btn onClick={submit} disabled={busy} size="lg" variant="primary" style={{ width: '100%', marginBottom: 16 }}>{busy ? 'Signing in...' : 'Sign in'}</Btn>
        <p style={{ fontSize: 12, textAlign: 'center', margin: 0 }}>Need a code? <a href="#/join" style={{ color: '#E8730F', fontWeight: 700 }}>Sign agreement here</a>.</p>
      </div>
    </div>
  );
}

function Dashboard({ go, onSignOut, agent, setAgent }) {
  const [commissions, setCommissions] = useState([]);
  const [payouts, setPayouts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [msg, setMsg] = useState('');
  const [showCodeBanner, setShowCodeBanner] = useState(true);

  useEffect(() => {
    if (!agent) return;
    const unsubs = [
      db.collection(SE_AGENTS).doc(agent.id).onSnapshot(s => { if (s.exists) setAgent({ id: s.id, ...s.data() }); }),
      db.collection(SE_COMMISSIONS).where('agentId', '==', agent.id).orderBy('createdAt', 'desc').limit(100).onSnapshot(s => setCommissions(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => {}),
      db.collection(SE_PAYOUTS).where('agentId', '==', agent.id).orderBy('requestedAt', 'desc').limit(50).onSnapshot(s => setPayouts(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => {})
    ];
    setLoading(false);
    return () => unsubs.forEach(u => u());
  }, [agent.id]);

  if (loading || !agent) return <Spinner label="Loading dashboard…" />;

  const shareLink = baseUrl() + '#/r/' + agent.agentCode;
  const earned = agent.totals?.earnedZmw || 0;
  const paid = agent.totals?.paidZmw || 0;
  const pending = agent.totals?.pendingZmw || 0;
  const available = Math.max(0, earned - paid);

  const doCopy = async (text, label) => {
    const ok = await copyText(text);
    setMsg(ok ? `${label} copied!` : 'Copy failed');
    setTimeout(() => setMsg(''), 2000);
  };

  return (
    <div className="fadein" style={{ minHeight: '100vh', background: '#F5FAF6', paddingBottom: 60 }}>
      <div style={{ maxWidth: 1000, margin: '0 auto', padding: '32px 16px' }}>
        
        {showCodeBanner && (
          <div style={{ background: 'linear-gradient(135deg,#0A1F12,#123A1F)', color: '#fff', borderRadius: 12, padding: '24px', marginBottom: 24, position: 'relative', boxShadow: '0 10px 30px rgba(10,31,18,.2)' }}>
            <button onClick={() => setShowCodeBanner(false)} style={{ position: 'absolute', top: 16, right: 16, background: 'none', border: 'none', color: 'rgba(255,255,255,.5)', cursor: 'pointer', fontSize: 16 }}>✕</button>
            <h2 className="serif" style={{ fontSize: 22, color: '#F5A623', marginBottom: 8 }}>Welcome, {agent.displayName.split(' ')[0]}! Your code is ready.</h2>
            <p style={{ fontSize: 14, color: 'rgba(255,255,255,.7)', marginBottom: 16 }}>Copy your unique link below and share it with potential clients.</p>
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
              <div style={{ flex: 1, minWidth: 250, background: 'rgba(255,255,255,.1)', borderRadius: 8, padding: '12px 16px', fontFamily: 'monospace', fontSize: 13, wordBreak: 'break-all' }}>{shareLink}</div>
              <Btn variant="primary" onClick={() => doCopy(shareLink, 'Link')}><i className="fas fa-copy"></i> Copy Link</Btn>
            </div>
          </div>
        )}

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24, flexWrap: 'wrap', gap: 16 }}>
          <div>
            <h1 className="serif" style={{ fontSize: 26, color: '#0A1F12', margin: 0 }}>Agent Dashboard</h1>
            <p style={{ fontSize: 13, color: 'rgba(10,31,18,.6)', margin: '4px 0 0' }}>Code: <strong>{agent.agentCode}</strong></p>
          </div>
          <Btn onClick={onSignOut} variant="ghost" size="sm">Sign Out</Btn>
        </div>

        {msg && <div style={{ background: '#EAF7EE', color: '#1E7B3C', padding: 12, borderRadius: 8, marginBottom: 16, fontWeight: 600, fontSize: 13 }}>{msg}</div>}

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(200px,1fr))', gap: 12, marginBottom: 24 }}>
          <Kpi label="Clicks" value={fmtInt(agent.totals?.clicks)} sub="Link clicks" icon="fa-eye" color="#1B6CA8" />
          <Kpi label="Conversions" value={fmtInt(agent.totals?.conversions)} sub="Approved payments" icon="fa-circle-check" color="#1E7B3C" />
          <Kpi label="Earned" value={fmtZmw(earned)} sub={`${fmtZmw(available)} avail`} icon="fa-wallet" color="#E8730F" />
          <Kpi label="Pending" value={fmtZmw(pending)} sub="Clearing (7 days)" icon="fa-clock" color="#8A6828" />
        </div>

        {/* Link Box (Always Visible) */}
        <div style={{ background: '#fff', padding: 20, borderRadius: 12, border: '1px solid rgba(10,31,18,.08)', marginBottom: 24 }}>
          <h3 style={{ fontSize: 13, fontWeight: 700, marginBottom: 12 }}>Your Referral Link</h3>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            <input type="text" readOnly value={shareLink} style={{ flex: 1, minWidth: 250, padding: 12, border: '1px solid #ccc', borderRadius: 8, fontFamily: 'monospace', fontSize: 13, background: '#F9FBFA' }} />
            <Btn variant="primary" onClick={() => doCopy(shareLink, 'Link')}><i className="fas fa-copy"></i> Copy</Btn>
            <a href={`https://wa.me/?text=${encodeURIComponent('Check out StartEasy — quality business services in Zambia. Use my link: ' + shareLink)}`} target="_blank" rel="noopener noreferrer" style={{ padding: '11px 20px', background: '#25D366', color: '#fff', borderRadius: 8, fontSize: 13.5, fontWeight: 700, textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: 8 }}><i className="fab fa-whatsapp"></i> Share</a>
          </div>
        </div>

        <div style={{ background: '#fff', borderRadius: 12, border: '1px solid rgba(10,31,18,.08)', overflow: 'hidden' }}>
          <div style={{ padding: '16px 20px', borderBottom: '1px solid rgba(10,31,18,.08)', fontWeight: 700, fontSize: 14 }}>Recent Commissions</div>
          {commissions.length === 0 ? (
            <div style={{ padding: 40, textAlign: 'center', color: 'rgba(10,31,18,.5)', fontSize: 13 }}>No commissions yet. Share your link to start earning.</div>
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 600 }}>
                <thead>
                  <tr style={{ background: '#F9FBFA', borderBottom: '1px solid rgba(10,31,18,.08)' }}>
                    {['Ref', 'Service', 'Fee', 'Commission', 'Status'].map(h => <th key={h} style={{ textAlign: 'left', padding: 12, fontSize: 11, textTransform: 'uppercase', color: 'rgba(10,31,18,.5)' }}>{h}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {commissions.map(c => (
                    <tr key={c.id} style={{ borderBottom: '1px solid rgba(10,31,18,.05)' }}>
                      <td style={{ padding: 12, fontSize: 12, fontFamily: 'monospace' }}>{c.paymentRef}</td>
                      <td style={{ padding: 12, fontSize: 13 }}>{c.serviceTitle}</td>
                      <td style={{ padding: 12, fontSize: 13 }}>{fmtZmw(c.grossZmw)}</td>
                      <td style={{ padding: 12, fontSize: 13, fontWeight: 700, color: '#E8730F' }}>{fmtZmw(c.commissionZmw)}</td>
                      <td style={{ padding: 12 }}><Badge status={c.status} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function RedirectHandler({ code }) {
  useEffect(() => {
    if (!CODE_RX.test(code)) { window.location.hash = '#/'; return; }
    logReferralClick(code);
    storeAttribution(code);
    setTimeout(() => { window.location.href = CONFIG.mainSiteUrl + '/?ref=' + code; }, 500);
  }, [code]);
  return <Spinner label="Redirecting to StartEasy..." />;
}

function App() {
  const [hash, setHash] = useState(window.location.hash || '#/');
  const [agent, setAgent] = useState(null);
  const [bootChecked, setBootChecked] = useState(false);

  useEffect(() => {
    const onHash = () => setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  useEffect(() => {
    if (!fbReady) { setBootChecked(true); return; }
    const unsub = auth.onAuthStateChanged(async user => {
      if (!user) { setAgent(null); setBootChecked(true); return; }
      try {
        const snap = await db.collection(SE_AGENTS).doc(user.uid).get();
        if (snap.exists) setAgent({ id: user.uid, ...snap.data() });
        else setAgent(null);
      } catch (e) { setAgent(null); }
      setBootChecked(true);
    });
    return unsub;
  }, []);

  const raw = (hash || '#/').replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  const route = parts[0] || '';
  const routeArg = parts[1] || '';

  const go = useCallback((r) => { window.location.hash = '#/' + r; window.scrollTo(0, 0); }, []);
  const onSignOut = async () => { await auth.signOut(); setAgent(null); go(''); };
  const onAuth = () => { go('dashboard'); };

  if (!bootChecked) return <Spinner />;
  if (route === 'r' && routeArg) return <RedirectHandler code={routeArg.toUpperCase()} />;

  let page = <Landing go={go} />;
  if (route === 'join') page = <JoinPage go={go} onAuth={onAuth} />;
  else if (route === 'login') page = <LoginPage go={go} onAuth={onAuth} />;
  else if (route === 'dashboard') {
    if (!agent) page = <LoginPage go={go} onAuth={onAuth} />;
    else page = <Dashboard go={go} onSignOut={onSignOut} agent={agent} setAgent={setAgent} />;
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
      <Nav route={route} go={go} agent={agent} onSignOut={onSignOut} />
      <main style={{ flex: 1 }}>{page}</main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
