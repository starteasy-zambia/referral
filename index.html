/* ================================================================
   STARTEASY REFERRAL PROGRAM — STANDALONE APP
   ================================================================ */
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ---------------- CONFIG ---------------- */
const CONFIG = {
  firebase: {
    apiKey: "AIzaSyDdEyxvsd2RjgKVYTGYJfYUB_637lV3n5I",
    authDomain: "starteasy-zambia.firebaseapp.com",
    projectId: "starteasy-zambia",
    storageBucket: "starteasy-zambia.firebasestorage.app",
    messagingSenderId: "54136399237",
    appId: "1:54136399237:web:2f9f2d7f86bfdfb4be50ec",
    measurementId: "G-R622H7H5LJ"
  },
  mainSiteUrl: 'https://starteasyzambia.com',
  adminWhatsapp: '260762499581',
  contactEmail: 'referrals@starteasyzambia.com',
  attributionDays: 30,
  minPayoutZmw: 200,
  clearingDays: 7,
  commissionTable: {
    micro: 40, basic: 30, standard: 25, complex: 22,
    checkup: 22, regularise: 18, venture: 20,
    ongoing_filing: 20, ongoing_standard: 20, ongoing_managed: 15
  }
};

const SE_AGENTS = 'se_agents';
const SE_COMMISSIONS = 'se_commissions';
const SE_PAYOUTS = 'se_payouts';
const SE_PAYMENTS = 'se_payments';
const SE_EVENTS = 'se_events';
const SE_ADMINS = 'se_admins';
const REF_KEY = 'starteasy.ref.v1';
const CODE_RX = /^SE-[A-Z0-9-]{3,32}$/;

/* ---------------- FIREBASE ---------------- */
let db = null, auth = null, fbReady = false;
try {
  if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(CONFIG.firebase);
  db = firebase.firestore();
  auth = firebase.auth();
  fbReady = true;
} catch (e) {
  console.error('[Referral] Firebase init failed:', e);
}

/* ---------------- HELPERS ---------------- */
const fmtZmw = n => 'K' + (Number(n) || 0).toFixed(2);
const fmtInt = n => String(Number(n) || 0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const timeAgo = ts => {
  if (!ts) return '';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  const d = Math.floor(s / 86400);
  return d + 'd ago';
};
const copyText = async t => {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(t); return true;
    }
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    return true;
  } catch (e) { return false; }
};
const isMobileUA = () => /android|iphone|ipad|ipod|mobile/i.test((navigator.userAgent || '').toLowerCase());
const waUrl = (msg, phone) => {
  const p = phone || CONFIG.adminWhatsapp;
  const e = encodeURIComponent(msg);
  return isMobileUA() ? 'whatsapp://send?phone=' + p + '&text=' + e : 'https://wa.me/' + p + '?text=' + e;
};
const baseUrl = () => window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/');
const generateAgentCode = name => {
  const clean = String(name || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 8) || 'AGENT';
  const rand = Math.random().toString(36).slice(2, 6).toUpperCase();
  return 'SE-' + clean + '-' + rand;
};
const resolveServiceType = payment => {
  const code = String(payment.serviceCode || '').toUpperCase();
  if (code === 'P0' || code === 'P1') return 'micro';
  if (code === 'P2') return 'complex';
  if (code === 'C1') return 'checkup';
  if (code === 'C2') return 'regularise';
  if (code === 'C3') return 'ongoing_managed';
  if (code.startsWith('V-')) return 'venture';
  if (payment.ongoing === 'managed') return 'ongoing_managed';
  if (payment.ongoing === 'standard') return 'ongoing_standard';
  if (payment.ongoing === 'filing') return 'ongoing_filing';
  return 'standard';
};
const calcCommission = (type, gross) => {
  const pct = CONFIG.commissionTable[type] || 25;
  return { pct, amount: Math.round(gross * pct) / 100 };
};

/* ---------------- ATTRIBUTION ---------------- */
const readAttribution = () => {
  try {
    const raw = JSON.parse(localStorage.getItem(REF_KEY) || 'null');
    if (!raw || !raw.code) return null;
    if (Date.now() - raw.at > CONFIG.attributionDays * 24 * 3600 * 1000) return null;
    return raw;
  } catch (e) { return null; }
};

const storeAttribution = code => {
  try {
    const c = String(code).toUpperCase().trim();
    if (!CODE_RX.test(c)) return null;
    const rec = { code: c, at: Date.now(), src: window.location.href };
    localStorage.setItem(REF_KEY, JSON.stringify(rec));
    return rec;
  } catch (e) { return null; }
};

const logReferralClick = async code => {
  if (!fbReady) return;
  try {
    await db.collection(SE_EVENTS).add({
      type: 'referral_click',
      agentCode: code,
      at: Date.now(),
      route: 'redirect'
    });
    // Bump click counter on agent (best-effort, non-blocking)
    const q = await db.collection(SE_AGENTS).where('agentCode', '==', code).limit(1).get();
    if (!q.empty) {
      const ref = q.docs[0].ref;
      await db.runTransaction(async t => {
        const s = await t.get(ref);
        if (!s.exists) return;
        const d = s.data(); const tot = d.totals || {};
        t.update(ref, { 'totals.clicks': (tot.clicks || 0) + 1 });
      });
    }
  } catch (e) { console.warn('[Referral] logClick failed:', e); }
};

/* ---------------- COMMISSION ENGINE ---------------- */
const createCommissionForPayment = async (payment, agent) => {
  if (!fbReady) return { ok: false, error: 'Firebase not ready' };
  if (!payment || !payment.ref) return { ok: false, error: 'No payment ref' };
  if (!agent || !agent.id || !agent.agentCode) return { ok: false, error: 'No agent' };

  // Idempotency
  const existing = await db.collection(SE_COMMISSIONS)
    .where('paymentRef', '==', payment.ref).limit(1).get();
  if (!existing.empty) {
    return { ok: true, commission: { id: existing.docs[0].id, ...existing.docs[0].data() }, skipped: true };
  }

  const gross = parseFloat(String(payment.amount || '0').replace(/[^\d.]/g, '')) || 0;
  if (gross <= 0) return { ok: false, error: 'Invalid amount' };

  const serviceType = resolveServiceType(payment);
  const { pct, amount } = calcCommission(serviceType, gross);

  const commission = {
    agentId: agent.id, agentCode: agent.agentCode,
    paymentRef: payment.ref,
    serviceCode: payment.serviceCode || '',
    serviceTitle: payment.serviceTitle || '',
    serviceType,
    grossZmw: gross,
    commissionPct: pct,
    commissionZmw: amount,
    status: 'pending',
    createdAt: Date.now(),
    approvedAt: Date.now(),
    clearAt: Date.now() + CONFIG.clearingDays * 24 * 3600 * 1000,
    paidAt: null, payoutId: null, reversedAt: null
  };

  const added = await db.collection(SE_COMMISSIONS).add(commission);

  // Bump agent totals (transaction)
  const agentRef = db.collection(SE_AGENTS).doc(agent.id);
  await db.runTransaction(async t => {
    const s = await t.get(agentRef);
    if (!s.exists) return;
    const d = s.data(); const tot = d.totals || {};
    t.update(agentRef, {
      'totals.conversions': (tot.conversions || 0) + 1,
      'totals.pendingZmw': (tot.pendingZmw || 0) + amount
    });
  });

  return { ok: true, commission: { id: added.id, ...commission } };
};

const cancelCommissionForPayment = async paymentRef => {
  if (!fbReady || !paymentRef) return { ok: false };
  try {
    const snap = await db.collection(SE_COMMISSIONS)
      .where('paymentRef', '==', paymentRef).limit(1).get();
    if (snap.empty) return { ok: true, skipped: true };
    const doc = snap.docs[0];
    const c = doc.data();
    if (c.status === 'paid') return { ok: false, error: 'Already paid' };
    await doc.ref.update({ status: 'cancelled', reversedAt: Date.now() });
    const agentRef = db.collection(SE_AGENTS).doc(c.agentId);
    await db.runTransaction(async t => {
      const s = await t.get(agentRef);
      if (!s.exists) return;
      const d = s.data(); const tot = d.totals || {};
      t.update(agentRef, {
        'totals.pendingZmw': Math.max(0, (tot.pendingZmw || 0) - c.commissionZmw),
        'totals.conversions': Math.max(0, (tot.conversions || 0) - 1)
      });
    });
    return { ok: true };
  } catch (e) { return { ok: false, error: e && e.message }; }
};

const markPayoutPaid = async payoutId => {
  if (!fbReady) return { ok: false };
  try {
    const ref = db.collection(SE_PAYOUTS).doc(payoutId);
    const snap = await ref.get();
    if (!snap.exists) return { ok: false, error: 'Not found' };
    const po = snap.data();
    if (po.status === 'paid') return { ok: true, skipped: true };

    const batch = db.batch();
    batch.update(ref, { status: 'paid', paidAt: Date.now() });
    (po.commissionIds || []).forEach(cid => {
      batch.update(db.collection(SE_COMMISSIONS).doc(cid), {
        status: 'paid', paidAt: Date.now(), payoutId
      });
    });
    await batch.commit();

    const agentRef = db.collection(SE_AGENTS).doc(po.agentId);
    await db.runTransaction(async t => {
      const s = await t.get(agentRef);
      if (!s.exists) return;
      const d = s.data(); const tot = d.totals || {};
      t.update(agentRef, {
        'totals.earnedZmw': (tot.earnedZmw || 0) + po.amountZmw,
        'totals.paidZmw':   (tot.paidZmw || 0) + po.amountZmw,
        'totals.pendingZmw': Math.max(0, (tot.pendingZmw || 0) - po.amountZmw)
      });
    });
    return { ok: true };
  } catch (e) { return { ok: false, error: e && e.message }; }
};

/* Sync: scan recent approved payments with referralCode and create missing commissions */
const syncCommissions = async () => {
  if (!fbReady) return { created: 0, cancelled: 0 };
  let created = 0, cancelled = 0;
  try {
    // 1. Find approved payments with referralCode in last 500
    const paysSnap = await db.collection(SE_PAYMENTS)
      .where('status', '==', 'approved')
      .orderBy('submittedAt', 'desc').limit(500).get();
    const withRef = paysSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.referralCode);

    for (const pay of withRef) {
      const exists = await db.collection(SE_COMMISSIONS)
        .where('paymentRef', '==', pay.ref).limit(1).get();
      if (!exists.empty) continue;

      const q = await db.collection(SE_AGENTS)
        .where('agentCode', '==', pay.referralCode).limit(1).get();
      if (q.empty) continue;
      const agent = { id: q.docs[0].id, ...q.docs[0].data() };
      if (agent.status !== 'active') continue;

      // Self-referral guard
      if (pay.clientEmail && agent.email && pay.clientEmail.toLowerCase() === agent.email.toLowerCase()) continue;
      if (pay.clientPhone && agent.phone && pay.clientPhone.replace(/\D/g, '') === agent.phone.replace(/\D/g, '')) continue;

      const r = await createCommissionForPayment(pay, agent);
      if (r.ok && !r.skipped) created++;
    }

    // 2. Cancel commissions whose payment was reverted/declined
    const cancellingSnap = await db.collection(SE_PAYMENTS)
      .where('status', 'in', ['reverted', 'declined'])
      .orderBy('submittedAt', 'desc').limit(200).get();
    for (const d of cancellingSnap.docs) {
      const p = d.data();
      if (!p.ref) continue;
      const cSnap = await db.collection(SE_COMMISSIONS)
        .where('paymentRef', '==', p.ref).limit(1).get();
      if (cSnap.empty) continue;
      const c = cSnap.docs[0].data();
      if (c.status === 'pending' || c.status === 'earned') {
        const r = await cancelCommissionForPayment(p.ref);
        if (r.ok) cancelled++;
      }
    }
  } catch (e) { console.warn('[Referral] sync failed:', e); }
  return { created, cancelled };
};

/* ---------------- UI PRIMITIVES ---------------- */
function Mark({ size = 36 }) {
  return (
    <span style={{
      width: size, height: size, borderRadius: '50%', overflow: 'hidden',
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',

      boxShadow: '0 4px 12px -4px rgba(10,31,18,.5)',
      color: '#fff', fontFamily: "'Playfair Display',serif", fontWeight: 800,
      fontSize: size * 0.5, flexShrink: 0
    }}>S</span>
  );
}

function Btn({ children, onClick, variant = 'primary', size = 'md', disabled, style, type = 'button' }) {
  const base = {
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 9,
    border: 'none', borderRadius: 10, cursor: disabled ? 'not-allowed' : 'pointer',
    fontFamily: 'inherit', fontWeight: 700, transition: 'all .2s',
    opacity: disabled ? 0.55 : 1, whiteSpace: 'nowrap'
  };
  const sizes = {
    sm: { padding: '9px 14px', fontSize: 12 },
    md: { padding: '12px 20px', fontSize: 13.5 },
    lg: { padding: '15px 28px', fontSize: 14.5 }
  };
  const variants = {
    primary: { background: 'linear-gradient(135deg,#E8730F,#F5A623)', color: '#fff' },
    dark: { background: '#0A1F12', color: '#fff' },
    ghost: { background: '#fff', color: '#0A1F12', border: '1px solid rgba(10,31,18,.15)' },
    ghostLt: { background: 'rgba(255,255,255,.06)', color: '#fff', border: '1px solid rgba(255,255,255,.2)' },
    whatsapp: { background: '#25D366', color: '#fff' },
    success: { background: '#1E7B3C', color: '#fff' },
    danger: { background: '#B8564F', color: '#fff' },
    warning: { background: '#F5A623', color: '#0A1F12' },
    purple: { background: '#7A4FA3', color: '#fff' }
  };
  return (
    <button type={type} onClick={onClick} disabled={disabled}
      style={{ ...base, ...sizes[size], ...variants[variant], ...style }}>
      {children}
    </button>
  );
}

function Input({ value, onChange, placeholder, type = 'text', label, required, error, hint, autoComplete }) {
  return (
    <div style={{ marginBottom: 14 }}>
      {label && (
        <label style={{ display: 'block', fontSize: 12.5, fontWeight: 600, color: '#0A1F12', marginBottom: 6 }}>
          {label}{required && ' *'}

      <input type={type} value={value || ''} onChange={e => onChange(e.target.value)}
        placeholder={placeholder} autoComplete={autoComplete}
        style={{
          width: '100%', background: '#fff',
          border: `2px solid ${error ? '#B8564F' : 'rgba(10,31,18,.12)'}`,
          borderRadius: 10, padding: '12px 16px', fontSize: 14,
          color: '#0A1F12', fontFamily: 'inherit'

      {hint && !error && <div style={{ fontSize: 11.5, color: 'rgba(10,31,18,.5)', marginTop: 5 }}>{hint}</div>}
      {error && <div style={{ fontSize: 11.5, color: '#B8564F', marginTop: 5 }}>{error}</div>}
    </div>
  );
}

        </label>

      <select value={value || ''} onChange={e => onChange(e.target.value)}
        style={{

          border: '2px solid rgba(10,31,18,.12)', borderRadius: 10,

/* Error boundary */
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error('[Referral] UI error:', err, info); }
  render() {
    if (this.state.err) return (
      <div style={{ padding: 80, textAlign: 'center' }}>
        <h2 className="serif" style={{ fontSize: 24, color: '#0A1F12', marginBottom: 10 }}>Something went wrong</h2>
        <p style={{ fontSize: 13, color: 'rgba(10,31,18,.6)', marginBottom: 20 }}>Please refresh the page.</p>
        <Btn onClick={() => window.location.reload()}>Refresh</Btn>
      </div>
    );
    return this.props.children;
  }
}

/* ---------------- PAGE: APPLY ---------------- */
function ApplyPage({ go }) {
  const [form, setForm] = useState({
    displayName: '', email: '', phone: '', location: '',
    experience: '', motivation: '', consent: false
  });
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);
  const [err, setErr] = useState('');

  const submit = async () => {
    setErr('');
    if (!form.displayName.trim()) return setErr('Please enter your full name.');
    if (!form.email.trim() || !/^\S+@\S+\.\S+$/.test(form.email)) return setErr('Enter a valid email.');
    if (!form.phone.trim() || form.phone.replace(/\D/g, '').length < 9) return setErr('Enter a valid phone number.');
    if (!form.location) return setErr('Choose your location.');
    if (!form.motivation.trim() || form.motivation.trim().length < 20) return setErr('Please describe (20+ chars) how you plan to find customers.');
    if (!form.consent) return setErr('Please accept the program terms.');
    if (!fbReady) return setErr('Service unavailable. Please refresh.');

    setBusy(true);
    try {
      // Prevent duplicate pending applications by email
      const existing = await db.collection(SE_AGENTS)
        .where('email', '==', form.email.trim().toLowerCase()).limit(1).get();
      if (!existing.empty) {
        const s = existing.docs[0].data().status;
        if (s === 'active') return setErr('This email already has an active account. Try signing in instead.');
        if (s === 'pending') return setErr('An application for this email is already under review.');
        // rejected — allow re-apply by creating a new doc
      }

      await db.collection(SE_AGENTS).add({
        uid: '',
        agentCode: '',
        displayName: form.displayName.trim(),
        email: form.email.trim().toLowerCase(),
        phone: form.phone.trim(),
        location: form.location,
        experience: form.experience.trim(),
        motivation: form.motivation.trim(),
        status: 'pending',
        commissionPct: 0,
        paymentMethod: null,
        createdAt: Date.now(),
        approvedAt: null,
        approvedBy: null,
        totals: { clicks: 0, conversions: 0, earnedZmw: 0, paidZmw: 0, pendingZmw: 0 }
      });
      try { db.collection(SE_EVENTS).add({ type: 'agent_applied', at: Date.now(), location: form.location }); } catch (e) {}
      setDone(true);
    } catch (e) {
      setErr('Could not submit. Please try again or message us on WhatsApp.');
    } finally { setBusy(false); }
  };

  if (done) {
    return (
      <div style={{ maxWidth: 640, margin: '60px auto', padding: '0 24px' }}>
        <div style={{
          background: '#EAF7EE', border: '2px solid #1E7B3C',
          borderRadius: 14, padding: '34px 28px', textAlign: 'center'
        }}>
          <i className="fas fa-check-circle" style={{ fontSize: 46, color: '#1E7B3C', marginBottom: 14, display: 'block' }}></i>
          <h2 className="serif" style={{ fontSize: 24, color: '#0A1F12', marginBottom: 10 }}>
            Application received
          </h2>
          <p style={{ fontSize: 14, color: 'rgba(10,31,18,.7)', marginBottom: 18, lineHeight: 1.65 }}>
            Thank you, {form.displayName.split(' ')[0]}. Our team will review your application and contact you on WhatsApp within <strong>2 working days</strong>.
          </p>
          <a href={waUrl(`Hello StartEasy — I just applied to join the Referral Program. My name is ${form.displayName}.`)}
            target="_blank" rel="noopener noreferrer"
            style={{
              display: 'inline-flex', alignItems: 'center', gap: 9,
              padding: '12px 22px', background: '#25D366', color: '#fff',
              borderRadius: 9, fontSize: 13.5, fontWeight: 700,
              textDecoration: 'none', marginBottom: 12
            }}>
            <i className="fab fa-whatsapp"></i> Message us to speed things up
          </a>
          <div>
            <button onClick={() => go('')} style={{
              padding: '11px 20px', background: '#fff',
              border: '1px solid rgba(10,31,18,.15)', borderRadius: 8,
              fontSize: 13, fontWeight: 600, cursor: 'pointer',
              fontFamily: 'inherit', color: '#0A1F12'
            }}>Back to home</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 640, margin: '0 auto', padding: '56px 24px' }}>
      <button onClick={() => go('')} style={{
        background: 'none', border: 'none', color: 'rgba(10,31,18,.6)',
        fontSize: 11.5, letterSpacing: '.14em', textTransform: 'uppercase',
        fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit',
        marginBottom: 20, display: 'inline-flex', alignItems: 'center', gap: 8
      }}>

/* ---------------- PAGE: LOGIN + SIGNUP ---------------- */
function LoginPage({ go, onAuth }) {
  const [mode, setMode] = useState('signin'); // 'signin' | 'signup'
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [info, setInfo] = useState('');

  const doSignIn = async () => {
    setErr(''); setInfo('');
    if (!email.trim() || !pw) return setErr('Enter your email and password.');
    setBusy(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), pw);
      const user = auth.currentUser;
      const snap = await db.collection(SE_AGENTS).doc(user.uid).get();
      if (!snap.exists) {
        // Try by email
        const q = await db.collection(SE_AGENTS)
          .where('email', '==', (user.email || '').toLowerCase()).limit(1).get();
        if (q.empty) {
          await auth.signOut();
          return setErr('No application found with this email. Please apply first.');
        }
        await q.docs[0].ref.update({ uid: user.uid });
      }
      onAuth();
    } catch (e) {
      const c = e && e.code;
      if (c === 'auth/wrong-password' || c === 'auth/invalid-credential') setErr('Incorrect email or password.');
      else if (c === 'auth/user-not-found') setErr('No account found. Click "Create account" if you have been approved.');
      else if (c === 'auth/too-many-requests') setErr('Too many attempts. Wait a few minutes.');
      else setErr(e && e.message ? e.message : 'Sign in failed.');
    } finally { setBusy(false); }
  };

  const doSignUp = async () => {
    setErr(''); setInfo('');
    if (!email.trim() || !/^\S+@\S+\.\S+$/.test(email)) return setErr('Enter a valid email.');
    if (!pw || pw.length < 6) return setErr('Password must be at least 6 characters.');
    if (pw !== pw2) return setErr('Passwords do not match.');
    setBusy(true);

    // First check for an existing application BEFORE creating the auth account
    try {
      const q = await db.collection(SE_AGENTS)
        .where('email', '==', email.trim().toLowerCase()).limit(1).get();
      if (q.empty) {
        setBusy(false);
        return setErr('No application found with this email. Please apply first.');
      }
      const st = q.docs[0].data().status;
      if (st === 'rejected') {
        setBusy(false);
        return setErr('Your application was not approved. Please contact us.');
      }

      // Create the auth account
      const cred = await auth.createUserWithEmailAndPassword(email.trim(), pw);

      // Link uid to the pending/active doc
      await q.docs[0].ref.update({ uid: cred.user.uid });

      if (st === 'pending') {
        setInfo('Account created. Your application is still under review — we will activate your code shortly.');
        // stay signed in; dashboard will show "under review"
        onAuth();
      } else if (st === 'active') {
        onAuth();
      } else if (st === 'suspended') {
        setInfo('Your account is currently suspended. Please contact us.');
        onAuth();
      }
    } catch (e) {
      const c = e && e.code;
      if (c === 'auth/email-already-in-use') setErr('This email already has an account. Try signing in instead.');
      else if (c === 'auth/weak-password') setErr('Password must be at least 6 characters.');
      else setErr(e && e.message ? e.message : 'Sign up failed.');
    } finally { setBusy(false); }
  };

  return (
    <div style={{
      minHeight: '70vh',
      background: 'linear-gradient(135deg,#0A1F12,#123A1F)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: '48px 20px'
    }}>
      <div style={{ background: '#fff', borderRadius: 14, padding: '34px 30px', maxWidth: 440, width: '100%', boxShadow: '0 30px 80px rgba(0,0,0,.3)' }}>
        <h1 className="serif" style={{ fontSize: 24, color: '#0A1F12', marginBottom: 6 }}>
          {mode === 'signin' ? 'Agent sign in' : 'Create your account'}
        </h1>
        <p style={{ fontSize: 13, color: 'rgba(10,31,18,.6)', marginBottom: 22, lineHeight: 1.6 }}>
          {mode === 'signin'
            ? 'Sign in with the email and password you set up.'
            : 'First time here? Set a password for the email you applied with.'}
        </p>

        <div style={{ display: 'flex', gap: 8, marginBottom: 20, background: 'rgba(10,31,18,.05)', padding: 4, borderRadius: 10 }}>
          {[['signin', 'Sign in'], ['signup', 'Create account']].map(([k, l]) => (
            <button key={k} onClick={() => { setMode(k); setErr(''); setInfo(''); }}
              style={{
                flex: 1, padding: '10px', border: 'none', borderRadius: 8,
                background: mode === k ? '#0A1F12' : 'transparent',
                color: mode === k ? '#fff' : 'rgba(10,31,18,.6)',
                fontSize: 12.5, fontWeight: 700, cursor: 'pointer',
                fontFamily: 'inherit'
              }}>{l}</button>
          ))}
        </div>

        <Input label="Email" type="email" value={email} onChange={setEmail} placeholder="you@example.com" autoComplete="email" />
        <Input label="Password" type="password" value={pw} onChange={setPw} placeholder="••••••••" autoComplete={mode === 'signin' ? 'current-password' : 'new-password'} />
        {mode === 'signup' && (
          <Input label="Confirm password" type="password" value={pw2} onChange={setPw2} placeholder="••••••••" autoComplete="new-password" />
        )}

        {err && (
          <div style={{
            background: 'rgba(184,86,79,.08)', border: '1px solid rgba(184,86,79,.3)',
            borderRadius: 8, padding: '10px 14px', marginBottom: 14,
            color: '#B8564F', fontSize: 12.5, lineHeight: 1.5
          }}>{err}</div>
        )}
        {info && (
          <div style={{
            background: 'rgba(30,123,60,.08)', border: '1px solid rgba(30,123,60,.3)',
            borderRadius: 8, padding: '10px 14px', marginBottom: 14,
            color: '#1E7B3C', fontSize: 12.5, lineHeight: 1.5
          }}>{info}</div>
        )}

        <Btn onClick={mode === 'signin' ? doSignIn : doSignUp} disabled={busy} size="lg" variant="primary" style={{ width: '100%' }}>
          {busy ? 'Please wait…' : mode === 'signin' ? 'Sign in' : 'Create account'}
        </Btn>

        <p style={{ fontSize: 12, color: 'rgba(10,31,18,.55)', textAlign: 'center', marginTop: 16, lineHeight: 1.65 }}>
          Not registered yet?{' '}
          <button onClick={() => go('apply')} style={{
            background: 'none', border: 'none', color: '#E8730F',
            fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit',
            fontSize: 12, textDecoration: 'underline'
          }}>Apply to become an agent</button>.
        </p>
      </div>
    </div>
  );
}

  useEffect(() => {
    if (!agent) return;
    const unsubs = [];

    // Live agent doc
    unsubs.push(db.collection(SE_AGENTS).doc(agent.id).onSnapshot(s => {
      if (s.exists) setAgent({ id: s.id, ...s.data() });
    }));

    // Live commissions
    unsubs.push(db.collection(SE_COMMISSIONS)
      .where('agentId', '==', agent.id)

      .onSnapshot(s => setCommissions(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => {}));

function SettingsTab({ agent, onSave }) {
  const [method, setMethod] = useState(agent.paymentMethod?.type || 'airtel');
  const [number, setNumber] = useState(agent.paymentMethod?.number || '');
  const [holder, setHolder] = useState(agent.paymentMethod?.holder || agent.displayName || '');
  const [msg, setMsg] = useState('');

  const save = () => {
    setMsg('');
    if (!number.trim() || !holder.trim()) {
      setMsg('Holder and account number are required.');
      return;
    }
    const label = method === 'airtel' ? 'Airtel Money' : method === 'mtn' ? 'MTN MoMo' : 'Bank';
    onSave({ type: method, label, number: number.trim(), holder: holder.trim() });
  };

  return (
    <div>
      <p style={{ fontSize: 13, color: 'rgba(10,31,18,.65)', marginBottom: 18, lineHeight: 1.65 }}>
        Commissions are paid to this account. Please make sure the details match your name.
      </p>
      <Select label="Payout method" value={method} onChange={setMethod}
        options={[
          { value: 'airtel', label: 'Airtel Money' },
          { value: 'mtn', label: 'MTN MoMo' },
          { value: 'bank', label: 'Bank transfer' }
        ]} />
      <Input label="Account holder name" required value={holder} onChange={setHolder} />
      <Input label={method === 'bank' ? 'Account number' : 'Mobile number'} required
        value={number} onChange={setNumber}
        placeholder={method === 'bank' ? '0152…' : '+260…'} />
      {msg && (
        <div style={{
          background: 'rgba(30,123,60,.08)', border: '1px solid rgba(30,123,60,.3)',
          borderRadius: 8, padding: '10px 14px', marginBottom: 14,
          color: '#1E7B3C', fontSize: 12.5
        }}>{msg}</div>
      )}
      <Btn onClick={save} variant="primary"><i className="fas fa-check"></i> Save payout method</Btn>
    </div>
  );
}

/* ---------------- PAGE: REDIRECT HANDLER #/r/:code ---------------- */
function RedirectHandler({ code, navigate }) {
  const [status, setStatus] = useState('loading');

  useEffect(() => {
    if (!code || !CODE_RX.test(code)) {
      setStatus('invalid');
      return;
    }
    // Log click, store attribution, redirect to main site
    logReferralClick(code);
    storeAttribution(code);
    setStatus('redirecting');
    const t = setTimeout(() => {
      const target = CONFIG.mainSiteUrl + '/?ref=' + encodeURIComponent(code);
      window.location.href = target;
    }, 800);
    return () => clearTimeout(t);
  }, [code]);

  return (
    <div style={{
      minHeight: '70vh', display: 'flex', alignItems: 'center',
      justifyContent: 'center', padding: '40px 24px',
      background: 'linear-gradient(135deg,#0A1F12,#123A1F)', color: '#fff'
    }}>
      <div style={{ textAlign: 'center', maxWidth: 460 }}>
        {status === 'invalid' ? (
          <>
            <i className="fas fa-circle-exclamation" style={{ fontSize: 46, color: '#F5A623', marginBottom: 16, display: 'block' }}></i>
            <h2 className="serif" style={{ fontSize: 24, marginBottom: 12 }}>Invalid referral link</h2>
            <p style={{ fontSize: 14, color: 'rgba(255,255,255,.7)', marginBottom: 20, lineHeight: 1.65 }}>
              This referral link looks incorrect. Please ask the agent for a fresh link.
            </p>
            <Btn variant="primary" onClick={() => navigate('#/')}>Back to referral home</Btn>
          </>
        ) : (
          <>
            <Mark size={56} />
            <h2 className="serif" style={{ fontSize: 24, marginTop: 18, marginBottom: 12 }}>
              Taking you to StartEasy…
            </h2>
            <p style={{ fontSize: 14, color: 'rgba(255,255,255,.65)', marginBottom: 20, lineHeight: 1.65 }}>
              Your referral code is <strong style={{ fontFamily: 'Consolas,monospace', color: '#F5A623' }}>{code}</strong>. Redirecting you now.
            </p>
            <i className="fas fa-circle-notch spin" style={{ fontSize: 24, color: '#F5A623' }}></i>
            <div style={{ marginTop: 20 }}>
              <a href={CONFIG.mainSiteUrl + '/?ref=' + encodeURIComponent(code)}
                style={{ color: '#F5A623', fontSize: 12.5, fontWeight: 700, textDecoration: 'underline' }}>
                Not redirected? Click here
              </a>
            </div>

        )}

  );
}

/* ---------------- PAGE: ADMIN ---------------- */
function AdminPage({ go }) {
  const [authed, setAuthed] = useState(false);
  const [checking, setChecking] = useState(true);
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [tab, setTab] = useState('agents');
  const [agents, setAgents] = useState([]);
  const [commissions, setCommissions] = useState([]);
  const [payouts, setPayouts] = useState([]);
  const [review, setReview] = useState(null);
  const [msg, setMsg] = useState('');
  const [syncing, setSyncing] = useState(false);

  // Auth check
  useEffect(() => {
    if (!fbReady || !auth) { setChecking(false); return; }
    const unsub = auth.onAuthStateChanged(async user => {
      if (user) {
        try {
          const snap = await db.collection(SE_ADMINS).doc(user.uid).get();
          setAuthed(snap.exists);
        } catch (e) { setAuthed(false); }
      } else setAuthed(false);
      setChecking(false);
    });
    return unsub;
  }, []);

  // Data listeners + auto-sync
  useEffect(() => {
    if (!authed) return;
    const unsubs = [
      db.collection(SE_AGENTS).orderBy('createdAt', 'desc').limit(300)
        .onSnapshot(s => setAgents(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => {}),
      db.collection(SE_COMMISSIONS).orderBy('createdAt', 'desc').limit(300)
        .onSnapshot(s => setCommissions(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => {}),
      db.collection(SE_PAYOUTS).orderBy('requestedAt', 'desc').limit(300)
        .onSnapshot(s => setPayouts(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => {})
    ];
    // Auto-sync on load
    (async () => {
      setSyncing(true);
      const r = await syncCommissions();
      if (r.created || r.cancelled) setMsg(`Auto-synced: ${r.created} new commission(s), ${r.cancelled} cancelled.`);
      setSyncing(false);
    })();
    return () => unsubs.forEach(u => u());
  }, [authed]);

  const handleSignIn = async () => {
    setErr(''); setBusy(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), pw);
      const user = auth.currentUser;
      const check = await db.collection(SE_ADMINS).doc(user.uid).get();
      if (!check.exists) { await auth.signOut(); setErr('Not an admin account.'); return; }
      setAuthed(true);
    } catch (e) {
      const c = e && e.code;
      if (c === 'auth/wrong-password' || c === 'auth/invalid-credential') setErr('Incorrect email or password.');
      else setErr(e && e.message ? e.message : 'Sign-in failed.');
    } finally { setBusy(false); }
  };

  const approveAgent = async (agent, code, pct) => {
    setMsg('');
    const c = (code || '').toUpperCase().trim();
    if (!CODE_RX.test(c)) return setMsg('Code must match format SE-NAME-XXXX.');
    const dup = await db.collection(SE_AGENTS).where('agentCode', '==', c).limit(1).get();
    if (!dup.empty) return setMsg('That code is already taken.');
    await db.collection(SE_AGENTS).doc(agent.id).update({
      agentCode: c,
      status: 'active',
      commissionPct: Number(pct) || 25,
      approvedAt: Date.now(),
      approvedBy: auth.currentUser ? auth.currentUser.uid : ''
    });
    setMsg(`Agent approved: ${c}. Tell them to sign up at #/login → "Create account" using ${agent.email}.`);
    setReview(null);
  };

  const rejectAgent = async agent => {
    const reason = window.prompt('Reason (visible only to admin):', '') || '';
    await db.collection(SE_AGENTS).doc(agent.id).update({
      status: 'rejected', rejectionReason: reason, reviewedAt: Date.now()
    });
    setMsg('Agent rejected.');
    setReview(null);
  };

  const suspendAgent = async agent => {
    if (!window.confirm('Suspend this agent?')) return;
    await db.collection(SE_AGENTS).doc(agent.id).update({ status: 'suspended' });
    setMsg('Agent suspended.');
  };

  const unsuspendAgent = async agent => {
    await db.collection(SE_AGENTS).doc(agent.id).update({ status: 'active' });
    setMsg('Agent reactivated.');
  };

  const markPaid = async payout => {
    if (!window.confirm(`Mark ${fmtZmw(payout.amountZmw)} to ${payout.agentCode} as paid? Confirm you have sent the money.`)) return;
    const r = await markPayoutPaid(payout.id);
    setMsg(r.ok ? 'Payout marked paid.' : 'Failed: ' + (r.error || 'unknown'));
  };

  const manualSync = async () => {
    setSyncing(true);
    const r = await syncCommissions();
    setMsg(`Sync complete: ${r.created} created, ${r.cancelled} cancelled.`);
    setSyncing(false);
  };

  if (checking) return <Spinner label="Checking admin access…" />;

  if (!authed) {
    return (
      <div style={{
        minHeight: '70vh', background: 'linear-gradient(135deg,#0A1F12,#123A1F)',
        display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '48px 20px'
      }}>
        <div style={{ background: '#fff', borderRadius: 14, padding: '34px 30px', maxWidth: 420, width: '100%' }}>
          <h1 className="serif" style={{ fontSize: 22, color: '#0A1F12', marginBottom: 6 }}>Referral admin</h1>
          <p style={{ fontSize: 12.5, color: 'rgba(10,31,18,.6)', marginBottom: 20 }}>
            Sign in with your StartEasy admin account.
          </p>
          <Input label="Admin email" type="email" value={email} onChange={setEmail} />
          <Input label="Password" type="password" value={pw} onChange={setPw} />
          {err && (
            <div style={{
              background: 'rgba(184,86,79,.08)', border: '1px solid rgba(184,86,79,.3)',
              borderRadius: 8, padding: '10px 14px', marginBottom: 14,
              color: '#B8564F', fontSize: 12.5
            }}>{err}</div>
          )}
          <Btn onClick={handleSignIn} disabled={busy} variant="primary" size="lg" style={{ width: '100%' }}>
            {busy ? 'Signing in…' : 'Sign in'}
          </Btn>
        </div>
      </div>
    );
  }

  const pendingAgents = agents.filter(a => a.status === 'pending');
  const activeAgents = agents.filter(a => a.status === 'active');
  const requestedPayouts = payouts.filter(p => p.status === 'requested');

  return (
    <div className="fadein" style={{ minHeight: '100vh' }}>
      <section style={{ background: '#0A1F12', color: '#fff', padding: '20px 24px' }}>
        <div style={{ maxWidth: 1240, margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
          <div>
            <div style={{ fontSize: 9, letterSpacing: '.18em', textTransform: 'uppercase', fontWeight: 700, color: 'rgba(255,255,255,.4)' }}>
              Referral Program
            </div>
            <div className="serif" style={{ fontSize: 22, fontWeight: 800, color: '#fff', lineHeight: 1.1 }}>
              Admin Portal
            </div>
          </div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            <button onClick={manualSync} disabled={syncing} style={{
              padding: '9px 16px', background: syncing ? 'rgba(255,255,255,.05)' : 'rgba(245,166,35,.15)',
              color: '#F5A623', border: '1px solid rgba(245,166,35,.4)',
              borderRadius: 8, fontSize: 12, fontWeight: 700,
              cursor: syncing ? 'wait' : 'pointer', fontFamily: 'inherit'
            }}>
              <i className={`fas ${syncing ? 'fa-circle-notch spin' : 'fa-sync'}`}></i> {syncing ? 'Syncing…' : 'Sync commissions'}
            </button>
            <button onClick={() => go('')} style={{
              padding: '9px 16px', background: 'rgba(255,255,255,.06)',
              color: '#fff', border: '1px solid rgba(255,255,255,.2)',
              borderRadius: 8, fontSize: 12, fontWeight: 700,
              cursor: 'pointer', fontFamily: 'inherit'
            }}>← Site</button>
            <button onClick={() => { auth.signOut(); setAuthed(false); }} style={{
              padding: '9px 16px', background: 'rgba(184,86,79,.15)',
              color: '#FFB4A8', border: '1px solid rgba(184,86,79,.35)',
              borderRadius: 8, fontSize: 12, fontWeight: 700,
              cursor: 'pointer', fontFamily: 'inherit'
            }}>Sign out</button>
          </div>
        </div>
      </section>

      <section style={{ background: '#fff', borderBottom: '1px solid rgba(10,31,18,.08)' }}>
        <div style={{ maxWidth: 1240, margin: '0 auto', padding: '0 24px', display: 'flex', gap: 6, overflowX: 'auto' }}>
          {[
            ['agents', 'Agents', 'fa-users', pendingAgents.length],
            ['commissions', 'Commissions', 'fa-receipt', commissions.length],
            ['payouts', 'Payouts', 'fa-money-bill-transfer', requestedPayouts.length]
          ].map(([k, l, ic, n]) => (
            <button key={k} onClick={() => setTab(k)}
              style={{
                padding: '14px 16px', background: 'none', border: 'none',
                borderBottom: tab === k ? '3px solid #E8730F' : '3px solid transparent',
                fontSize: 13, fontWeight: 700, cursor: 'pointer',
                fontFamily: 'inherit',
                color: tab === k ? '#0A1F12' : 'rgba(10,31,18,.55)',
                display: 'inline-flex', alignItems: 'center', gap: 8,
                flexShrink: 0
              }}>
              <i className={`fas ${ic}`} style={{ fontSize: 11 }}></i> {l}
              {n > 0 && (
                <span style={{
                  background: k === 'payouts' ? '#E8730F' : 'rgba(10,31,18,.1)',
                  color: k === 'payouts' ? '#fff' : '#0A1F12',
                  fontSize: 10, padding: '2px 7px', borderRadius: 99, fontWeight: 800

      <section style={{ maxWidth: 1240, margin: '0 auto', padding: '28px 24px 60px' }}>

            background: 'rgba(30,123,60,.1)', border: '1px solid rgba(30,123,60,.3)',
            borderRadius: 8, padding: '11px 14px', marginBottom: 16,
            color: '#1E7B3C', fontSize: 12.5, fontWeight: 600, lineHeight: 1.55
          }}>{msg}</div>
        )}

        {tab === 'agents' && (
          <div>
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3" style={{ marginBottom: 20 }}>
              <Kpi label="Total agents" value={agents.length} icon="fa-users" />
              <Kpi label="Pending" value={pendingAgents.length} icon="fa-hourglass-half" color="#F5A623" />
              <Kpi label="Active" value={activeAgents.length} icon="fa-circle-check" color="#1E7B3C" />
              <Kpi label="Suspended" value={agents.filter(a => a.status === 'suspended').length} icon="fa-pause" color="#7A4FA3" />
            </div>

            <div style={{ background: '#fff', border: '1px solid rgba(10,31,18,.08)', borderRadius: 12, overflow: 'hidden' }}>
              <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 820 }}>
                  <thead>
                    <tr>
                      {['Name', 'Contact', 'Code', '%', 'Status', ''].map(h => (
                        <th key={h} style={{
                          textAlign: 'left', padding: '12px 16px',
                          background: '#FBFDFB', borderBottom: '1px solid rgba(10,31,18,.08)',
                          fontSize: 10.5, letterSpacing: '.1em', textTransform: 'uppercase',
                          fontWeight: 800, color: 'rgba(10,31,18,.5)'
                        }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {agents.map(a => (
                      <tr key={a.id} style={{ borderBottom: '1px solid rgba(10,31,18,.05)' }}>
                        <td style={{ padding: '12px 16px', fontSize: 13, color: '#0A1F12', fontWeight: 600 }}>
                          {a.displayName}
                        </td>
                        <td style={{ padding: '12px 16px', fontSize: 11.5, color: 'rgba(10,31,18,.65)' }}>
                          {a.email}<br />{a.phone}
                        </td>
                        <td style={{ padding: '12px 16px', fontFamily: 'Consolas,monospace', fontSize: 11.5 }}>
                          {a.agentCode || '—'}
                        </td>
                        <td style={{ padding: '12px 16px', fontSize: 12 }}>{a.commissionPct || '—'}%</td>
                        <td style={{ padding: '12px 16px' }}><Badge status={a.status} /></td>
                        <td style={{ padding: '12px 16px', whiteSpace: 'nowrap' }}>
                          <button onClick={() => setReview(a)} style={{
                            padding: '6px 12px', background: '#0A1F12', color: '#fff',
                            border: 'none', borderRadius: 6, fontSize: 11.5,
                            fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit'
                          }}>Open</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}

        {tab === 'commissions' && (
          <div style={{ background: '#fff', border: '1px solid rgba(10,31,18,.08)', borderRadius: 12, overflow: 'hidden' }}>
            <div style={{ overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 900 }}>
                <thead>
                  <tr>
                    {['Agent', 'Payment ref', 'Service', 'Fee', 'Commission', 'Status', 'When'].map(h => (
                      <th key={h} style={{
                        textAlign: 'left', padding: '12px 16px',
                        background: '#FBFDFB', borderBottom: '1px solid rgba(10,31,18,.08)',
                        fontSize: 10.5, letterSpacing: '.1em', textTransform: 'uppercase',
                        fontWeight: 800, color: 'rgba(10,31,18,.5)'
                      }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {commissions.map(c => (
                    <tr key={c.id} style={{ borderBottom: '1px solid rgba(10,31,18,.05)' }}>
                      <td style={{ padding: '12px 16px', fontFamily: 'Consolas,monospace', fontSize: 11.5 }}>{c.agentCode}</td>
                      <td style={{ padding: '12px 16px', fontFamily: 'Consolas,monospace', fontSize: 11.5 }}>{c.paymentRef}</td>
                      <td style={{ padding: '12px 16px', fontSize: 12.5 }}>{c.serviceTitle}</td>
                      <td style={{ padding: '12px 16px', fontSize: 12.5 }}>{fmtZmw(c.grossZmw)}</td>
                      <td style={{ padding: '12px 16px', fontSize: 12.5, fontWeight: 700, color: '#E8730F' }}>
                        {fmtZmw(c.commissionZmw)}{' '}
                        <span style={{ fontSize: 10.5, color: 'rgba(10,31,18,.5)' }}>({c.commissionPct}%)</span>
                      </td>
                      <td style={{ padding: '12px 16px' }}><Badge status={c.status} /></td>
                      <td style={{ padding: '12px 16px', fontSize: 11.5, color: 'rgba(10,31,18,.55)', whiteSpace: 'nowrap' }}>{timeAgo(c.createdAt)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {tab === 'payouts' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {payouts.length === 0 && (
              <div style={{ background: '#fff', border: '1px solid rgba(10,31,18,.08)', borderRadius: 12, padding: 40, textAlign: 'center' }}>
                <p style={{ fontSize: 13, color: 'rgba(10,31,18,.55)', margin: 0 }}>No payout requests yet.</p>
              </div>
            )}
            {payouts.map(p => (
              <div key={p.id} style={{
                background: '#fff', border: '1px solid rgba(10,31,18,.08)',
                borderRadius: 12, padding: '16px 20px', display: 'flex',
                justifyContent: 'space-between', gap: 16,
                flexWrap: 'wrap', alignItems: 'center'
              }}>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 800, color: '#0A1F12' }}>
                    {p.displayName}{' '}
                    <span style={{ fontFamily: 'Consolas,monospace', fontSize: 11.5, color: 'rgba(10,31,18,.55)', marginLeft: 6 }}>
                      ({p.agentCode})
                    </span>
                  </div>
                  <div style={{ fontSize: 12, color: 'rgba(10,31,18,.6)', marginTop: 4 }}>
                    Requested {timeAgo(p.requestedAt)} · {p.method?.type} {p.method?.number} · {p.method?.holder} · {p.commissionIds?.length || 0} items
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
                  <div className="serif" style={{ fontSize: 18, fontWeight: 800, color: '#0A1F12' }}>
                    {fmtZmw(p.amountZmw)}
                  </div>
                  <Badge status={p.status} />
                  {p.status === 'requested' && (
                    <Btn size="sm" variant="success" onClick={() => markPaid(p)}>
                      <i className="fas fa-check"></i> Mark paid
                    </Btn>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </section>

      {/* APPROVAL MODAL */}
      {review && <AgentReviewModal agent={review} onClose={() => setReview(null)}
        onApprove={approveAgent} onReject={rejectAgent}
        onSuspend={suspendAgent} onUnsuspend={unsuspendAgent} />}
    </div>
  );
}

function AgentReviewModal({ agent, onClose, onApprove, onReject, onSuspend, onUnsuspend }) {
  const [code, setCode] = useState(agent.agentCode || generateAgentCode(agent.displayName));
  const [pct, setPct] = useState(agent.commissionPct || 25);

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 200,
      background: 'rgba(10,31,18,.88)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: 16
    }} onClick={onClose}>
      <div style={{
        background: '#fff', borderRadius: 14, maxWidth: 620,
        width: '100%', maxHeight: '92vh', overflowY: 'auto'
      }} onClick={e => e.stopPropagation()}>
        <div style={{
          background: '#0A1F12', color: '#fff',
          padding: '18px 24px', display: 'flex',
          justifyContent: 'space-between', alignItems: 'center',
          position: 'sticky', top: 0, zIndex: 2
        }}>
          <div className="serif" style={{ fontSize: 18, fontWeight: 700 }}>{agent.displayName}</div>
          <button onClick={onClose} style={{
            background: 'none', border: 'none', color: '#fff',
            fontSize: 18, cursor: 'pointer'
          }}>✕</button>
        </div>
        <div style={{ padding: '24px 26px' }}>
          <Field label="Email" value={agent.email} />
          <Field label="Phone" value={agent.phone} />
          <Field label="Location" value={agent.location} />
          <Field label="Status" value={<Badge status={agent.status} />} />
          <Field label="Applied" value={timeAgo(agent.createdAt)} />
          {agent.experience && (
            <div style={{ marginTop: 12 }}>
              <div className="micro" style={{ color: 'rgba(10,31,18,.5)', marginBottom: 6 }}>Experience</div>
              <div style={{ fontSize: 13, color: 'rgba(10,31,18,.75)', lineHeight: 1.6 }}>{agent.experience}</div>
            </div>
          )}
          {agent.motivation && (
            <div style={{ marginTop: 12 }}>
              <div className="micro" style={{ color: 'rgba(10,31,18,.5)', marginBottom: 6 }}>Motivation</div>
              <div style={{ fontSize: 13, color: 'rgba(10,31,18,.75)', lineHeight: 1.6 }}>{agent.motivation}</div>
            </div>
          )}

          <div style={{
            marginTop: 24, paddingTop: 20,
            borderTop: '1px dashed rgba(10,31,18,.1)'
          }}>
            <div className="micro" style={{ color: '#8A6828', marginBottom: 12 }}>Manage agent</div>
            <Input label="Referral code (unique)" required value={code} onChange={v => setCode(v.toUpperCase())}
              hint="Format SE-NAME-XXXX. Must not exist already." />
            <Input label="Commission %" type="number" value={pct} onChange={v => setPct(v)}
              hint="Default 25%. Higher % for top performers, lower for volume agents." />

            {agent.status === 'pending' && (
              <div style={{
                background: '#FFF4E5', border: '1px solid #F0E0A0',
                borderRadius: 8, padding: '12px 14px', marginBottom: 14,
                fontSize: 11.5, color: '#7A5C10', lineHeight: 1.6
              }}>
                <strong>Next step after approval:</strong> The agent must go to <code>#/login → Create account</code> and sign up with <strong>{agent.email}</strong>. Their auth account will auto-link to this record.
              </div>
            )}

            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
              <Btn onClick={() => onApprove(agent, code, pct)} variant="success">
                <i className="fas fa-check"></i> {agent.status === 'pending' ? 'Approve agent' : 'Save changes'}
              </Btn>
              {agent.status === 'active' && (
                <Btn onClick={() => onSuspend(agent)} variant="warning">
                  <i className="fas fa-pause"></i> Suspend
                </Btn>
              )}
              {agent.status === 'suspended' && (
                <Btn onClick={() => onUnsuspend(agent)} variant="primary">
                  <i className="fas fa-play"></i> Unsuspend
                </Btn>
              )}
              {agent.status === 'pending' && (
                <Btn onClick={() => onReject(agent)} variant="danger">
                  <i className="fas fa-xmark"></i> Reject
                </Btn>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------- ROUTER ---------------- */
function App() {
  const [hash, setHash] = useState(window.location.hash || '#/');
  const [agent, setAgent] = useState(null);
  const [bootChecked, setBootChecked] = useState(false);

  useEffect(() => {
    const onHash = () => setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // On load, load current agent (if signed in)
  useEffect(() => {
    if (!fbReady || !auth) { setBootChecked(true); return; }
    const unsub = auth.onAuthStateChanged(async user => {
      if (user) {
        try {
          let snap = await db.collection(SE_AGENTS).doc(user.uid).get();
          if (snap.exists) {
            setAgent({ id: user.uid, ...snap.data() });
          } else {
            // Try by email
            const q = await db.collection(SE_AGENTS)
              .where('email', '==', (user.email || '').toLowerCase()).limit(1).get();
            if (!q.empty) {
              setAgent({ id: q.docs[0].id, ...q.docs[0].data() });
              if (!q.docs[0].data().uid) {
                await q.docs[0].ref.update({ uid: user.uid }).catch(() => {});
              }
            } else setAgent(null);
          }
        } catch (e) { setAgent(null); }
      } else setAgent(null);
      setBootChecked(true);
    });
    return unsub;
  }, []);

  // Parse route
  const raw = (hash || '#/').replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  const route = parts[0] || '';
  const routeArg = parts[1] || '';

  const go = useCallback((r, arg) => {
    window.location.hash = '#/' + r + (arg ? '/' + arg : '');
    window.scrollTo({ top: 0, behavior: 'auto' });
  }, []);

  const onSignOut = async () => {
    try { await auth.signOut(); } catch (e) {}
    setAgent(null);
    go('');
  };

  const onAuth = () => {
    // Force reload agent from Firestore
    if (!auth.currentUser) return;
    (async () => {
      const u = auth.currentUser;
      let snap = await db.collection(SE_AGENTS).doc(u.uid).get();
      if (snap.exists) { setAgent({ id: u.uid, ...snap.data() }); go('dashboard'); return; }
      const q = await db.collection(SE_AGENTS)
        .where('email', '==', (u.email || '').toLowerCase()).limit(1).get();
      if (!q.empty) {
        setAgent({ id: q.docs[0].id, ...q.docs[0].data() });
        go('dashboard');
      }
    })();
  };

  if (!bootChecked) return <Spinner label="Loading…" />;

  // Redirect handler does NOT render chrome
  if (route === 'r' && routeArg) {
    return <RedirectHandler code={routeArg.toUpperCase()} navigate={h => { window.location.hash = h; }} />;
  }
  if (route === 'admin') {
    return <AdminPage go={go} />;
  }

  let page;
  if (route === 'apply') page = <ApplyPage go={go} />;
  else if (route === 'login') page = <LoginPage go={go} onAuth={onAuth} />;
  else if (route === 'dashboard') {
    if (!agent) page = <LoginPage go={go} onAuth={onAuth} />;
    else page = <Dashboard go={go} onSignOut={onSignOut} agent={agent} setAgent={setAgent} />;
  }
  else if (route === 'terms') page = <TermsPage />;
  else page = <Landing go={go} />;

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <Nav route={route} go={go} agent={agent} onSignOut={onSignOut} />
      <main style={{ flex: 1 }}>{page}</main>
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
</body>
