/* ================================================================
   STARTEASY REFERRAL PROGRAM — STANDALONE APP (INSTANT ONBOARDING)
   ================================================================ */
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ---------------- CONFIG ---------------- */
const CONFIG = {
  firebase: {
    apiKey: "AIzaSyDdEyxvsd2RjgKVYTGYJfYUB_637lV3n5I",
    authDomain: "starteasy-zambia.firebaseapp.com",
    projectId: "starteasy-zambia",
    storageBucket: "starteasy-zambia.firebasestorage.app",
    messagingSenderId: "54136399237",
    appId: "1:54136399237:web:2f9f2d7f86bfdfb4be50ec"
  },
  mainSiteUrl: 'https://starteasyzambia.com',
  adminWhatsapp: '260762499581',
  contactEmail: 'referrals@starteasyzambia.com',
  attributionDays: 30,
  minPayoutZmw: 200,
  clearingDays: 7,
  commissionTable: {
    micro: 40, basic: 30, standard: 25, complex: 22,
    checkup: 22, regularise: 18, venture: 20,
    ongoing_filing: 20, ongoing_standard: 20, ongoing_managed: 15
  }
};

const SE_AGENTS = 'se_agents';
const SE_COMMISSIONS = 'se_commissions';
const SE_PAYOUTS = 'se_payouts';
const SE_PAYMENTS = 'se_payments';
const SE_EVENTS = 'se_events';
const SE_ADMINS = 'se_admins';
const REF_KEY = 'starteasy.ref.v1';
const CODE_RX = /^SE-[A-Z0-9-]{3,32}$/;

/* ---------------- FIREBASE ---------------- */
let db = null, auth = null, fbReady = false;
try {
  if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(CONFIG.firebase);
  db = firebase.firestore();
  auth = firebase.auth();
  fbReady = true;
  // Ensure anonymous auth for pre-checks
  auth.signInAnonymously().catch(e => console.warn('[Referral] anon auth:', e && e.message));
} catch (e) {
  console.error('[Referral] Firebase init failed:', e);
}

/* ---------------- HELPERS ---------------- */
const fmtZmw = n => 'K' + (Number(n) || 0).toFixed(2);
const fmtInt = n => String(Number(n) || 0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const timeAgo = ts => {
  if (!ts) return '';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  const d = Math.floor(s / 86400);
  return d + 'd ago';
};
const copyText = async t => {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(t); return true;
    }
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    return true;
  } catch (e) { return false; }
};
const isMobileUA = () => /android|iphone|ipad|ipod|mobile/i.test((navigator.userAgent || '').toLowerCase());
const waUrl = (msg, phone) => {
  const p = phone || CONFIG.adminWhatsapp;
  const e = encodeURIComponent(msg);
  return isMobileUA() ? 'whatsapp://send?phone=' + p + '&text=' + e : 'https://wa.me/' + p + '?text=' + e;
};
const baseUrl = () => window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/');
const generateAgentCode = name => {
  const clean = String(name || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 8) || 'AGENT';
  const rand = Math.random().toString(36).slice(2, 6).toUpperCase();
  return 'SE-' + clean + '-' + rand;
};
const resolveServiceType = payment => {
  const code = String(payment.serviceCode || '').toUpperCase();
  if (code === 'P0' || code === 'P1') return 'micro';
  if (code === 'P2') return 'complex';
  if (code === 'C1') return 'checkup';
  if (code === 'C2') return 'regularise';
  if (code === 'C3') return 'ongoing_managed';
  if (code.startsWith('V-')) return 'venture';
  if (payment.ongoing === 'managed') return 'ongoing_managed';
  if (payment.ongoing === 'standard') return 'ongoing_standard';
  if (payment.ongoing === 'filing') return 'ongoing_filing';
  return 'standard';
};
const calcCommission = (type, gross) => {
  const pct = CONFIG.commissionTable[type] || 20;
  return { pct, amount: Math.round(gross * pct) / 100 };
};

/* ---------------- ATTRIBUTION ---------------- */
const readAttribution = () => {
  try {
    const raw = JSON.parse(localStorage.getItem(REF_KEY) || 'null');
    if (!raw || !raw.code) return null;
    if (Date.now() - raw.at > CONFIG.attributionDays * 24 * 3600 * 1000) return null;
    return raw;
  } catch (e) { return null; }
};

const storeAttribution = code => {
  try {
    const c = String(code).toUpperCase().trim();
    if (!CODE_RX.test(c)) return null;
    const rec = { code: c, at: Date.now(), src: window.location.href };
    localStorage.setItem(REF_KEY, JSON.stringify(rec));
    return rec;
  } catch (e) { return null; }
};

const logReferralClick = async code => {
  if (!fbReady) return;
  try {
    await db.collection(SE_EVENTS).add({
      type: 'referral_click', agentCode: code, at: Date.now(), route: 'redirect'
    });
    const q = await db.collection(SE_AGENTS).where('agentCode', '==', code).limit(1).get();
    if (!q.empty) {
      const ref = q.docs[0].ref;
      await db.runTransaction(async t => {
        const s = await t.get(ref);
        if (!s.exists) return;
        const d = s.data(); const tot = d.totals || {};
        t.update(ref, { 'totals.clicks': (tot.clicks || 0) + 1 });
      });
    }
  } catch (e) {}
};

/* ---------------- COMMISSION ENGINE ---------------- */
const createCommissionForPayment = async (payment, agent) => {
  if (!fbReady || !payment.ref || !agent) return { ok: false };
  const existing = await db.collection(SE_COMMISSIONS)
    .where('paymentRef', '==', payment.ref).limit(1).get();
  if (!existing.empty) return { ok: true, skipped: true };

  const gross = parseFloat(String(payment.amount || '0').replace(/[^\d.]/g, '')) || 0;
  if (gross <= 0) return { ok: false };

  const serviceType = resolveServiceType(payment);
  const { pct, amount } = calcCommission(serviceType, gross);

  const commission = {
    agentId: agent.id, agentCode: agent.agentCode,
    paymentRef: payment.ref, serviceCode: payment.serviceCode || '',
    serviceTitle: payment.serviceTitle || '', serviceType,
    grossZmw: gross, commissionPct: pct, commissionZmw: amount,
    status: 'pending', createdAt: Date.now(), approvedAt: Date.now(),
    clearAt: Date.now() + CONFIG.clearingDays * 24 * 3600 * 1000,
    paidAt: null, payoutId: null, reversedAt: null
  };

  const added = await db.collection(SE_COMMISSIONS).add(commission);

  const agentRef = db.collection(SE_AGENTS).doc(agent.id);
  await db.runTransaction(async t => {
    const s = await t.get(agentRef);
    if (!s.exists) return;
    const d = s.data(); const tot = d.totals || {};
    t.update(agentRef, {
      'totals.conversions': (tot.conversions || 0) + 1,
      'totals.pendingZmw': (tot.pendingZmw || 0) + amount
    });
  });

  return { ok: true, commission: { id: added.id, ...commission } };
};

const cancelCommissionForPayment = async paymentRef => {
  if (!fbReady || !paymentRef) return { ok: false };
  try {
    const snap = await db.collection(SE_COMMISSIONS).where('paymentRef', '==', paymentRef).limit(1).get();
    if (snap.empty) return { ok: true, skipped: true };
    const doc = snap.docs[0];
    const c = doc.data();
    if (c.status === 'paid') return { ok: false };
    await doc.ref.update({ status: 'cancelled', reversedAt: Date.now() });
    const agentRef = db.collection(SE_AGENTS).doc(c.agentId);
    await db.runTransaction(async t => {
      const s = await t.get(agentRef);
      if (!s.exists) return;
      const d = s.data(); const tot = d.totals || {};
      t.update(agentRef, {
        'totals.pendingZmw': Math.max(0, (tot.pendingZmw || 0) - c.commissionZmw),
        'totals.conversions': Math.max(0, (tot.conversions || 0) - 1)
      });
    });
    return { ok: true };
  } catch (e) { return { ok: false }; }
};

const markPayoutPaid = async payoutId => {
  if (!fbReady) return { ok: false };
  try {
    const ref = db.collection(SE_PAYOUTS).doc(payoutId);
    const snap = await ref.get();
    if (!snap.exists) return { ok: false };
    const po = snap.data();
    if (po.status === 'paid') return { ok: true };

    const batch = db.batch();
    batch.update(ref, { status: 'paid', paidAt: Date.now() });
    (po.commissionIds || []).forEach(cid => {
      batch.update(db.collection(SE_COMMISSIONS).doc(cid), { status: 'paid', paidAt: Date.now(), payoutId });
    });
    await batch.commit();

    const agentRef = db.collection(SE_AGENTS).doc(po.agentId);
    await db.runTransaction(async t => {
      const s = await t.get(agentRef);
      if (!s.exists) return;
      const d = s.data(); const tot = d.totals || {};
      t.update(agentRef, {
        'totals.earnedZmw': (tot.earnedZmw || 0) + po.amountZmw,
        'totals.paidZmw':   (tot.paidZmw || 0) + po.amountZmw,
        'totals.pendingZmw': Math.max(0, (tot.pendingZmw || 0) - po.amountZmw)
      });
    });
    return { ok: true };
  } catch (e) { return { ok: false }; }
};

const syncCommissions = async () => {
  if (!fbReady) return { created: 0, cancelled: 0 };
  let created = 0, cancelled = 0;
  try {
    const paysSnap = await db.collection(SE_PAYMENTS).where('status', '==', 'approved').orderBy('submittedAt', 'desc').limit(500).get();
    const withRef = paysSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.referralCode);

    for (const pay of withRef) {
      const exists = await db.collection(SE_COMMISSIONS).where('paymentRef', '==', pay.ref).limit(1).get();
      if (!exists.empty) continue;
      const q = await db.collection(SE_AGENTS).where('agentCode', '==', pay.referralCode).limit(1).get();
      if (q.empty) continue;
      const agent = { id: q.docs[0].id, ...q.docs[0].data() };
      if (agent.status !== 'active') continue;
      if (pay.clientEmail && agent.email && pay.clientEmail.toLowerCase() === agent.email.toLowerCase()) continue;
      if (pay.clientPhone && agent.phone && pay.clientPhone.replace(/\D/g, '') === agent.phone.replace(/\D/g, '')) continue;
      const r = await createCommissionForPayment(pay, agent);
      if (r.ok && !r.skipped) created++;
    }

    const cancellingSnap = await db.collection(SE_PAYMENTS).where('status', 'in', ['reverted', 'declined']).orderBy('submittedAt', 'desc').limit(200).get();
    for (const d of cancellingSnap.docs) {
      const p = d.data();
      if (!p.ref) continue;
      const cSnap = await db.collection(SE_COMMISSIONS).where('paymentRef', '==', p.ref).limit(1).get();
      if (cSnap.empty) continue;
      const c = cSnap.docs[0].data();
      if (c.status === 'pending' || c.status === 'earned') {
        const r = await cancelCommissionForPayment(p.ref);
        if (r.ok) cancelled++;
      }
    }
  } catch (e) {}
  return { created, cancelled };
};

/* ---------------- JOIN (INSTANT ONBOARDING + ENGAGEMENT) ---------------- */
function JoinPage({ go, onAuth }) {
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({ displayName: '', email: '', phone: '', location: '', password: '' });
  const [agreed, setAgreed] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  const nextStep = () => {
    setErr('');
    if (!form.displayName.trim()) return setErr('Enter your full name.');
    if (!form.email.trim() || !/^\S+@\S+\.\S+$/.test(form.email)) return setErr('Enter a valid email.');
    if (!form.phone.trim() || form.phone.replace(/\D/g, '').length < 9) return setErr('Enter a valid phone number.');
    if (!form.location) return setErr('Choose your location.');
    setStep(2);
  };

  const submit = async () => {
    setErr('');
    if (!form.password || form.password.length < 6) return setErr('Password must be at least 6 characters.');
    if (!agreed) return setErr('You must accept the engagement terms.');
    setBusy(true);

    try {
      // 1. Create Auth Account
      const cred = await auth.createUserWithEmailAndPassword(form.email.trim().toLowerCase(), form.password);
      
      // 2. Generate Code
      const agentCode = generateAgentCode(form.displayName);

      // 3. Save Agent Profile
      await db.collection(SE_AGENTS).doc(cred.user.uid).set({
        uid: cred.user.uid,
        agentCode: agentCode,
        displayName: form.displayName.trim(),
        email: form.email.trim().toLowerCase(),
        phone: form.phone.trim(),
        location: form.location,
        status: 'active', // Instant activation
        commissionPct: 20,
        createdAt: Date.now(),
        totals: { clicks: 0, conversions: 0, earnedZmw: 0, paidZmw: 0, pendingZmw: 0 }
      });

      // 4. Log Event
      try { db.collection(SE_EVENTS).add({ type: 'agent_joined_instantly', at: Date.now(), agentCode }); } catch (e) {}

      onAuth(); // Trigger global redirect to dashboard
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') {
        setErr('This email already has an account. Please sign in.');
      } else {
        setErr(e.message || 'Registration failed.');
      }
    } finally { setBusy(false); }
  };

  if (step === 1) {
    return (
      <div style={{ maxWidth: 600, margin: '0 auto', padding: '56px 24px' }}>
        <h1 className="serif" style={{ fontSize: 'clamp(1.8rem,4vw,2.4rem)', color: '#0A1F12', marginBottom: 10 }}>Get Your Referral Code</h1>
        <p style={{ fontSize: 14, color: 'rgba(10,31,18,.65)', marginBottom: 24, lineHeight: 1.65 }}>Fill this out. On the next step you'll sign the engagement agreement and get your unique link instantly.</p>
        
        <div style={{ background: '#fff', border: '1px solid rgba(10,31,18,.08)', borderRadius: 12, padding: '26px 24px' }}>
          <Input label="Full Name" required value={form.displayName} onChange={v => setForm({ ...form, displayName: v })} placeholder="e.g. John Mwale" />
          <Input label="Email" required type="email" value={form.email} onChange={v => setForm({ ...form, email: v })} placeholder="you@example.com" />
          <Input label="Phone / WhatsApp" required value={form.phone} onChange={v => setForm({ ...form, phone: v })} placeholder="+260..." />
          <Select label="Location" required value={form.location} onChange={v => setForm({ ...form, location: v })} options={['Lusaka', 'Copperbelt', 'Southern', 'Central', 'Eastern', 'Northern', 'Western', 'North-Western', 'Luapula', 'Muchinga', 'Diaspora']} />
          
          {err && <div style={{ background: 'rgba(184,86,79,.08)', border: '1px solid rgba(184,86,79,.3)', borderRadius: 8, padding: '11px 14px', marginBottom: 14, color: '#B8564F', fontSize: 12.5 }}>{err}</div>}
          
          <Btn onClick={nextStep} size="lg" variant="primary" style={{ width: '100%' }}>Continue to Engagement <i className="fas fa-arrow-right"></i></Btn>
          <p style={{ textAlign: 'center', marginTop: 14, fontSize: 12, color: 'rgba(10,31,18,.6)' }}>Already have an account? <a href="#/login" style={{ color: '#E8730F', fontWeight: 700 }}>Sign In</a></p>
        </div>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 700, margin: '0 auto', padding: '56px 24px' }}>
      <button onClick={() => setStep(1)} style={{ background: 'none', border: 'none', color: 'rgba(10,31,18,.6)', fontSize: 12, fontWeight: 700, cursor: 'pointer', marginBottom: 20 }}>← Back to details</button>
      
      <div style={{ background: '#fff', border: '1px solid rgba(10,31,18,.12)', borderRadius: 12, padding: '32px 30px', boxShadow: '0 10px 30px rgba(0,0,0,.05)' }}>
        <div style={{ textAlign: 'center', marginBottom: 24 }}>
          <i className="fas fa-file-signature" style={{ fontSize: 32, color: '#E8730F', marginBottom: 12 }}></i>
          <h2 className="serif" style={{ fontSize: 22, color: '#0A1F12', margin: 0 }}>Agent Engagement Agreement</h2>
        </div>

        <div style={{ fontSize: 13, lineHeight: 1.7, color: 'rgba(10,31,18,.8)', maxHeight: 300, overflowY: 'auto', background: '#F9FBFA', padding: 20, borderRadius: 8, border: '1px solid rgba(10,31,18,.06)', marginBottom: 20 }}>
          <p><strong>1. Independent Contractor:</strong> You are joining as an independent Referral Agent. This is NOT an employment contract. You are not an employee of StartEasy Zambia, and there is no salary, no guaranteed income, and no employee benefits.</p>
          <p><strong>2. Commission Only:</strong> You will earn a fixed percentage commission on the service fees of approved sales you refer. Commissions are only paid after the client pays AND the payment clears (7 days).</p>
          <p><strong>3. Attribution:</strong> Your unique code tracks sales for 30 days. Self-referrals or fraudulent activity will result in immediate disqualification and forfeiture of earnings.</p>
          <p><strong>4. Payouts:</strong> Minimum payout is K200. Payouts are processed to your chosen mobile money or bank account.</p>
          <p><strong>5. Conduct:</strong> You agree not to spam, impersonate StartEasy, or make false promises to clients.</p>
        </div>

        <Input label="Create a Password" required type="password" value={form.password} onChange={v => setForm({ ...form, password: v })} placeholder="Min 6 characters" autoComplete="new-password" />
        
        <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', fontSize: 13, color: '#0A1F12', cursor: 'pointer', marginBottom: 20 }}>
          <input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} style={{ width: 18, height: 18, accentColor: '#E8730F', marginTop: 2 }} />
          <span>I agree to the <a href="#/terms" style={{ color: '#E8730F', fontWeight: 700 }}>Program Terms</a> and understand this is a commission-only independent contractor agreement.</span>
        </label>

        {err && <div style={{ background: 'rgba(184,86,79,.08)', border: '1px solid rgba(184,86,79,.3)', borderRadius: 8, padding: '11px 14px', marginBottom: 14, color: '#B8564F', fontSize: 12.5 }}>{err}</div>}

        <Btn onClick={submit} disabled={busy} size="lg" variant="primary" style={{ width: '100%' }}>
          {busy ? 'Creating Account...' : 'Sign & Generate My Code'}
        </Btn>
      </div>
    </div>
  );
}

/* ---------------- DASHBOARD ---------------- */
function Dashboard({ go, onSignOut, agent, setAgent }) {
  const [commissions, setCommissions] = useState([]);
  const [payouts, setPayouts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [msg, setMsg] = useState('');
  const [tab, setTab] = useState('commissions');
  const [showPayout, setShowPayout] = useState(false);
  const [showWelcome, setShowWelcome] = useState(true); // Shows the "Here is your code" banner on first load

  useEffect(() => {
    if (!agent) return;
    const unsubs = [
      db.collection(SE_AGENTS).doc(agent.id).onSnapshot(s => { if (s.exists) setAgent({ id: s.id, ...s.data() }); }),
      db.collection(SE_COMMISSIONS).where('agentId', '==', agent.id).orderBy('createdAt', 'desc').limit(100).onSnapshot(s => setCommissions(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => {}),
      db.collection(SE_PAYOUTS).where('agentId', '==', agent.id).orderBy('requestedAt', 'desc').limit(50).onSnapshot(s => setPayouts(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => {})
    ];
    setLoading(false);
    return () => unsubs.forEach(u => u());
  }, [agent && agent.id]);

  if (loading || !agent) return <Spinner label="Loading dashboard…" />;

  const shareLink = baseUrl() + '#/r/' + agent.agentCode;
  const earned = agent.totals?.earnedZmw || 0;
  const paid = agent.totals?.paidZmw || 0;
  const pending = agent.totals?.pendingZmw || 0;
  const available = Math.max(0, earned - paid);

  const doCopy = async (text, label) => {
    const ok = await copyText(text);
    setMsg(ok ? `${label} copied` : 'Copy failed');
    setTimeout(() => setMsg(''), 2000);
  };

  const requestPayout = async () => {
    setMsg('');
    if (available < CONFIG.minPayoutZmw) return setMsg(`Minimum payout is ${fmtZmw(CONFIG.minPayoutZmw)}`);
    if (!agent.paymentMethod || !agent.paymentMethod.number) {
      setMsg('Please set your payout method first (Settings tab).');
      setTab('settings');
      return;
    }
    const earnedComms = commissions.filter(c => c.status === 'earned' && Date.now() >= (c.clearAt || 0));
    const total = earnedComms.reduce((s, c) => s + (c.commissionZmw || 0), 0);
    if (total < CONFIG.minPayoutZmw) return setMsg(`You have ${fmtZmw(total)} available (min ${fmtZmw(CONFIG.minPayoutZmw)}).`);
    
    try {
      await db.collection(SE_PAYOUTS).add({
        agentId: agent.id, agentCode: agent.agentCode, displayName: agent.displayName,
        amountZmw: Math.round(total * 100) / 100, commissionIds: earnedComms.map(c => c.id),
        method: agent.paymentMethod, status: 'requested', requestedAt: Date.now(), paidAt: null, proof: null
      });
      setMsg('Payout request submitted. Officer will pay within 5 working days.');
      setShowPayout(false);
    } catch (e) { setMsg('Could not submit request. Please try again.'); }
  };

  const savePaymentMethod = async pm => {
    try {
      await db.collection(SE_AGENTS).doc(agent.id).update({ paymentMethod: pm });
      setAgent({ ...agent, paymentMethod: pm });
      setMsg('Payout method saved.');
    } catch (e) { setMsg('Could not save.'); }
  };

  return (
    <div className="fadein" style={{ minHeight: '100vh', padding: '32px 24px 60px' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto' }}>
        
        {/* Welcome Banner */}
        {showWelcome && (
          <div style={{ background: 'linear-gradient(135deg,#FFF9E6,#FFFCF0)', border: '1.5px solid #F0E0A0', borderRadius: 12, padding: '20px 24px', marginBottom: 24, position: 'relative' }}>
            <button onClick={() => setShowWelcome(false)} style={{ position: 'absolute', top: 12, right: 12, background: 'none', border: 'none', color: '#8A6828', cursor: 'pointer', fontSize: 14 }}>✕</button>
            <div style={{ display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap' }}>
              <div style={{ flex: 1 }}>
                <h3 className="serif" style={{ fontSize: 18, color: '#0A1F12', margin: '0 0 4px' }}>Welcome aboard, {agent.displayName.split(' ')[0]}!</h3>
                <p style={{ fontSize: 13, color: '#8A6828', margin: 0 }}>Your account is active. Copy your unique link below and start sharing to earn.</p>
              </div>
            </div>
          </div>
        )}

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, flexWrap: 'wrap', marginBottom: 24 }}>
          <div>
            <span className="micro" style={{ color: '#E8730F', display: 'block', marginBottom: 8 }}>Agent Dashboard</span>
            <h1 className="serif" style={{ fontSize: 'clamp(1.6rem,3.4vw,2.2rem)', color: '#0A1F12', lineHeight: 1.15, margin: 0 }}>{agent.displayName}</h1>
          </div>
          <button onClick={onSignOut} style={{ padding: '10px 16px', background: 'rgba(184,86,79,.1)', color: '#B8564F', border: '1px solid rgba(184,86,79,.3)', borderRadius: 8, fontSize: 12.5, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>Sign out</button>
        </div>

        {msg && <div style={{ background: 'rgba(30,123,60,.1)', border: '1px solid rgba(30,123,60,.3)', borderRadius: 8, padding: '11px 14px', marginBottom: 16, color: '#1E7B3C', fontSize: 12.5, fontWeight: 600 }}>{msg}</div>}

        {/* Link Box */}
        <div style={{ background: '#0A1F12', borderRadius: 12, padding: '18px 20px', color: '#fff', marginBottom: 20 }}>
          <div style={{ fontSize: 10.5, letterSpacing: '.14em', textTransform: 'uppercase', fontWeight: 800, color: '#F5A623', marginBottom: 12 }}>Your Referral Link</div>

          </div>
        </div>

        {/* KPIs */}

        {/* Payout CTA */}

          <div style={{ background: '#fff', border: '1px solid rgba(10,31,18,.08)', borderRadius: 12, padding: '22px 24px', marginBottom: 20 }}>

            <p style={{ fontSize: 13, color: 'rgba(10,31,18,.7)', lineHeight: 1.65, marginBottom: 12 }}>Requesting <strong>{fmtZmw(available)}</strong> to <strong>{agent.paymentMethod?.label || 'your saved account'}</strong>.</p>
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
              <Btn onClick={requestPayout} variant="success"><i className="fas fa-check"></i> Confirm request</Btn>
              <Btn onClick={() => setShowPayout(false)} variant="ghost">Cancel</Btn>

          </div>
        )}

        {/* Tabs */}
        <div style={{ background: '#fff', border: '1px solid rgba(10,31,18,.08)', borderRadius: 12, overflow: 'hidden' }}>
          <div style={{ display: 'flex', borderBottom: '1px solid rgba(10,31,18,.06)', overflowX: 'auto' }}>
            {[['commissions', 'Commissions', 'fa-receipt'], ['payouts', 'Payouts', 'fa-money-bill-transfer'], ['settings', 'Settings', 'fa-gear']].map(([k, l, ic]) => (
              <button key={k} onClick={() => setTab(k)} style={{ padding: '14px 18px', background: 'none', border: 'none', borderBottom: tab === k ? '3px solid #E8730F' : '3px solid transparent', fontSize: 13, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit', color: tab === k ? '#0A1F12' : 'rgba(10,31,18,.55)', display: 'inline-flex', alignItems: 'center', gap: 8, flexShrink: 0 }}><i className={`fas ${ic}`} style={{ fontSize: 11 }}></i> {l}</button>
            ))}
          </div>
          <div style={{ padding: '20px 22px' }}>
            {tab === 'commissions' && (
              commissions.length === 0 ? <p style={{ fontSize: 13.5, color: 'rgba(10,31,18,.55)', margin: 0 }}>No commissions yet — share your link to start earning.</p> :
              <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 520 }}>
                  <thead><tr>{['Payment ref', 'Service', 'Fee', 'Commission', 'Status', 'When'].map(h => <th key={h} style={{ textAlign: 'left', padding: '10px 12px', fontSize: 10, letterSpacing: '.14em', textTransform: 'uppercase', fontWeight: 800, color: 'rgba(10,31,18,.45)', borderBottom: '1px solid rgba(10,31,18,.08)' }}>{h}</th>)}</tr></thead>
                  <tbody>{commissions.map(c => <tr key={c.id} style={{ borderBottom: '1px dashed rgba(10,31,18,.06)' }}><td style={{ padding: '10px 12px', fontFamily: 'Consolas,monospace', fontSize: 11.5, color: '#0A1F12' }}>{c.paymentRef}</td><td style={{ padding: '10px 12px', fontSize: 12.5, color: '#0A1F12' }}>{c.serviceTitle || c.serviceCode}</td><td style={{ padding: '10px 12px', fontSize: 12.5, color: 'rgba(10,31,18,.65)' }}>{fmtZmw(c.grossZmw)}</td><td style={{ padding: '10px 12px', fontSize: 12.5, fontWeight: 700, color: '#E8730F' }}>{fmtZmw(c.commissionZmw)} <span style={{ fontSize: 10.5, color: 'rgba(10,31,18,.5)' }}>({c.commissionPct}%)</span></td><td style={{ padding: '10px 12px' }}><Badge status={c.status} /></td><td style={{ padding: '10px 12px', fontSize: 11.5, color: 'rgba(10,31,18,.55)' }}>{timeAgo(c.createdAt)}</td></tr>)}</tbody>
                </table>
              </div>
            )}
            {tab === 'payouts' && (
              payouts.length === 0 ? <p style={{ fontSize: 13.5, color: 'rgba(10,31,18,.55)', margin: 0 }}>No payout requests yet.</p> :
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>{payouts.map(p => <div key={p.id} style={{ border: '1px solid rgba(10,31,18,.08)', borderRadius: 10, padding: '14px 16px', display: 'flex', justifyContent: 'space-between', gap: 14, flexWrap: 'wrap', alignItems: 'center' }}><div><div style={{ fontSize: 14, fontWeight: 700, color: '#0A1F12' }}>{fmtZmw(p.amountZmw)}</div><div style={{ fontSize: 11.5, color: 'rgba(10,31,18,.55)', marginTop: 3 }}>Requested {timeAgo(p.requestedAt)} · {p.commissionIds?.length || 0} items</div></div><Badge status={p.status} /></div>)}</div>
            )}
            {tab === 'settings' && <SettingsTab agent={agent} onSave={savePaymentMethod} />}
          </div>
        </div>
      </div>
    </div>
  );
}

function SettingsTab({ agent, onSave }) {
  const [method, setMethod] = useState(agent.paymentMethod?.type || 'airtel');
  const [number, setNumber] = useState(agent.paymentMethod?.number || '');
  const [holder, setHolder] = useState(agent.paymentMethod?.holder || agent.displayName || '');
  const [msg, setMsg] = useState('');

  const save = () => {
    setMsg('');
    if (!number.trim() || !holder.trim()) return setMsg('Holder and account number are required.');
    const label = method === 'airtel' ? 'Airtel Money' : method === 'mtn' ? 'MTN MoMo' : 'Bank';
    onSave({ type: method, label, number: number.trim(), holder: holder.trim() });
  };

  return (
    <div>
      <p style={{ fontSize: 13, color: 'rgba(10,31,18,.65)', marginBottom: 18, lineHeight: 1.65 }}>Commissions are paid to this account. Please make sure the details match your name.</p>
      <Select label="Payout method" value={method} onChange={setMethod} options={[{ value: 'airtel', label: 'Airtel Money' }, { value: 'mtn', label: 'MTN MoMo' }, { value: 'bank', label: 'Bank transfer' }]} />
      <Input label="Account holder name" required value={holder} onChange={setHolder} />
      <Input label={method === 'bank' ? 'Account number' : 'Mobile number'} required value={number} onChange={setNumber} placeholder={method === 'bank' ? '0152…' : '+260…'} />
      {msg && <div style={{ background: 'rgba(30,123,60,.08)', border: '1px solid rgba(30,123,60,.3)', borderRadius: 8, padding: '10px 14px', marginBottom: 14, color: '#1E7B3C', fontSize: 12.5 }}>{msg}</div>}
      <Btn onClick={save} variant="primary"><i className="fas fa-check"></i> Save payout method</Btn>
    </div>
  );
}

/* ---------------- REDIRECT HANDLER #/r/:code ---------------- */
function RedirectHandler({ code }) {
  const [status, setStatus] = useState('loading');
  useEffect(() => {
    if (!code || !CODE_RX.test(code)) { setStatus('invalid'); return; }
    logReferralClick(code);
    storeAttribution(code);
    setStatus('redirecting');
    setTimeout(() => { window.location.href = CONFIG.mainSiteUrl + '/?ref=' + encodeURIComponent(code); }, 800);
  }, [code]);

  return (
    <div style={{ minHeight: '70vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '40px 24px', background: 'linear-gradient(135deg,#0A1F12,#123A1F)', color: '#fff' }}>
      <div style={{ textAlign: 'center', maxWidth: 460 }}>
        {status === 'invalid' ? (
          <>
            <i className="fas fa-circle-exclamation" style={{ fontSize: 46, color: '#F5A623', marginBottom: 16, display: 'block' }}></i>
            <h2 className="serif" style={{ fontSize: 24, marginBottom: 12 }}>Invalid referral link</h2>
            <Btn variant="primary" onClick={() => window.location.hash = '#/'}>Back to referral home</Btn>
          </>
        ) : (
          <>
            <Mark size={56} />
            <h2 className="serif" style={{ fontSize: 24, marginTop: 18, marginBottom: 12 }}>Taking you to StartEasy…</h2>
            <p style={{ fontSize: 14, color: 'rgba(255,255,255,.65)', marginBottom: 20 }}>Your referral code is <strong style={{ color: '#F5A623' }}>{code}</strong>.</p>
            <i className="fas fa-circle-notch spin" style={{ fontSize: 24, color: '#F5A623' }}></i>
          </>
        )}
      </div>
    </div>
  );
}

/* ---------------- ADMIN ---------------- */
function AdminPage({ go }) {
  const [authed, setAuthed] = useState(false);
  const [checking, setChecking] = useState(true);
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [tab, setTab] = useState('agents');
  const [agents, setAgents] = useState([]);
  const [commissions, setCommissions] = useState([]);
  const [payouts, setPayouts] = useState([]);
  const [msg, setMsg] = useState('');

  useEffect(() => {
    if (!fbReady || !auth) { setChecking(false); return; }
    const unsub = auth.onAuthStateChanged(async user => {
      if (user) {
        try {
          const snap = await db.collection(SE_ADMINS).doc(user.uid).get();
          setAuthed(snap.exists);
        } catch (e) { setAuthed(false); }
      } else setAuthed(false);
      setChecking(false);
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (!authed) return;
    const unsubs = [
      db.collection(SE_AGENTS).orderBy('createdAt', 'desc').limit(300).onSnapshot(s => setAgents(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => {}),
      db.collection(SE_COMMISSIONS).orderBy('createdAt', 'desc').limit(300).onSnapshot(s => setCommissions(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => {}),
      db.collection(SE_PAYOUTS).orderBy('requestedAt', 'desc').limit(300).onSnapshot(s => setPayouts(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => {})
    ];
    syncCommissions(); // auto-run on load
    return () => unsubs.forEach(u => u());
  }, [authed]);

  const handleSignIn = async () => {
    setErr(''); setBusy(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), pw);
      const check = await db.collection(SE_ADMINS).doc(auth.currentUser.uid).get();
      if (!check.exists) { await auth.signOut(); setErr('Not an admin account.'); return; }
      setAuthed(true);
    } catch (e) { setErr('Incorrect email or password.'); }
    finally { setBusy(false); }
  };

  const markPaid = async payout => {
    if (!window.confirm(`Mark ${fmtZmw(payout.amountZmw)} to ${payout.agentCode} as paid?`)) return;
    await markPayoutPaid(payout.id);
    setMsg('Payout marked paid.');
  };

  if (checking) return <Spinner label="Checking admin access…" />;
  if (!authed) return (
    <div style={{ minHeight: '70vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '48px 20px' }}>
      <div style={{ background: '#fff', borderRadius: 14, padding: '34px 30px', maxWidth: 400, width: '100%' }}>
        <h1 className="serif" style={{ fontSize: 22, color: '#0A1F12', marginBottom: 6 }}>Referral admin</h1>
        <Input label="Admin email" type="email" value={email} onChange={setEmail} />
        <Input label="Password" type="password" value={pw} onChange={setPw} />
        {err && <div style={{ color: '#B8564F', fontSize: 12.5, marginBottom: 14 }}>{err}</div>}
        <Btn onClick={handleSignIn} disabled={busy} variant="primary" size="lg" style={{ width: '100%' }}>{busy ? 'Signing in…' : 'Sign in'}</Btn>
      </div>
    </div>
  );

  const requestedPayouts = payouts.filter(p => p.status === 'requested');

  return (
    <div className="fadein" style={{ minHeight: '100vh', paddingBottom: 60 }}>
      <section style={{ background: '#0A1F12', color: '#fff', padding: '20px 24px' }}>
        <div style={{ maxWidth: 1240, margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div className="serif" style={{ fontSize: 20, fontWeight: 800 }}>Admin Portal</div>
          <button onClick={() => { auth.signOut(); setAuthed(false); }} style={{ padding: '8px 14px', background: 'rgba(184,86,79,.15)', color: '#FFB4A8', border: '1px solid rgba(184,86,79,.35)', borderRadius: 8, fontSize: 12 }}>Sign out</button>
        </div>
      </section>
      <section style={{ background: '#fff', borderBottom: '1px solid rgba(10,31,18,.08)' }}>
        <div style={{ maxWidth: 1240, margin: '0 auto', padding: '0 24px', display: 'flex', gap: 6, overflowX: 'auto' }}>
          {[['agents', 'Agents', 'fa-users'], ['commissions', 'Commissions', 'fa-receipt'], ['payouts', 'Payouts', 'fa-money-bill-transfer']].map(([k, l, ic]) => (
            <button key={k} onClick={() => setTab(k)} style={{ padding: '14px 16px', background: 'none', border: 'none', borderBottom: tab === k ? '3px solid #E8730F' : '3px solid transparent', fontSize: 13, fontWeight: 700, color: tab === k ? '#0A1F12' : 'rgba(10,31,18,.55)' }}><i className={`fas ${ic}`}></i> {l}</button>
          ))}
        </div>
      </section>
      <section style={{ maxWidth: 1240, margin: '0 auto', padding: '28px 24px' }}>
        {msg && <div style={{ background: 'rgba(30,123,60,.1)', border: '1px solid rgba(30,123,60,.3)', borderRadius: 8, padding: '11px 14px', marginBottom: 16, color: '#1E7B3C', fontSize: 12.5, fontWeight: 600 }}>{msg}</div>}
        
        {tab === 'agents' && (
          <div style={{ background: '#fff', border: '1px solid rgba(10,31,18,.08)', borderRadius: 12, overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 800 }}>
              <thead><tr>{['Name', 'Email', 'Phone', 'Code', 'Status'].map(h => <th key={h} style={{ textAlign: 'left', padding: '12px 16px', background: '#FBFDFB', fontSize: 10.5, color: 'rgba(10,31,18,.5)' }}>{h}</th>)}</tr></thead>
              <tbody>{agents.map(a => <tr key={a.id} style={{ borderBottom: '1px solid rgba(10,31,18,.05)' }}><td style={{ padding: '12px 16px', fontSize: 13, fontWeight: 600 }}>{a.displayName}</td><td style={{ padding: '12px 16px', fontSize: 12 }}>{a.email}</td><td style={{ padding: '12px 16px', fontSize: 12 }}>{a.phone}</td><td style={{ padding: '12px 16px', fontFamily: 'monospace', fontSize: 12 }}>{a.agentCode}</td><td style={{ padding: '12px 16px' }}><Badge status={a.status} /></td></tr>)}</tbody>
            </table>
          </div>
        )}
        
        {tab === 'commissions' && (
          <div style={{ background: '#fff', border: '1px solid rgba(10,31,18,.08)', borderRadius: 12, overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 800 }}>
              <thead><tr>{['Agent', 'Payment Ref', 'Fee', 'Comm', 'Status'].map(h => <th key={h} style={{ textAlign: 'left', padding: '12px 16px', background: '#FBFDFB', fontSize: 10.5, color: 'rgba(10,31,18,.5)' }}>{h}</th>)}</tr></thead>
              <tbody>{commissions.map(c => <tr key={c.id} style={{ borderBottom: '1px solid rgba(10,31,18,.05)' }}><td style={{ padding: '12px 16px', fontFamily: 'monospace', fontSize: 12 }}>{c.agentCode}</td><td style={{ padding: '12px 16px', fontFamily: 'monospace', fontSize: 12 }}>{c.paymentRef}</td><td style={{ padding: '12px 16px', fontSize: 12 }}>{fmtZmw(c.grossZmw)}</td><td style={{ padding: '12px 16px', fontSize: 12, fontWeight: 700, color: '#E8730F' }}>{fmtZmw(c.commissionZmw)}</td><td style={{ padding: '12px 16px' }}><Badge status={c.status} /></td></tr>)}</tbody>
            </table>
          </div>
        )}

        {tab === 'payouts' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {payouts.length === 0 && <div style={{ background: '#fff', padding: 40, textAlign: 'center', borderRadius: 12 }}>No payouts yet.</div>}
            {payouts.map(p => <div key={p.id} style={{ background: '#fff', padding: '16px 20px', borderRadius: 12, display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 10 }}><div><div style={{ fontSize: 14, fontWeight: 800 }}>{p.displayName} ({p.agentCode})</div><div style={{ fontSize: 12, color: 'rgba(10,31,18,.6)' }}>{p.method?.type} {p.method?.number} · {timeAgo(p.requestedAt)}</div></div><div style={{ display: 'flex', alignItems: 'center', gap: 10 }}><div className="serif" style={{ fontSize: 18, fontWeight: 800 }}>{fmtZmw(p.amountZmw)}</div><Badge status={p.status} />{p.status === 'requested' && <Btn size="sm" variant="success" onClick={() => markPaid(p)}>Mark Paid</Btn>}</div></div>)}
          </div>
        )}
      </section>
    </div>
  );
}

/* ---------------- ROUTER ---------------- */
function App() {
  const [hash, setHash] = useState(window.location.hash || '#/');
  const [agent, setAgent] = useState(null);
  const [bootChecked, setBootChecked] = useState(false);

  useEffect(() => {
    const onHash = () => setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const loadAgent = async (user) => {
    if (!user) { setAgent(null); setBootChecked(true); return; }
    try {
      let snap = await db.collection(SE_AGENTS).doc(user.uid).get();
      if (snap.exists) {
        setAgent({ id: user.uid, ...snap.data() });
      } else {
        setAgent(null);
      }
    } catch (e) { setAgent(null); }
    setBootChecked(true);
  };

  useEffect(() => {
    if (!fbReady || !auth) { setBootChecked(true); return; }
    const unsub = auth.onAuthStateChanged(loadAgent);
    return unsub;
  }, []);

  const raw = (hash || '#/').replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  const route = parts[0] || '';
  const routeArg = parts[1] || '';

  const go = useCallback((r, arg) => {
    window.location.hash = '#/' + r + (arg ? '/' + arg : '');
    window.scrollTo({ top: 0, behavior: 'auto' });
  }, []);

  const onSignOut = async () => { await auth.signOut(); setAgent(null); go(''); };
  const onAuth = () => { loadAgent(auth.currentUser); go('dashboard'); };

  if (!bootChecked) return <Spinner label="Loading…" />;
  if (route === 'r' && routeArg) return <RedirectHandler code={routeArg.toUpperCase()} />;
  if (route === 'admin') return <AdminPage go={go} />;

  let page = <Landing go={go} />;
  if (route === 'join') page = <JoinPage go={go} onAuth={onAuth} />;
  else if (route === 'login') page = <LoginPage go={go} onAuth={onAuth} />;
  else if (route === 'dashboard') {
    if (!agent) page = <LoginPage go={go} onAuth={onAuth} />;
    else page = <Dashboard go={go} onSignOut={onSignOut} agent={agent} setAgent={setAgent} />;
  }
  else if (route === 'terms') page = <TermsPage />;

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <Nav route={route} go={go} agent={agent} onSignOut={onSignOut} />
      <main style={{ flex: 1 }}>{page}</main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
