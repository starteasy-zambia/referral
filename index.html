<style>
:root {
  --forest:#0A1F12; --forest-2:#123A1F; --green:#1E7B3C; --orange:#E8730F; 
  --orange-2:#F5A623; --light:#F5FAF6; --red:#B8564F; --teal:#0E7C7B;
}
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--light); color: var(--forest); overflow-x: hidden; margin: 0;
}
.serif { font-family: 'Playfair Display', Georgia, serif; }
input:focus, select:focus { outline: none; border-color: var(--orange) !important; }
.fadein { animation: fi .4s cubic-bezier(.22,.61,.36,1) both; }
@keyframes fi { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.spin { animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* BULLETPROOF HEADER */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: #0A1F12; border-bottom: 1px solid rgba(245,166,35,.1);
  padding: 0 16px;
}
.header-container {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  height: 64px; width: 100%;
}
.header-logo {
  display: flex; align-items: center; gap: 10px; text-decoration: none;
  background: none; border: none; cursor: pointer; font-family: inherit; padding: 0;
}
.header-logo-mark {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg,var(--orange),var(--orange-2));
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-family: 'Playfair Display', serif; font-weight: 800; font-size: 16px;
}
.header-logo-text { display: flex; flex-direction: column; text-align: left; line-height: 1; }
.header-logo-sub { font-size: 8.5px; letter-spacing: .15em; text-transform: uppercase; font-weight: 700; color: rgba(255,255,255,.4); margin-bottom: 3px; }
.header-logo-main { font-size: 15px; font-weight: 700; color: #fff; }
.header-logo-main em { font-style: normal; color: var(--orange-2); }

.header-nav { display: flex; align-items: center; gap: 20px; }
.header-link {
  background: none; border: none; cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,.6);
  padding: 6px 0; position: relative; text-decoration: none;
}
.header-link.active { color: var(--orange-2); font-weight: 700; }
.header-link.active::after {
  content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px;
  background: var(--orange-2); border-radius: 99px;
}

.header-btn {
  background: linear-gradient(135deg,var(--orange),var(--orange-2));
  color: #fff; border: none; border-radius: 8px; padding: 8px 16px;
  font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit;
  white-space: nowrap;
}

.header-mobile-toggle { display: none; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 8px; }

@media (max-width: 768px) {
  .header-nav { display: none; }
  .header-btn { display: none; }
  .header-mobile-toggle { display: block; }
  .header-mobile-menu {
    background: #0A1F12; padding: 16px; border-top: 1px solid rgba(255,255,255,.1);
    display: flex; flex-direction: column; gap: 12px;
  }
  .header-mobile-menu .header-link { font-size: 15px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
}

/* ENGAGEMENT DOCUMENT STYLES */
.doc-wrapper {
  background: #fff; border: 1px solid #D0D0D0; border-radius: 8px;
  padding: 32px; max-width: 760px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,.05);
}
.doc-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding-bottom: 18px; border-bottom: 3px solid var(--forest); margin-bottom: 24px;
}
.doc-brand { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 800; color: var(--forest); letter-spacing: 1px; }
.doc-brand em { font-style: normal; color: var(--orange); }
.doc-sub { font-size: 9.5px; color: #8A6828; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; margin-top: 4px; }
.doc-title { font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 800; color: var(--orange); letter-spacing: 1.2px; text-align: right; }
.doc-meta { font-size: 11px; color: #666; text-align: right; margin-top: 6px; }

.doc-body { font-size: 13px; line-height: 1.7; color: #333; }
.doc-body p { margin: 0 0 16px; }
.doc-body strong { color: var(--forest); }
.doc-section-title { font-family: 'Playfair Display', serif; font-size: 15px; color: var(--forest); font-weight: 700; margin: 24px 0 12px; }

.doc-input-line {

}
.doc-input-line:focus { background: #fff; border-bottom: 1px solid var(--orange); }

.doc-signature-block {
  margin-top: 32px; padding-top: 24px; border-top: 1px solid #E0E0E0;

}
@media (max-width: 600px) {
  .doc-wrapper { padding: 20px; }

  .doc-title, .doc-meta { text-align: left; }
}
.sig-line {
  font-family: 'Playfair Display', serif; font-size: 18px; font-style: italic;
  color: var(--forest); border-bottom: 1px solid #333; padding-bottom: 8px;
  margin-bottom: 8px; min-height: 38px;
}
.sig-input {
  width: 100%; font-family: 'Playfair Display', serif; font-size: 18px; font-style: italic;
  color: var(--forest); border: none; border-bottom: 1px solid #333; background: transparent;
  padding-bottom: 8px; margin-bottom: 8px; min-height: 38px;
}
.sig-input:focus { border-bottom-color: var(--orange); }
.sig-label { font-size: 10.5px; color: #666; font-weight: 600; }

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

/* ---------------- CONFIG ---------------- */
const CONFIG = {
  firebase: {
    apiKey: "AIzaSyDdEyxvsd2RjgKVYTGYJfYUB_637lV3n5I",
    authDomain: "starteasy-zambia.firebaseapp.com",
    projectId: "starteasy-zambia",
    storageBucket: "starteasy-zambia.firebasestorage.app",
    messagingSenderId: "54136399237",
    appId: "1:54136399237:web:2f9f2d7f86bfdfb4be50ec"
  },
  mainSiteUrl: 'https://starteasyzambia.com',
  adminWhatsapp: '260762499581',
  attributionDays: 30,
  minPayoutZmw: 200,
  clearingDays: 7,
  commissionTable: { micro: 40, basic: 30, standard: 25, complex: 22, checkup: 22, regularise: 18, venture: 20, ongoing_filing: 20, ongoing_standard: 20, ongoing_managed: 15 }
};

const SE_AGENTS = 'se_agents';
const SE_COMMISSIONS = 'se_commissions';
const SE_PAYOUTS = 'se_payouts';
const SE_PAYMENTS = 'se_payments';
const SE_EVENTS = 'se_events';
const SE_ADMINS = 'se_admins';
const REF_KEY = 'starteasy.ref.v1';
const CODE_RX = /^SE-[A-Z0-9-]{3,32}$/;

/* ---------------- FIREBASE ---------------- */
let db = null, auth = null, fbReady = false;
try {
  if (!firebase.apps.length) firebase.initializeApp(CONFIG.firebase);
  db = firebase.firestore();
  auth = firebase.auth();
  fbReady = true;
  auth.signInAnonymously().catch(() => {});
} catch (e) { console.error(e); }

/* ---------------- HELPERS ---------------- */
const fmtZmw = n => 'K' + (Number(n) || 0).toFixed(2);
const fmtInt = n => String(Number(n) || 0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const timeAgo = ts => {
  if (!ts) return '';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
};
const copyText = async t => {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(t); return true; }
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); return true;
  } catch (e) { return false; }
};
const isMobileUA = () => /android|iphone|ipad|ipod|mobile/i.test((navigator.userAgent || '').toLowerCase());
const waUrl = (msg, phone) => {
  const p = phone || CONFIG.adminWhatsapp; const e = encodeURIComponent(msg);
  return isMobileUA() ? 'whatsapp://send?phone=' + p + '&text=' + e : 'https://wa.me/' + p + '?text=' + e;
};
const baseUrl = () => window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/');
const generateAgentCode = name => {
  const clean = String(name || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 8) || 'AGENT';
  return 'SE-' + clean + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
};
const resolveServiceType = payment => {
  const code = String(payment.serviceCode || '').toUpperCase();
  if (code === 'P0' || code === 'P1') return 'micro';
  if (code === 'P2') return 'complex';
  if (code === 'C1') return 'checkup';
  if (code === 'C2') return 'regularise';
  if (code === 'C3') return 'ongoing_managed';
  if (code.startsWith('V-')) return 'venture';
  if (payment.ongoing === 'managed') return 'ongoing_managed';
  if (payment.ongoing === 'standard') return 'ongoing_standard';
  if (payment.ongoing === 'filing') return 'ongoing_filing';
  return 'standard';
};
const calcCommission = (type, gross) => {
  const pct = CONFIG.commissionTable[type] || 20;
  return { pct, amount: Math.round(gross * pct) / 100 };
};

/* ---------------- ATTRIBUTION ---------------- */
const readAttribution = () => {
  try {
    const raw = JSON.parse(localStorage.getItem(REF_KEY) || 'null');
    if (!raw || !raw.code) return null;
    if (Date.now() - raw.at > CONFIG.attributionDays * 24 * 3600 * 1000) return null;
    return raw;
  } catch (e) { return null; }
};
const storeAttribution = code => {
  try {
    const c = String(code).toUpperCase().trim();
    if (!CODE_RX.test(c)) return null;
    const rec = { code: c, at: Date.now(), src: window.location.href };
    localStorage.setItem(REF_KEY, JSON.stringify(rec));
    return rec;
  } catch (e) { return null; }
};
const logReferralClick = async code => {
  if (!fbReady) return;
  try {
    await db.collection(SE_EVENTS).add({ type: 'referral_click', agentCode: code, at: Date.now(), route: 'redirect' });
    const q = await db.collection(SE_AGENTS).where('agentCode', '==', code).limit(1).get();
    if (!q.empty) {
      const ref = q.docs[0].ref;
      await db.runTransaction(async t => {
        const s = await t.get(ref);
        if (!s.exists) return;
        t.update(ref, { 'totals.clicks': ((s.data().totals || {}).clicks || 0) + 1 });
      });
    }
  } catch (e) {}
};

/* ---------------- COMMISSION ENGINE ---------------- */
const createCommissionForPayment = async (payment, agent) => {
  if (!fbReady || !payment.ref || !agent) return { ok: false };
  const existing = await db.collection(SE_COMMISSIONS).where('paymentRef', '==', payment.ref).limit(1).get();
  if (!existing.empty) return { ok: true, skipped: true };

  const gross = parseFloat(String(payment.amount || '0').replace(/[^\d.]/g, '')) || 0;
  if (gross <= 0) return { ok: false };

  const serviceType = resolveServiceType(payment);
  const { pct, amount } = calcCommission(serviceType, gross);

  const commission = {
    agentId: agent.id, agentCode: agent.agentCode, paymentRef: payment.ref,
    serviceCode: payment.serviceCode || '', serviceTitle: payment.serviceTitle || '',
    serviceType, grossZmw: gross, commissionPct: pct, commissionZmw: amount,
    status: 'pending', createdAt: Date.now(), approvedAt: Date.now(),
    clearAt: Date.now() + CONFIG.clearingDays * 24 * 3600 * 1000, paidAt: null, payoutId: null
  };

  const added = await db.collection(SE_COMMISSIONS).add(commission);
  await db.runTransaction(async t => {
    const ref = db.collection(SE_AGENTS).doc(agent.id);
    const s = await t.get(ref);
    if (!s.exists) return;
    const tot = s.data().totals || {};
    t.update(ref, {
      'totals.conversions': (tot.conversions || 0) + 1,
      'totals.pendingZmw': (tot.pendingZmw || 0) + amount
    });
  });
  return { ok: true, commission: { id: added.id, ...commission } };
};

const cancelCommissionForPayment = async paymentRef => {
  if (!fbReady || !paymentRef) return { ok: false };
  try {
    const snap = await db.collection(SE_COMMISSIONS).where('paymentRef', '==', paymentRef).limit(1).get();
    if (snap.empty) return { ok: true };
    const doc = snap.docs[0]; const c = doc.data();
    if (c.status === 'paid') return { ok: false };
    await doc.ref.update({ status: 'cancelled', reversedAt: Date.now() });
    await db.runTransaction(async t => {
      const ref = db.collection(SE_AGENTS).doc(c.agentId);
      const s = await t.get(ref);
      if (!s.exists) return;
      const tot = s.data().totals || {};
      t.update(ref, {
        'totals.pendingZmw': Math.max(0, (tot.pendingZmw || 0) - c.commissionZmw),
        'totals.conversions': Math.max(0, (tot.conversions || 0) - 1)
      });
    });
    return { ok: true };
  } catch (e) { return { ok: false }; }
};

const syncCommissions = async () => {
  if (!fbReady) return;
  try {
    const paysSnap = await db.collection(SE_PAYMENTS).where('status', '==', 'approved').orderBy('submittedAt', 'desc').limit(500).get();
    for (const d of paysSnap.docs) {
      const pay = d.data();
      if (!pay.referralCode) continue;
      const cSnap = await db.collection(SE_COMMISSIONS).where('paymentRef', '==', pay.ref).limit(1).get();
      if (!cSnap.empty) continue;
      const q = await db.collection(SE_AGENTS).where('agentCode', '==', pay.referralCode).limit(1).get();
      if (q.empty) continue;
      const agent = { id: q.docs[0].id, ...q.docs[0].data() };
      if (agent.status !== 'active') continue;
      if (pay.clientEmail && agent.email && pay.clientEmail.toLowerCase() === agent.email.toLowerCase()) continue;
      if (pay.clientPhone && agent.phone && pay.clientPhone.replace(/\D/g, '') === agent.phone.replace(/\D/g, '')) continue;
      await createCommissionForPayment({ ...pay, id: d.id }, agent);
    }
    
    const cancelSnap = await db.collection(SE_PAYMENTS).where('status', 'in', ['reverted', 'declined']).orderBy('submittedAt', 'desc').limit(200).get();
    for (const d of cancelSnap.docs) {
      const pay = d.data();
      if (pay.ref) await cancelCommissionForPayment(pay.ref);
    }
  } catch (e) {}
};

/* ---------------- UI COMPONENTS ---------------- */
const Mark = ({ size = 36 }) => (
  <span style={{ width: size, height: size, borderRadius: '50%', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: 'linear-gradient(135deg,#E8730F,#F5A623)', color: '#fff', fontFamily: "'Playfair Display',serif", fontWeight: 800, fontSize: size * 0.5, flexShrink: 0 }}>S</span>
);

const Btn = ({ children, onClick, variant = 'primary', size = 'md', disabled, style, type = 'button' }) => {
  const base = { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, border: 'none', borderRadius: 8, cursor: disabled ? 'not-allowed' : 'pointer', fontFamily: 'inherit', fontWeight: 700, transition: 'all .2s', opacity: disabled ? 0.55 : 1, whiteSpace: 'nowrap' };
  const sizes = { sm: { padding: '8px 14px', fontSize: 12 }, md: { padding: '11px 20px', fontSize: 13.5 }, lg: { padding: '14px 24px', fontSize: 14.5 } };
  const variants = {
    primary: { background: 'linear-gradient(135deg,#E8730F,#F5A623)', color: '#fff' },
    dark: { background: '#0A1F12', color: '#fff' },
    ghost: { background: '#fff', color: '#0A1F12', border: '1px solid rgba(10,31,18,.15)' },
    success: { background: '#1E7B3C', color: '#fff' },
    danger: { background: '#B8564F', color: '#fff' }
  };
  return <button type={type} onClick={onClick} disabled={disabled} style={{ ...base, ...sizes[size], ...variants[variant], ...style }}>{children}</button>;
};

const Spinner = ({ label }) => (
  <div style={{ padding: 80, textAlign: 'center' }}>
    <i className="fas fa-circle-notch spin" style={{ fontSize: 28, color: '#E8730F' }}></i>
    {label && <p style={{ marginTop: 14, fontSize: 13, color: 'rgba(10,31,18,.6)' }}>{label}</p>}
  </div>
);

const Badge = ({ status }) => {
  const m = {
    active: { label: 'Active', color: '#1E7B3C', bg: '#EAF7EE', icon: 'fa-circle-check' },
    pending: { label: 'Pending', color: '#8A6828', bg: '#FFF4E5', icon: 'fa-clock' },
    earned: { label: 'Earned', color: '#1E7B3C', bg: '#EAF7EE', icon: 'fa-circle-check' },
    paid: { label: 'Paid', color: '#0E7C7B', bg: '#E6F4F4', icon: 'fa-money-bill-wave' },
    requested: { label: 'Requested', color: '#8A6828', bg: '#FFF4E5', icon: 'fa-clock' }
  }[status] || { label: status, color: '#666', bg: '#eee', icon: 'fa-circle' };
  return <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 10px', borderRadius: 99, fontSize: 10.5, fontWeight: 800, letterSpacing: '.05em', textTransform: 'uppercase', background: m.bg, color: m.color, border: `1px solid ${m.color}33` }}><i className={`fas ${m.icon}`}></i> {m.label}</span>;
};

const Kpi = ({ label, value, sub, color = '#E8730F', icon }) => (
  <div style={{ background: '#fff', border: '1px solid rgba(10,31,18,.08)', borderRadius: 12, padding: '16px 18px', borderTopWidth: 3, borderTopColor: color }}>
    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
      <span style={{ fontSize: 10.5, letterSpacing: '.1em', textTransform: 'uppercase', fontWeight: 800, color: 'rgba(10,31,18,.5)' }}>{label}</span>
      {icon && <i className={`fas ${icon}`} style={{ color, fontSize: 12 }}></i>}
    </div>
    <div className="serif" style={{ fontSize: 24, fontWeight: 800, color: '#0A1F12', lineHeight: 1.1, marginBottom: 2 }}>{value}</div>
    {sub && <div style={{ fontSize: 11, color: 'rgba(10,31,18,.5)' }}>{sub}</div>}
  </div>
);

/* ---------------- NAV (BULLETPROOF) ---------------- */
function Nav({ route, go, agent, onSignOut }) {
  const [open, setOpen] = useState(false);
  return (
    <header className="site-header">
      <div className="header-container">
        <button onClick={() => go('')} className="header-logo">
          <div className="header-logo-mark">S</div>
          <div className="header-logo-text">
            <span className="header-logo-sub">Agent Opportunity</span>
            <span className="header-logo-main">Start<em>Easy</em></span>
          </div>
        </button>

        <nav className="header-nav">
          <button onClick={() => go('')} className={`header-link ${route === '' ? 'active' : ''}`}>Home</button>
          {agent ? (
            <>
              <button onClick={() => go('dashboard')} className={`header-link ${route === 'dashboard' ? 'active' : ''}`}>Dashboard</button>
              <button onClick={onSignOut} className="header-btn" style={{ background: 'rgba(255,255,255,.1)' }}>Sign Out</button>
            </>
          ) : (
            <>
              <button onClick={() => go('join')} className={`header-link ${route === 'join' ? 'active' : ''}`}>Get Code</button>
              <button onClick={() => go('login')} className="header-btn">Sign In</button>
            </>
          )}
        </nav>

        <button onClick={() => setOpen(!open)} className="header-mobile-toggle">
          <i className={`fas ${open ? 'fa-times' : 'fa-bars'}`}></i>
        </button>
      </div>

      {open && (
        <div className="header-mobile-menu">
          <button onClick={() => { setOpen(false); go(''); }} className="header-link">Home</button>
          {agent ? (
            <>
              <button onClick={() => { setOpen(false); go('dashboard'); }} className="header-link">Dashboard</button>
              <button onClick={() => { setOpen(false); onSignOut(); }} className="header-link" style={{ color: '#B8564F' }}>Sign Out</button>
            </>
          ) : (
            <>
              <button onClick={() => { setOpen(false); go('join'); }} className="header-link">Get Code</button>
              <button onClick={() => { setOpen(false); go('login'); }} className="header-link">Sign In</button>
            </>
          )}
        </div>
      )}
    </header>
  );
}

/* ---------------- PAGES ---------------- */
function Landing({ go }) {
  return (
    <div className="fadein">
      <section style={{ background: 'linear-gradient(135deg,#0A1F12 0%,#123A1F 100%)', color: '#fff', padding: '64px 24px', textAlign: 'center' }}>
        <div style={{ maxWidth: 800, margin: '0 auto' }}>
          <span style={{ fontSize: 11, letterSpacing: '.2em', textTransform: 'uppercase', fontWeight: 800, color: '#F5A623', display: 'block', marginBottom: 16 }}>StartEasy Referral Program</span>
          <h1 className="serif" style={{ fontSize: 'clamp(2rem,5vw,3.2rem)', lineHeight: 1.1, marginBottom: 20 }}>
            Share StartEasy. <em style={{ fontStyle: 'italic', color: '#F5A623' }}>Earn on every sale.</em>
          </h1>
          <p style={{ fontSize: 16, lineHeight: 1.7, color: 'rgba(255,255,255,.7)', marginBottom: 32, maxWidth: 600, margin: '0 auto 32px' }}>
            Sign your engagement agreement to get your unique referral code instantly. Share it with your network. When someone you referred completes a StartEasy engagement, you earn a commission.
          </p>

function JoinPage({ go, onAuth }) {
  const [form, setForm] = useState({ name: '', email: '', phone: '', location: '', password: '' });
  const [agreed, setAgreed] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  const submit = async () => {
    setErr('');
    if (!form.name.trim()) return setErr('Please enter your full name.');
    if (!form.email.trim() || !/^\S+@\S+\.\S+$/.test(form.email)) return setErr('Please enter a valid email.');
    if (!form.phone.trim() || form.phone.replace(/\D/g, '').length < 9) return setErr('Please enter a valid phone number.');
    if (!form.location) return setErr('Please select your location.');
    if (!form.password || form.password.length < 6) return setErr('Password must be at least 6 characters.');
    if (!agreed) return setErr('You must check the agreement box to proceed.');

    setBusy(true);
    try {
      // 1. Create Auth Account
      const cred = await auth.createUserWithEmailAndPassword(form.email.trim().toLowerCase(), form.password);
      
      // 2. Generate Code
      const agentCode = generateAgentCode(form.name);

      // 3. Save Profile Instantly
      await db.collection(SE_AGENTS).doc(cred.user.uid).set({
        uid: cred.user.uid,
        agentCode: agentCode,
        displayName: form.name.trim(),
        email: form.email.trim().toLowerCase(),
        phone: form.phone.trim(),
        location: form.location,
        status: 'active',
        commissionPct: 20,
        createdAt: Date.now(),
        totals: { clicks: 0, conversions: 0, earnedZmw: 0, paidZmw: 0, pendingZmw: 0 }
      });

      onAuth(); // Redirect to Dashboard
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') setErr('This email is already registered. Please sign in.');
      else setErr(e.message || 'Registration failed.');
    } finally { setBusy(false); }
  };

  return (
    <div style={{ background: '#F5FAF6', padding: '40px 16px', minHeight: '100vh' }}>
      <div style={{ maxWidth: 800, margin: '0 auto' }}>
        <div style={{ textAlign: 'center', marginBottom: 32 }}>
          <h1 className="serif" style={{ fontSize: 'clamp(1.8rem,4vw,2.4rem)', color: '#0A1F12', marginBottom: 8 }}>Agent Engagement Agreement</h1>
          <p style={{ fontSize: 14, color: 'rgba(10,31,18,.6)' }}>Complete the details below to sign your agreement and instantly generate your referral code.</p>
        </div>

        <div className="doc-wrapper fadein">
          <div className="doc-header">
            <div>
              <div className="doc-brand">Start<em>Easy</em></div>
              <div className="doc-sub">Administrative Services Desk · Zambia</div>
            </div>
            <div>
              <div className="doc-title">AGENT ENGAGEMENT</div>
              <div className="doc-meta">{new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}<br/>Status: Pending Signature</div>
            </div>
          </div>

          <div className="doc-body">
            <p>This Engagement is entered into between <strong>StartEasy Zambia</strong> ("The Company") and <strong><input className="doc-input-line" placeholder="[Your Full Name]" value={form.name} onChange={e => setForm({...form, name: e.target.value})} style={{ width: 200 }} /></strong> ("The Agent").</p>
            
            <div className="doc-section-title">1. Nature of Engagement</div>
            <p>The Agent is engaged as an independent contractor. This is an opportunity to earn commissions based on sales performance. It is <strong>not</strong> an employment contract, and there is no salary, no guaranteed income, and no employee benefits.</p>

            <div className="doc-section-title">2. Commission & Payouts</div>
            <p>The Agent will earn a fixed percentage commission on the StartEasy service fees of approved sales they refer. Commissions clear after 7 days and can be withdrawn to a mobile money or bank account once the balance reaches K200.</p>

            <div className="doc-section-title">3. Agent Details</div>
            <p style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
              <span>
                <strong>Email:</strong><br/>

              </span>
              <span>
                <strong>Phone:</strong><br/>
                <input className="doc-input-line" placeholder="+260..." value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} style={{ width: '100%' }} />
              </span>
            </p>
            <p style={{ marginTop: 8 }}>
              <strong>Location:</strong><br/>
              <select className="doc-input-line" value={form.location} onChange={e => setForm({...form, location: e.target.value})} style={{ width: '100%', background: 'transparent' }}>
                <option value="">Choose location...</option>
                {['Lusaka', 'Copperbelt', 'Southern', 'Central', 'Eastern', 'Northern', 'Western', 'North-Western', 'Luapula', 'Muchinga', 'Diaspora'].map(l => <option key={l} value={l}>{l}</option>)}
              </select>
            </p>

              <div>
                <div className="sig-line">StartEasy Zambia</div>
                <div className="sig-label">For the Company</div>
              </div>
              <div>
                <input className="sig-input" placeholder="Type your full name" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />

                <span style={{ fontSize: 12, lineHeight: 1.5 }}>I agree to the engagement terms above and understand this is a commission-only independent contractor agreement.</span>
              </label>
              
              <div style={{ marginTop: 16 }}>
                <label style={{ display: 'block', fontSize: 12, fontWeight: 700, marginBottom: 6 }}>Create a password to secure your dashboard:</label>

      </div>
    </div>
  );

function RedirectHandler({ code }) {
  useEffect(() => {
    if (!CODE_RX.test(code)) { window.location.hash = '#/'; return; }
    logReferralClick(code);
    storeAttribution(code);
    setTimeout(() => { window.location.href = CONFIG.mainSiteUrl + '/?ref=' + code; }, 500);
  }, [code]);
  return <Spinner label="Redirecting to StartEasy..." />;
}

function App() {
  const [hash, setHash] = useState(window.location.hash || '#/');
  const [agent, setAgent] = useState(null);
  const [bootChecked, setBootChecked] = useState(false);

  useEffect(() => {
    const onHash = () => setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  useEffect(() => {
    if (!fbReady) { setBootChecked(true); return; }
    const unsub = auth.onAuthStateChanged(async user => {
      if (!user) { setAgent(null); setBootChecked(true); return; }
      try {
        const snap = await db.collection(SE_AGENTS).doc(user.uid).get();
        if (snap.exists) setAgent({ id: user.uid, ...snap.data() });
        else setAgent(null);
      } catch (e) { setAgent(null); }
      setBootChecked(true);
    });
    return unsub;
  }, []);

  const raw = (hash || '#/').replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  const route = parts[0] || '';
  const routeArg = parts[1] || '';

  const go = useCallback((r) => { window.location.hash = '#/' + r; window.scrollTo(0, 0); }, []);
  const onSignOut = async () => { await auth.signOut(); setAgent(null); go(''); };
  const onAuth = () => { go('dashboard'); };

  if (!bootChecked) return <Spinner />;
  if (route === 'r' && routeArg) return <RedirectHandler code={routeArg.toUpperCase()} />;

  let page = <Landing go={go} />;
  if (route === 'join') page = <JoinPage go={go} onAuth={onAuth} />;
  else if (route === 'login') page = <LoginPage go={go} onAuth={onAuth} />;
  else if (route === 'dashboard') {
    if (!agent) page = <LoginPage go={go} onAuth={onAuth} />;
    else page = <Dashboard go={go} onSignOut={onSignOut} agent={agent} setAgent={setAgent} />;
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
      <Nav route={route} go={go} agent={agent} onSignOut={onSignOut} />
      <main style={{ flex: 1 }}>{page}</main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
