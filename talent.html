<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StartEasy Zambia | Secure Team Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root {
  --forest:#0A1F12; --forest-2:#123A1F; --green:#1E7B3C; --orange:#E8730F; 
  --orange-2:#F5A623; --light:#F5FAF6; --red:#B8564F; --blue:#1B6CA8;
}
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; background: var(--light); color: var(--forest); margin: 0; overflow-x: hidden; }
.serif { font-family: 'Playfair Display', Georgia, serif; }
input:focus, textarea:focus { outline: none; border-color: var(--orange) !important; }
.fadein { animation: fi .4s cubic-bezier(.22,.61,.36,1) both; }
@keyframes fi { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* FORMAL AGREEMENT STYLES */
.el { background:#fff; border:1px solid #D0D0D0; border-radius:8px; padding:40px 50px; font-size:13.5px; line-height:1.8; color:#222; box-shadow: 0 10px 30px rgba(0,0,0,.05); max-width: 850px; margin: 0 auto; }
.el .eh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:18px;border-bottom:3px solid #0A1F12;margin-bottom:24px;flex-wrap:wrap}
.el .eh .brand{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:800;color:#0A1F12;letter-spacing:1px}
.el .eh .brand em{font-style:normal;color:#E8730F}
.el .eh .sub{font-size:10.5px;color:#8A6828;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-top:4px}
.el .eh .dt{font-family:'Playfair Display',Georgia,serif;font-size:15px;font-weight:800;color:#E8730F;letter-spacing:1.2px;text-align:right}
.el .eh .mt{font-size:11.5px;color:#666;text-align:right;margin-top:6px}
.el h4{font-family:'Playfair Display',Georgia,serif;font-size:16.5px;color:#0A1F12;font-weight:700;margin:28px 0 12px; border-bottom: 1px solid #eee; padding-bottom: 6px;}
.el h4:first-of-type{margin-top:0}
.el p{margin:0 0 16px; text-align: justify;}
.el ul{margin:0 0 18px;padding-left:24px}
.el li{margin-bottom:12px;font-size:13.5px; text-align: justify;}
.el .highlight-box{background:#F9FBFA; border-left:4px solid #E8730F; padding:18px; margin-bottom:24px; font-size:13.5px; font-weight:500;}
.el .sign{margin-top:36px;padding-top:24px;border-top:1px solid #E0E0E0;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.el .sign .sigval{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:700;color:#0A1F12;letter-spacing:.04em;font-style:italic;padding-bottom:8px;border-bottom:1px solid #333;margin-bottom:10px;min-height:40px}
.el .sign .lbl{font-size:11px;color:#666;font-weight:600; text-transform:uppercase; letter-spacing:0.05em;}
.el .ft{margin-top:36px;padding-top:16px;border-top:2px solid #0A1F12;font-size:11px;color:#666;line-height:1.6}
.doc-input-line { border-bottom: 1px dashed #999; padding: 0 4px; font-family: inherit; font-size:14px; color: var(--forest); background: #F9FBFA; border-top: none; border-left: none; border-right: none; width: 100%; margin-top: 4px; padding: 8px; transition: all 0.2s;}
.doc-input-line:focus { background: #fff; border-bottom: 2px solid var(--orange); }
@media (max-width: 600px) { .el { padding: 24px 20px; } .el .sign { grid-template-columns: 1fr; gap: 24px; } .el .eh { flex-direction: column; gap: 12px; } .el .eh .dt, .el .eh .mt { text-align: left; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState } = React;

// EXHAUSTIVELY DETAILED, PLAIN ENGLISH JOB DESCRIPTIONS & LEGAL TERMS
const ROLES = {
  cdmo: { 
    id: 'cdmo', 
    title: 'Chief Digital & Marketing Officer', 
    
    summary: 'You are the chief architect of our public image and customer acquisition. Your job is to ensure that every Zambian entrepreneur, diaspora investor, and local SME knows who we are, trusts us, and signs up on our platform. You will own the entire digital funnel, from the first ad they see to the moment they create an account.',
    
    reporting: 'You will report directly to the Founder and Chief Executive Officer. You will work closely with the Growth Associate who will execute your outreach plans.',
    
    responsibilities: [
      "**Platform Management:** You will oversee the design, copy, and user experience of the StartEasy Zambia website. You must ensure it looks premium, loads quickly, and makes it easy for people to buy our services.",
      "**Advertising Execution:** You will create, manage, and optimize paid ad campaigns on Meta (Facebook/Instagram) and LinkedIn. You will be given a budget and must ensure we get a high return on investment.",
      "**Content Creation:** You will write or oversee the creation of all blog posts, social media updates, and email newsletters. You must communicate complex topics (like PACRA compliance) in simple, engaging language.",
      "**Lead Generation Strategy:** You will design the lead magnets (e.g., free compliance checklists, downloadable guides) that encourage people to give us their email addresses.",
      "**Analytics & Reporting:** You will use Google Analytics and platform insights to track how many people visit our site, where they drop off, and how many actually pay us. You will report these numbers to the CEO every Friday."
    ],
    
    month1: 'You will conduct a full audit of our current website and marketing materials. You will create our Core Brand Guidelines (colors, fonts, tone of voice). You will map out our three primary customer profiles and write a 30-page Go-To-Market strategy document detailing exactly how we will reach them.',
    month2: 'You will execute a complete overhaul of the website copy. You will set up our LinkedIn company page and publish 3 high-value posts per week. You will create the digital assets for our next major service launch. You will set up our Google Analytics and Meta Pixel tracking.',
    month3: 'You will launch our first major paid advertising campaigns. You will run A/B tests on different ad creatives. You will analyze the Customer Acquisition Cost (CAC) and adjust the campaigns to ensure we are not spending more to get a customer than they are paying us.',
    
    compensation: [
      "**Fixed Retainer:** You will receive a guaranteed monthly payment of $1,000 USD (or the agreed ZMW equivalent) to cover your core 15 hours per week.",
      "**Equity Stake:** You will be granted a 2.5% ownership stake in StartEasy Zambia. This stake will be subject to a 2-year vesting schedule. You will earn 1/24th of this stake for every full month you work with us.",
      "**Performance Bonus:** If we hit our monthly revenue target of $10,000 USD, you will receive an additional $500 bonus for that month. If we hit $25,000 USD, you will receive a $1,500 bonus."
    ],
    
    resources: 'You will have a monthly budget of $500 for essential tools like Canva Pro, LinkedIn Sales Navigator, and ad credits. You will have direct access to the CEO for approvals and strategy. You will have our Growth Associate to help execute your campaigns.',
    
    environment: 'You can work from anywhere in the world. You are not required to relocate. We only ask that you attend one 30-minute video call with the CEO every Monday at 10:00 AM Central Africa Time (CAT).',
    
    terms: [
      "**Confidentiality:** You must not share our marketing strategies, financial data, or client lists with anyone outside the company.",
      "**Intellectual Property:** Any logos, website copy, or ad creatives you create for StartEasy Zambia belong entirely to the company, even if you leave.",
      "**Termination:** Either party can end this agreement with 30 days written notice. If you leave before your 2-year vesting is complete, you will only keep the equity you have already vested."
    ]
  },
  director_finance: { 
    id: 'director_finance', 
    title: 'Director of Finance & Administration', 
    
    summary: 'You are the legal and financial guardian of StartEasy Zambia. Your job is to keep us out of trouble with the government, ensure our taxes are paid perfectly, keep track of every cent we spend, and build the operational systems that allow us to scale from 10 clients to 10,000 clients without breaking.',
    
    reporting: 'You will report directly to the Founder and Chief Executive Officer.',
    
    responsibilities: [
      "**Government Compliance:** You will manage all interactions with PACRA (Patents and Companies Registration Agency) and ZRA (Zambia Revenue Authority). You will ensure our annual returns and tax filings are submitted accurately and on time.",
      "**Bookkeeping & Accounting:** You will manage our financial software (e.g., QuickBooks or Xero). You will record all incoming client payments and all outgoing business expenses.",
      "**Payroll Management:** You will calculate and process the monthly payments for all staff and contractors, ensuring the correct taxes are deducted.",
      "**Client Contract Management:** You will review all client service agreements before they are signed to ensure they protect the company legally.",
      "**Financial Reporting:** You will prepare a monthly financial report showing our Profit & Loss, Cash Flow, and Balance Sheet. You will present this to the CEO on the first Tuesday of every month."
    ],
    
    month1: 'You will conduct a full audit of our current PACRA and ZRA status to ensure there are no outstanding penalties. You will establish a strict internal financial control policy (who can approve spending, how receipts are stored). You will set up our official payroll system.',
    month2: 'You will implement a cloud-based bookkeeping system. You will digitize all past receipts and invoices. You will create a simple dashboard that shows the CEO exactly how much cash we have in the bank at any given time.',
    month3: 'You will map out the entire client onboarding journey from a financial perspective. You will ensure that when a client pays, the money is tracked, the service is delivered, and the revenue is recorded in the CRM without any manual errors.',
    
    compensation: [
      "**Base Salary:** You will receive a guaranteed monthly salary of K15,000 ZMW (or the agreed equivalent).",
      "**Equity Stake:** You will be granted a 4% ownership stake in StartEasy Zambia. This stake will be subject to a 4-year vesting schedule with a 1-year cliff. You will earn 1/48th of this stake for every full month you work. After your 12th month, you will officially own 1% of the company outright.",
      "**Annual Bonus:** You will be eligible for an annual performance bonus based on the company's overall profitability and your zero-penalty compliance record."
    ],
    
    resources: 'You will have full access to the company bank accounts and our external legal counsel. You will be provided with any accounting software you require. You will have an administrative assistant to help you organize physical paperwork.',
    
    environment: 'You must be based in Lusaka, Zambia. You will work from our office or remotely, but you must be physically available to go to PACRA or ZRA offices to resolve issues or submit documents in person when required.',
    
    terms: [
      "**Fiduciary Duty:** You have a legal obligation to act in the best financial interest of StartEasy Zambia at all times.",
      "**Confidentiality:** You will have access to sensitive financial data and salaries. You must never disclose this information.",
      "**Termination:** This agreement requires 60 days written notice for termination from either party."
    ]
  },
  growth_associate: { 
    id: 'growth_associate', 
    title: 'Growth & Client Associate', 
    
    summary: 'You are the engine of our revenue. Your job is to speak to as many business owners as possible, explain how StartEasy Zambia can save them time and money, and convince them to pay for our services. You are not just answering emails; you are actively hunting for new clients every single day.',
    
    reporting: 'You will report directly to the Founder and Chief Executive Officer.',
    
    responsibilities: [
      "**Outbound Prospecting:** You will use LinkedIn, Facebook Groups, and local business directories to find the contact details of at least 50 new businesses every single day.",
      "**Cold Calling & Emailing:** You will call or email these businesses using the scripts provided to you. You must make at least 40 dials or send 50 personalized emails per day.",
      "**CRM Management:** You will use our CRM software (e.g., HubSpot) to track every single conversation. You must log the outcome of every call (e.g., 'No answer', 'Not interested', 'Meeting booked').",
      "**Client Onboarding:** When a client pays, you will be their first point of contact. You will send them the welcome email, collect their required documents, and hand them over to the operations team.",
      "**Upselling:** You will call existing clients every 30 days to ensure they are happy and to sell them additional services (e.g., upgrading their supplier listing to Premium)."
    ],
    
    month1: 'You will memorize our pricing and service offerings perfectly. You will build a database of 1,000 potential business leads in Zambia. You will practice your phone scripts with the CEO until you are confident.',
    month2: 'You will hit your daily outreach targets (40 calls/50 emails per day). You will book at least 20 discovery meetings for the CEO and Director of Finance. You will begin closing your first small deals.',
    month3: 'You will be fully responsible for your own pipeline. You will close at least 5 deals per week. You will implement a system to follow up with cold leads every two weeks.',
    
    compensation: [
      "**Fixed Stipend:** You will receive a small monthly stipend of K3,000 ZMW to cover your internet and phone data costs.",
      "**Commission (Sales):** You will earn a 15% commission on the total value of any service package you sell. For example, if you sell a K1,000 registration package, you earn K150. If you sell a K10,000 procurement package, you earn K1,500.",
      "**Commission (Recurring):** You will earn a 10% recurring commission on all monthly subscriptions (like Premium Listings) you sell, for as long as that client continues to pay.",
      "**Bonuses:** If you close 10 deals in a single month, you receive an extra K1,000 bonus. If you close 20 deals, you receive an extra K3,000 bonus. There is no limit to your earnings."
    ],
    
    resources: 'You will be provided with a company laptop, a dedicated phone line, and access to our CRM. You will receive weekly training from the CEO on sales tactics.',
    
    environment: 'You can work remotely, but you must be based in Zambia so you can make calls during standard business hours (08:00 to 17:00 CAT). You may be required to attend occasional in-person networking events in Lusaka.',
    
    terms: [
      "**Clawback Policy:** Commission is only paid out after the client has paid us and the 7-day refund window has passed. If a client cancels and requests a refund, the commission will be deducted from your next payout.",
      "**Non-Solicitation:** You cannot attempt to steal StartEasy clients for another competing business while working here or for 1 year after you leave.",
      "**Termination:** This is a performance-based role. If you fail to meet your daily outreach targets for 3 consecutive weeks, the company reserves the right to terminate this agreement immediately."
    ]
  }
};

// SECURE INVITATION CODES
const LIVE_CODES = {
  'INV-CDM-7B3N': 'cdmo',
  'INV-DIR-2P8Q': 'director_finance',
  'INV-GRO-4M1X': 'growth_associate'
};

const Btn = ({ children, onClick, variant = 'primary', size = 'md', disabled, style }) => {
  const base = { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, border: 'none', borderRadius: 8, cursor: disabled ? 'not-allowed' : 'pointer', fontFamily: 'inherit', fontWeight: 700, transition: 'all .2s', opacity: disabled ? 0.55 : 1, whiteSpace: 'nowrap' };
  const sizes = { sm: { padding: '8px 14px', fontSize: 12 }, md: { padding: '11px 20px', fontSize: 13.5 }, lg: { padding: '14px 24px', fontSize: 14.5 } };
  const variants = { primary: { background: 'linear-gradient(135deg,#E8730F,#F5A623)', color: '#fff' }, dark: { background: '#0A1F12', color: '#fff' }, ghost: { background: '#fff', color: '#0A1F12', border: '1px solid rgba(10,31,18,.15)' } };
  return <button onClick={onClick} disabled={disabled} style={{ ...base, ...sizes[size], ...variants[variant], ...style }}>{children}</button>;
};

function App() {
  const [view, setView] = useState('gateway'); 
  const [inviteCode, setInviteCode] = useState('');
  const [selectedRole, setSelectedRole] = useState(null);
  const [codeError, setCodeError] = useState('');
  
  const [form, setForm] = useState({ name: '', email: '', phone: '', location: '' });
  const [agreed, setAgreed] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');

  const validateCode = () => {
    setCodeError('');
    const codeUpper = inviteCode.trim().toUpperCase();
    
    if (LIVE_CODES[codeUpper]) {
      const roleFromCode = ROLES[LIVE_CODES[codeUpper]];
      setSelectedRole(roleFromCode);
      setView('brief');
      window.scrollTo(0, 0);
    } else {
      setCodeError('Invalid or expired invitation code. Please contact StartEasy Zambia Admin.');
    }
  };

  const signAgreement = () => {
    setError('');
    if (!form.name.trim()) return setError('Please type your full legal name to sign.');
    if (!form.email.trim() || !/^\S+@\S+\.\S+$/.test(form.email)) return setError('Please enter a valid email address.');
    if (!form.phone.trim()) return setError('Please enter a valid phone number.');
    if (!form.location.trim()) return setError('Please enter your current city/location.');
    if (!agreed) return setError('You must check the acceptance box to execute this agreement.');

    setBusy(true);

    const agreementRecord = {
      roleId: selectedRole.id,
      roleTitle: selectedRole.title,
      legalName: form.name.trim(),
      email: form.email.trim().toLowerCase(),
      phone: form.phone.trim(),
      location: form.location.trim(),
      termsAccepted: true,
      signedAt: new Date().toISOString()
    };

    const existingAgreements = JSON.parse(localStorage.getItem('se_agreements') || '[]');
    existingAgreements.push(agreementRecord);
    localStorage.setItem('se_agreements', JSON.stringify(existingAgreements));

    setTimeout(() => {
      setBusy(false);
      setView('success');
      window.scrollTo(0, 0);
    }, 1000);
  };

  const resetPortal = () => {
    setView('gateway');
    setInviteCode('');
    setSelectedRole(null);
    setForm({name:'', email:'', phone:'', location:''});
    setAgreed(false);
    setError('');
    setCodeError('');
    window.scrollTo(0, 0);
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      
      <header style={{ background: '#0A1F12', padding: '16px 24px', borderBottom: '1px solid rgba(245,166,35,.1)', position: 'sticky', top: 0, zIndex: 100 }}>
        <div style={{ maxWidth: 1100, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }} onClick={resetPortal}>
            <div style={{ width: 36, height: 36, borderRadius: '50%', background: 'linear-gradient(135deg,#E8730F,#F5A623)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 18, fontFamily: 'Playfair Display' }}>S</div>
            <div>
              <div style={{ fontSize: 9, letterSpacing: '0.15em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.5)', fontWeight: 700 }}>Founding Team Portal</div>
              <div style={{ fontSize: 16, fontWeight: 700, color: '#fff' }}>StartEasy Zambia</div>
            </div>
          </div>
          {view !== 'gateway' && view !== 'success' && (
            <button onClick={resetPortal} style={{ background: 'none', border: 'none', color: '#fff', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}><i className="fas fa-sign-out-alt" style={{marginRight: 6}}></i> Exit Portal</button>
          )}
        </div>
      </header>

      <main style={{ flex: 1, background: '#F5FAF6' }}>
        
        {view === 'gateway' && (
          <div className="fadein" style={{ minHeight: '80vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
            <div style={{ maxWidth: 450, width: '100%', background: '#fff', padding: 40, borderRadius: 16, boxShadow: '0 20px 60px rgba(0,0,0,0.08)', border: '1px solid rgba(10,31,18,.08)' }}>
              <div style={{ textAlign: 'center', marginBottom: 32 }}>
                <i className="fas fa-shield-alt" style={{ fontSize: 36, color: '#E8730F', marginBottom: 16 }}></i>
                <h1 className="serif" style={{ fontSize: 26, color: '#0A1F12', margin: '0 0 8px' }}>Secure Portal Access</h1>
                <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.6)', margin: 0, lineHeight: 1.5 }}>
                  Enter the specific invitation code provided to you by the StartEasy Zambia Admin to review your role brief and formal engagement agreement.
                </p>
              </div>

              <label style={{ display: 'block', fontSize: 12, fontWeight: 700, marginBottom: 8, color: '#0A1F12' }}>Invitation Code</label>
              <input 
                type="text" 
                value={inviteCode} 
                onChange={e => setInviteCode(e.target.value.toUpperCase())} 
                placeholder="e.g. INV-CDM-XXXX"
                style={{ width: '100%', padding: 16, border: '2px solid #E8730F', borderRadius: 8, fontSize: 18, textAlign: 'center', letterSpacing: 2, fontWeight: 700, marginBottom: 16, background: '#FFF9E6' }} 
              />
              
              {codeError && <div style={{ color: '#B8564F', fontSize: 13, marginBottom: 16, textAlign: 'center', fontWeight: 600 }}>{codeError}</div>}
              
              <Btn onClick={validateCode} size="lg" variant="dark" style={{ width: '100%' }}>
                Access Role Brief & Agreement
              </Btn>
            </div>
          </div>
        )}

        {view === 'brief' && selectedRole && (
          <div className="fadein" style={{ padding: '40px 16px' }}>
            <div style={{ maxWidth: 850, margin: '0 auto', background: '#fff', padding: '40px 50px', borderRadius: 16, border: '1px solid rgba(10,31,18,0.08)', boxShadow: '0 10px 30px rgba(0,0,0,0.03)' }}>
              
              <div style={{ borderBottom: '2px solid #eee', paddingBottom: 24, marginBottom: 24 }}>
                <h1 className="serif" style={{ fontSize: 36, color: '#0A1F12', margin: '0 0 16px' }}>{selectedRole.title}</h1>
                <p style={{ fontSize: 16, color: 'rgba(10,31,18,0.7)', margin: 0, lineHeight: 1.7 }}>{selectedRole.summary}</p>
                <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.6)', marginTop: 12, fontWeight: 600 }}>{selectedRole.reporting}</p>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 32 }}>
                <div>
                  <h4 style={{ fontSize: 16, fontWeight: 800, color: '#0A1F12', marginBottom: 16 }}><i className="fas fa-list-check" style={{ color: '#E8730F', marginRight: 8 }}></i> Specific Duties & Responsibilities</h4>
                  <ul style={{ fontSize: 14.5, color: 'rgba(10,31,18,0.8)', paddingLeft: 20, margin: 0, lineHeight: 1.7 }}>
                    {selectedRole.responsibilities.map((item, i) => <li key={i} style={{ marginBottom: 10 }} dangerouslySetInnerHTML={{__html: item}} />)}
                  </ul>
                </div>

                <div>
                  <h4 style={{ fontSize: 16, fontWeight: 800, color: '#0A1F12', marginBottom: 16 }}><i className="fas fa-calendar-alt" style={{ color: '#E8730F', marginRight: 8 }}></i> Your First 90 Days (Milestones)</h4>
                  <div style={{ background: '#F9FBFA', padding: 16, borderRadius: 8 }}>
                    <p style={{ fontSize: 14.5, color: 'rgba(10,31,18,0.8)', marginBottom: 12, lineHeight: 1.7 }}><strong>Month 1:</strong> {selectedRole.month1}</p>
                    <p style={{ fontSize: 14.5, color: 'rgba(10,31,18,0.8)', marginBottom: 12, lineHeight: 1.7 }}><strong>Month 2:</strong> {selectedRole.month2}</p>
                    <p style={{ fontSize: 14.5, color: 'rgba(10,31,18,0.8)', marginBottom: 0, lineHeight: 1.7 }}><strong>Month 3:</strong> {selectedRole.month3}</p>
                  </div>
                </div>

                <div>
                  <h4 style={{ fontSize: 16, fontWeight: 800, color: '#0A1F12', marginBottom: 16 }}><i className="fas fa-wallet" style={{ color: '#1E7B3C', marginRight: 8 }}></i> Exact Compensation Structure</h4>
                  <ul style={{ fontSize: 14.5, color: 'rgba(10,31,18,0.8)', marginBottom: 24, lineHeight: 1.7, background: '#F9FBFA', padding: '16px 16px 16px 36px', borderRadius: 8 }}>
                    {selectedRole.compensation.map((item, i) => <li key={i} style={{ marginBottom: 8 }} dangerouslySetInnerHTML={{__html: item}} />)}
                  </ul>
                  
                  <h4 style={{ fontSize: 16, fontWeight: 800, color: '#0A1F12', marginBottom: 16 }}><i className="fas fa-tools" style={{ color: '#1B6CA8', marginRight: 8 }}></i> Resources & Environment</h4>
                  <p style={{ fontSize: 14.5, color: 'rgba(10,31,18,0.8)', marginBottom: 12, lineHeight: 1.7 }}>{selectedRole.resources}</p>
                  <p style={{ fontSize: 14.5, color: 'rgba(10,31,18,0.8)', margin: 0, lineHeight: 1.7 }}>{selectedRole.environment}</p>
                </div>
              </div>

              <div style={{ marginTop: 40, paddingTop: 24, borderTop: '1px solid #eee', textAlign: 'center' }}>
                <p style={{ fontSize: 15, color: '#0A1F12', fontWeight: 600, marginBottom: 16 }}>By proceeding, you confirm you have read and understood the detailed role requirements above.</p>
                <Btn onClick={() => { setView('contract'); window.scrollTo(0, 0); }} size="lg" variant="primary" style={{ width: '100%', maxWidth: 400 }}>
                  Proceed to Formal Agreement <i className="fas fa-arrow-right"></i>
                </Btn>
              </div>
            </div>
          </div>
        )}

        {view === 'contract' && selectedRole && (
          <div className="fadein" style={{ padding: '40px 16px' }}>
            
            <div className="el printable">
              <div className="eh">
                <div>
                  <div className="brand">Start<em>Easy Zambia</em></div>
                  <div className="sub">Founding Team Engagement</div>
                </div>
                <div>
                  <div className="dt">AGREEMENT OF ENGAGEMENT</div>
                  <div className="mt">
                    {new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}
                  </div>
                </div>
              </div>

              {/* DYNAMIC PREAMBLE */}
              <p>
                This Agreement of Engagement is entered into by StartEasy Zambia (the "Company") and <strong>{form.name.trim() ? form.name.trim() : '[Applicant Full Legal Name]'}</strong> (the "Appointee"). By digitally signing this document, the Appointee formally accepts the appointment, terms, and responsibilities outlined herein.
              </p>

              <h4>1. Appointment & Position</h4>
              <p>The Company hereby appoints the Appointee to the position of <strong>{selectedRole.title}</strong>. {selectedRole.reporting}</p>

              <h4>2. Role Summary</h4>
              <p>{selectedRole.summary}</p>

              <h4>3. Specific Duties & Responsibilities</h4>
              <p>The Appointee agrees to perform the following specific duties:</p>
              <ul>
                {selectedRole.responsibilities.map((item, idx) => <li key={idx} dangerouslySetInnerHTML={{__html: item}} />)}
              </ul>

              <h4>4. Performance Milestones (First 90 Days)</h4>
              <p>The Appointee agrees to execute and deliver on the following initial milestones:</p>
              <ul>
                <li><strong>Month 1:</strong> {selectedRole.month1}</li>
                <li><strong>Month 2:</strong> {selectedRole.month2}</li>
                <li><strong>Month 3:</strong> {selectedRole.month3}</li>
              </ul>

              <h4>5. Remuneration & Compensation</h4>
              <p>The Appointee's compensation for services rendered is structured strictly as follows:</p>
              <ul>
                {selectedRole.compensation.map((item, idx) => <li key={idx} dangerouslySetInnerHTML={{__html: item}} />)}
              </ul>

              <h4>6. Resources, Work Environment & Terms</h4>
              <p><strong>Allocated Resources:</strong> {selectedRole.resources}</p>
              <p><strong>Work Environment:</strong> {selectedRole.environment}</p>
              <p><strong>Binding Terms:</strong></p>
              <ul>
                {selectedRole.terms.map((term, idx) => <li key={idx} dangerouslySetInnerHTML={{__html: term}} />)}
                <li><strong>Confidentiality:</strong> You must keep all of our business plans, client information, and strategies completely confidential.</li>
              </ul>

              <h4>7. Appointee Details (For Execution)</h4>
              <p style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginTop: 10 }}>
                <span>
                  <strong>Full Legal Name:</strong><br/>
                  <input className="doc-input-line" placeholder="Enter full legal name" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                </span>
                <span>
                  <strong>Email Address:</strong><br/>
                  <input className="doc-input-line" type="email" placeholder="Enter email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                </span>
                <span>
                  <strong>Phone / WhatsApp:</strong><br/>
                  <input className="doc-input-line" placeholder="Enter phone number" value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} />
                </span>
                <span>
                  <strong>Current Location (City/Country):</strong><br/>
                  <input className="doc-input-line" placeholder="e.g. Lusaka, Zambia" value={form.location} onChange={e => setForm({...form, location: e.target.value})} />
                </span>
              </p>

              <h4>8. Declaration & Acceptance</h4>
              <div className="highlight-box">
                <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', cursor: 'pointer' }}>
                  <input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} style={{ width: 20, height: 20, marginTop: 2, accentColor: '#E8730F', flexShrink: 0 }} />
                  <span style={{ fontSize: 13.5, lineHeight: 1.6, color: '#0A1F12', fontWeight: 600 }}>
                    I, the undersigned Appointee, hereby declare that I have read, understood, and voluntarily accept the terms, compensation structure, and 90-day priorities outlined in this Agreement of Engagement. I acknowledge that this is an Entrepreneurship/Intrapreneurship opportunity and not a standard employment contract.
                  </span>
                </label>
              </div>

              {/* PROFESSIONAL SIGNATURE BLOCK */}
              <div className="sign">
                <div>
                  <div className="sigval" style={{ color: '#1B6CA8' }}>Mwaba Lewis</div>
                  <div style={{ fontSize: 13, fontWeight: 700, color: '#0A1F12', marginBottom: 4 }}>MWABA LEWIS</div>
                  <div className="lbl">Founder & Director, StartEasy Zambia</div>
                </div>
                <div>
                  <div className="sigval" style={{ color: '#E8730F' }}>
                    {form.name.trim() || '_________________________'}
                  </div>
                  <div style={{ fontSize: 13, fontWeight: 700, color: '#0A1F12', marginBottom: 4 }}>
                    {form.name.trim() || '[Applicant Name]'}
                  </div>
                  <div className="lbl">Appointee</div>
                </div>
              </div>

              {error && <div style={{ background: '#FFE8E5', color: '#B8564F', padding: 12, borderRadius: 6, marginTop: 20, fontSize: 13, fontWeight: 600 }}>{error}</div>}

              <Btn onClick={signAgreement} disabled={busy} size="lg" variant="primary" style={{ width: '100%', marginTop: 24 }}>
                {busy ? 'Processing Execution...' : 'Execute Agreement'}
              </Btn>
            </div>
          </div>
        )}

        {view === 'success' && (
          <div className="fadein" style={{ minHeight: '80vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
            <div style={{ maxWidth: 500, background: '#fff', padding: 48, borderRadius: 16, textAlign: 'center', boxShadow: '0 20px 40px rgba(0,0,0,0.05)', border: '1px solid rgba(10,31,18,0.08)' }}>
              <div style={{ width: 72, height: 72, background: '#EAF7EE', color: '#1E7B3C', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 32, margin: '0 auto 24px' }}>
                <i className="fas fa-file-signature"></i>
              </div>
              <h2 className="serif" style={{ fontSize: 28, color: '#0A1F12', marginBottom: 12 }}>Agreement Executed</h2>
              <p style={{ fontSize: 15, color: 'rgba(10,31,18,0.7)', lineHeight: 1.6, marginBottom: 32 }}>
                Thank you, <strong>{form.name}</strong>. Your formal Agreement of Engagement for the <strong>{selectedRole?.title}</strong> role has been successfully signed and recorded. 
                <br/><br/>
                You are now officially onboarded to the founding team. A copy of this signed agreement has been sent to your email at <strong>{form.email}</strong> for your records.
              </p>
              <Btn onClick={resetPortal} size="lg" variant="dark" style={{ width: '100%' }}>Return to Portal Home</Btn>
            </div>
          </div>
        )}

      </main>

      <footer style={{ background: '#0A1F12', padding: '40px 24px', textAlign: 'center', borderTop: '1px solid rgba(255,255,255,0.1)' }}>
        <p style={{ color: 'rgba(255,255,255,0.4)', fontSize: 13, margin: 0 }}>© {new Date().getFullYear()} StartEasy Zambia. All rights reserved.</p>
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
