// Human-friendly Firebase error messages
function firebaseErrorMsg(err, context = 'auth') {
  const code = err && err.code;
  if (code === 'permission-denied') {
    return "Database Permission Denied! Your Firebase Security Rules are blocking access. Please ensure 'allow list: if isRealUser();' is set for the se_appointees collection.";
  }
  if (code === 'auth/email-already-in-use')
    return "This email is already registered in our system. If you already have an account (perhaps from another StartEasy portal), please log in instead.";
  if (code === 'auth/invalid-email')
    return "That email address doesn't look valid. Please double-check it.";
  if (code === 'auth/weak-password')
    return "Your password is too weak. Please use at least 6 characters.";
  if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential')
    return context === 'login'
      ? "Incorrect email or password. If you haven't created an account yet, please sign the agreement first."
      : "We couldn't find an account with that email.";
  if (code === 'auth/too-many-requests')
    return "Too many attempts. Please wait a few minutes and try again.";
  if (code === 'auth/network-request-failed')
    return "Network error. Please check your internet connection.";
  if (code === 'auth/operation-not-allowed')
    return "Email/Password sign-in is not enabled in Firebase Console. Please contact StartEasy Admin.";
  return (err && err.message) || "Something went wrong. Please try again.";
}

        }
      } else {
        setUser(null);
        setUserData(null);
      }
      setBusy(false);
      setAuthLoading(false);
    });

    return () => unsub();

    setPhotoSaving(true);

      await db.collection('se_appointees').doc(user.uid).update({
        photoUrl: photoUrlInput.trim()

      setUserData(prev => ({ ...prev, photoUrl: photoUrlInput.trim() }));
      setShowPhotoEdit(false);

    e.preventDefault();
    setAuthError('');
    if (authPassword.length < 6) return setAuthError('Password must be at least 6 characters.');
    if (authPassword !== authConfirmPassword) return setAuthError('Passwords do not match.');

    setBusy(true);
    try {
      const cred = await auth.createUserWithEmailAndPassword(form.email.trim().toLowerCase(), authPassword);
      const profile = {
        name: form.name.trim(),
        email: form.email.trim().toLowerCase(),
        phone: form.phone.trim(),
        location: form.location.trim(),
        roleId: selectedRole.id,
        roleTitle: selectedRole.title,
        photoUrl: '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()

      await db.collection('se_appointees').doc(cred.user.uid).set(profile);
      setUserData(profile);
      setView('dashboard');
      window.scrollTo(0, 0);
    } catch (err) {
      console.error(err);
      setAuthError(firebaseErrorMsg(err, 'signup'));
    } finally {
      setBusy(false);
    }
  };

  // ─── AUTH: login ──────────────────────────────────────────────────────
  const handleLogin = async (e) => {
    e.preventDefault();
    setAuthError('');

    setBusy(true);
    try {
      await auth.signInWithEmailAndPassword(loginEmail.trim().toLowerCase(), loginPassword);

      setAuthError(firebaseErrorMsg(err, 'login'));
      setBusy(false);

    if (!resetEmail.trim() || !/^\S+@\S+\.\S+$/.test(resetEmail)) return setAuthError('Please enter a valid email address.');
    setBusy(true);
    try {

      setAuthError(firebaseErrorMsg(err, 'reset'));

                        onChange={e => setPhotoUrlInput(e.target.value)} 
                        placeholder="https://example.com/your-photo.jpg"
                        style={{ width: '100%', padding: 10, border: '1px solid #ccc', borderRadius: 6, marginBottom: 12, fontSize: 13 }}
                      />
                      <div style={{ display: 'flex', gap: 8 }}>
                        <Btn onClick={handleUpdatePhoto} disabled={photoSaving} size="sm" variant="primary">
                          {photoSaving ? 'Saving...' : 'Save Photo'}
                        </Btn>
                        <Btn onClick={() => setShowPhotoEdit(false)} size="sm" variant="ghost">Cancel</Btn>
                      </div>
                    </div>
                  )}

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 16 }}>
                    
                    {/* The Logged-in User (Always visible first) */}
                    <div style={{ textAlign: 'center', padding: 20, border: '2px solid #E8730F', borderRadius: 12, position: 'relative', background: '#FFF9E6' }}>
                      <button 
                        onClick={() => setShowPhotoEdit(!showPhotoEdit)} 
                        style={{ position: 'absolute', top: 10, right: 10, background: 'none', border: 'none', color: '#E8730F', cursor: 'pointer' }}
                        title="Update Profile Picture"
                      >
                        <i className="fas fa-edit"></i>
                      </button>
                      
                      {userData.photoUrl ? (
                        <img src={userData.photoUrl} alt={userData.name} style={{ width: 80, height: 80, borderRadius: '50%', margin: '0 auto 12px', objectFit: 'cover', border: '2px solid #E8730F' }} />
                      ) : (
                        <img src={`https://ui-avatars.com/api/?name=${encodeURIComponent(userData.name)}&background=E8730F&color=fff&size=80`} alt={userData.name} style={{ width: 80, height: 80, borderRadius: '50%', margin: '0 auto 12px' }} />
                      )}
                      
                      <h4 style={{ fontSize: 16, fontWeight: 700, margin: '0 0 4px' }}>{userData.name} (You)</h4>
                      <p style={{ fontSize: 12, color: '#E8730F', fontWeight: 700, margin: 0, textTransform: 'uppercase' }}>{userData.roleTitle}</p>
                    </div>

                    {/* Hardcoded Founder (If current user is not Mwaba) */}
                    {userData.email !== 'lewismwaba@gmail.com' && (
                      <div style={{ textAlign: 'center', padding: 20, border: '1px solid #eee', borderRadius: 12 }}>
                        <img src="https://ui-avatars.com/api/?name=Mwaba+Lewis&background=0A1F12&color=fff&size=80" alt="Mwaba Lewis" style={{ width: 80, height: 80, borderRadius: '50%', margin: '0 auto 12px' }} />
                        <h4 style={{ fontSize: 16, fontWeight: 700, margin: '0 0 4px' }}>Mwaba Lewis</h4>
                        <p style={{ fontSize: 12, color: '#1E7B3C', fontWeight: 700, margin: 0, textTransform: 'uppercase' }}>Founder</p>
                      </div>
                    )}

                    {/* Other Dynamic Team Members from Firestore */}
                    {teamMembers.filter(m => m.id !== user.uid).map(member => (
                      <div key={member.id} style={{ textAlign: 'center', padding: 20, border: '1px solid #eee', borderRadius: 12 }}>
                        {member.photoUrl ? (
                          <img src={member.photoUrl} alt={member.name} style={{ width: 80, height: 80, borderRadius: '50%', margin: '0 auto 12px', objectFit: 'cover' }} />
                        ) : (
                          <img src={`https://ui-avatars.com/api/?name=${encodeURIComponent(member.name)}&background=1E7B3C&color=fff&size=80`} alt={member.name} style={{ width: 80, height: 80, borderRadius: '50%', margin: '0 auto 12px' }} />
                        )}
                        <h4 style={{ fontSize: 16, fontWeight: 700, margin: '0 0 4px' }}>{member.name}</h4>
                        <p style={{ fontSize: 12, color: '#1E7B3C', fontWeight: 700, margin: 0, textTransform: 'uppercase' }}>{member.roleTitle}</p>
                      </div>
                    ))}

                  </div>
                </div>

              </div>

            </div>
          </div>
        )}

      </main>

      <footer className="no-print" style={{ background: '#0A1F12', padding: '40px 24px', textAlign: 'center', borderTop: '1px solid rgba(255,255,255,0.1)', width: '100%' }}>
        <p style={{ color: 'rgba(255,255,255,0.4)', fontSize: 13, margin: 0 }}>© {new Date().getFullYear()} StartEasy Zambia. All rights reserved.</p>
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
