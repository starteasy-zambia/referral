<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StartEasy Zambia | Founding Team Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root {
  --forest:#0A1F12; --forest-2:#123A1F; --green:#1E7B3C; --orange:#E8730F; 
  --orange-2:#F5A623; --light:#F5FAF6; --red:#B8564F; --blue:#1B6CA8;
}
/* FIX FOR SHAKING */
html, body { 
  overflow-x: hidden; 
  width: 100%; 
  margin: 0; 
  padding: 0;
  box-sizing: border-box;
}
*, *::before, *::after {
  box-sizing: inherit;
}
body { 
  font-family: 'Inter', system-ui, -apple-system, sans-serif; 
  -webkit-font-smoothing: antialiased; 
  background: var(--light); 
  color: var(--forest); 
}
.serif { font-family: 'Playfair Display', Georgia, serif; }
input:focus, textarea:focus { outline: none; border-color: var(--orange) !important; }
.fadein { animation: fi .4s cubic-bezier(.22,.61,.36,1) both; }
@keyframes fi { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* HEADER & NAVIGATION */
.site-header { position: sticky; top: 0; z-index: 100; background: #0A1F12; padding: 16px 24px; border-bottom: 1px solid rgba(245,166,35,.1); width: 100%; }
.header-content { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.logo-group { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.logo-mark { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#E8730F,#F5A623); color: #fff; display: flex; align-items: center; justify-content: center; fontWeight: 800; fontSize: 18px; font-family: 'Playfair Display', serif; }
.logo-text-sub { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.5); font-weight: 700; }
.logo-text-main { font-size: 16px; font-weight: 700; color: #fff; }

.menu-toggle { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 4px; }
.nav-menu { position: absolute; top: 70px; right: 24px; background: #fff; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 220px; overflow: hidden; display: flex; flex-direction: column; }
.nav-item { padding: 14px 20px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: #0A1F12; text-decoration: none; border-bottom: 1px solid #eee; transition: background 0.2s; cursor: pointer; }
.nav-item:hover { background: #F5FAF6; }
.nav-item:last-child { border-bottom: none; color: #B8564F; }

/* FORMAL AGREEMENT STYLES */
.main-container { width: 100%; max-width: 100vw; padding: 40px 16px; overflow-x: hidden; }
.el { background:#fff; border:1px solid #D0D0D0; border-radius:8px; padding:40px 50px; font-size:13.5px; line-height:1.8; color:#222; box-shadow: 0 10px 30px rgba(0,0,0,.05); max-width: 850px; width: 100%; margin: 0 auto; overflow-wrap: break-word; }
.el .eh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:18px;border-bottom:3px solid #0A1F12;margin-bottom:24px;flex-wrap:wrap}
.el .eh .brand{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:800;color:#0A1F12;letter-spacing:1px}
.el .eh .brand em{font-style:normal;color:#E8730F}
.el .eh .sub{font-size:10.5px;color:#8A6828;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-top:4px}
.el .eh .dt{font-family:'Playfair Display',Georgia,serif;font-size:15px;font-weight:800;color:#E8730F;letter-spacing:1.2px;text-align:right}
.el .eh .mt{font-size:11.5px;color:#666;text-align:right;margin-top:6px}
.el h4{font-family:'Playfair Display',Georgia,serif;font-size:16.5px;color:#0A1F12;font-weight:700;margin:28px 0 12px; border-bottom: 1px solid #eee; padding-bottom: 6px;}
.el h4:first-of-type{margin-top:0}
.el p{margin:0 0 16px; text-align: justify;}
.el ul{margin:0 0 18px;padding-left:24px}
.el li{margin-bottom:12px;font-size:13.5px; text-align: justify;}

/* 2-COLUMN GRID THAT STACKS ON MOBILE */
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; width: 100%; }
@media (max-width: 600px) { .form-grid-2 { grid-template-columns: 1fr; } }

.el .highlight-box{background:#F9FBFA; border-left:4px solid #E8730F; padding:18px; margin-bottom:24px; font-size:13.5px; font-weight:500;}
.el .sign{margin-top:36px;padding-top:24px;border-top:1px solid #E0E0E0;display:grid;grid-template-columns:1fr 1fr;gap:40px; width: 100%;}
@media (max-width: 600px) { .el .sign { grid-template-columns: 1fr; gap: 24px; } }

.el .sign .sigval{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:700;color:#0A1F12;letter-spacing:.04em;font-style:italic;padding-bottom:8px;border-bottom:1px solid #333;margin-bottom:10px;min-height:40px}
.el .sign .lbl{font-size:11px;color:#666;font-weight:600; text-transform:uppercase; letter-spacing:0.05em;}
.el .ft{margin-top:36px;padding-top:16px;border-top:2px solid #0A1F12;font-size:11px;color:#666;line-height:1.6}
.doc-input-line { border-bottom: 1px dashed #999; padding: 0 4px; font-family: inherit; font-size:14px; color: var(--forest); background: #F9FBFA; border-top: none; border-left: none; border-right: none; width: 100%; margin-top: 4px; padding: 8px; transition: all 0.2s;}
.doc-input-line:focus { background: #fff; border-bottom: 2px solid var(--orange); }

/* PRINT STYLES */
@media print {
  body * { visibility: hidden; }
  .printable, .printable * { visibility: visible; }
  .printable { position: absolute; left: 0; top: 0; width: 100%; padding: 0; margin: 0; box-shadow: none; border: none; }
  .no-print { display: none !important; }
}

@media (max-width: 600px) { .el { padding: 24px 20px; } .el .eh { flex-direction: column; gap: 12px; } .el .eh .dt, .el .eh .mt { text-align: left; } }
</style>
</head>
<body>

    month3: 'You will launch our first major paid advertising campaigns. You will run A/B tests on different ad creatives. You will analyze the Customer Acquisition Cost (CAC) and adjust the campaigns to ensure we are not spending more to get a customer than they are paying us.',

const LIVE_CODES = {
  'INV-CDM-7B3N': 'cdmo',
  'INV-DIR-2P8Q': 'director_finance',
  'INV-GRO-4M1X': 'growth_associate'
};

const Btn = ({ children, onClick, variant = 'primary', size = 'md', disabled, style }) => {
  const base = { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, border: 'none', borderRadius: 8, cursor: disabled ? 'not-allowed' : 'pointer', fontFamily: 'inherit', fontWeight: 700, transition: 'all .2s', opacity: disabled ? 0.55 : 1, whiteSpace: 'nowrap' };
  const sizes = { sm: { padding: '8px 14px', fontSize: 12 }, md: { padding: '11px 20px', fontSize: 13.5 }, lg: { padding: '14px 24px', fontSize: 14.5 } };
  const variants = { primary: { background: 'linear-gradient(135deg,#E8730F,#F5A623)', color: '#fff' }, dark: { background: '#0A1F12', color: '#fff' }, ghost: { background: '#fff', color: '#0A1F12', border: '1px solid rgba(10,31,18,.15)' }, success: { background: '#1E7B3C', color: '#fff' } };
  return <button onClick={onClick} disabled={disabled} style={{ ...base, ...sizes[size], ...variants[variant], ...style }}>{children}</button>;
};

function App() {
  const [view, setView] = useState('gateway'); 
  const [inviteCode, setInviteCode] = useState('');
  const [selectedRole, setSelectedRole] = useState(null);
  const [codeError, setCodeError] = useState('');
  const [isMenuOpen, setIsMenuOpen] = useState(false);
  
  const [form, setForm] = useState({ name: '', email: '', phone: '', location: '' });
  const [agreed, setAgreed] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');

  const [hrStatus, setHrStatus] = useState('pending');
  const [itRequest, setItRequest] = useState('');

  const validateCode = () => {
    setCodeError('');
    const codeUpper = inviteCode.trim().toUpperCase();
    if (LIVE_CODES[codeUpper]) {
      setSelectedRole(ROLES[LIVE_CODES[codeUpper]]);
      setView('brief');
      window.scrollTo(0, 0);
    } else {
      setCodeError('Invalid or expired invitation code. Please contact StartEasy Zambia Admin.');
    }
  };

  const signAgreement = () => {
    setError('');
    if (!form.name.trim()) return setError('Please type your full legal name to sign.');
    if (!form.email.trim() || !/^\S+@\S+\.\S+$/.test(form.email)) return setError('Please enter a valid email address.');
    if (!form.phone.trim()) return setError('Please enter a valid phone number.');
    if (!form.location.trim()) return setError('Please enter your current city/location.');
    if (!agreed) return setError('You must check the acceptance box to execute this agreement.');

    setBusy(true);

    const agreementRecord = {
      roleId: selectedRole.id,
      roleTitle: selectedRole.title,
      legalName: form.name.trim(),
      email: form.email.trim().toLowerCase(),
      phone: form.phone.trim(),
      location: form.location.trim(),
      termsAccepted: true,
      signedAt: new Date().toISOString()
    };

    const existingAgreements = JSON.parse(localStorage.getItem('se_agreements') || '[]');
    existingAgreements.push(agreementRecord);
    localStorage.setItem('se_agreements', JSON.stringify(existingAgreements));

    setTimeout(() => {
      setBusy(false);
      setView('onboarding');
      window.scrollTo(0, 0);
    }, 1000);
  };

  const resetPortal = () => {
    setView('gateway');
    setInviteCode('');
    setSelectedRole(null);
    setForm({name:'', email:'', phone:'', location:''});
    setAgreed(false);
    setError('');
    setCodeError('');
    setHrStatus('pending');
    setItRequest('');
    setIsMenuOpen(false);
    window.scrollTo(0, 0);
  };

  const handlePrint = () => {
    window.print();
  };

  const submitToHR = () => {
    setBusy(true);
    setTimeout(() => {
      setHrStatus('submitted');
      setBusy(false);
      window.scrollTo(0, 0);
    }, 1500);
  };

  const hrEmailLink = `mailto:hr@starteasyzambia.com?subject=Signed Agreement - ${form.name} (${selectedRole?.title})&body=Dear StartEasy Zambia HR Team,%0D%0A%0D%0APlease find attached my signed Agreement of Engagement for the ${selectedRole?.title} role.%0D%0A%0D%0AName: ${form.name}%0D%0AEmail: ${form.email}%0D%0APhone: ${form.phone}%0D%0ALocation: ${form.location}%0D%0A%0D%0ABest regards,%0D%0A${form.name}`;

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', width: '100%' }}>
      
      {/* HEADER WITH MENU */}
      <header className="site-header no-print">
        <div className="header-content">
          <div className="logo-group" onClick={resetPortal}>
            <div className="logo-mark">S</div>
            <div>
              <div className="logo-text-sub">Founding Team Portal</div>
              <div className="logo-text-main">StartEasy Zambia</div>
            </div>
          </div>
          
          <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
            <button className="menu-toggle" onClick={() => setIsMenuOpen(!isMenuOpen)}>
              <i className={`fas ${isMenuOpen ? 'fa-times' : 'fa-bars'}`}></i>
            </button>
          </div>
        </div>

        {/* DROPDOWN MENU */}
        {isMenuOpen && (
          <div className="nav-menu fadein">
            <div className="nav-item" onClick={resetPortal}>
              <i className="fas fa-home text-gray-500"></i> Home (Gateway)
            </div>
            <div className="nav-item" onClick={() => { setIsMenuOpen(false); window.scrollTo(0,0); if(view === 'gateway') alert('You are already at the login gateway.'); else resetPortal(); }}>
              <i className="fas fa-sign-in-alt text-gray-500"></i> Login to HR Portal
            </div>
            <a href="mailto:hr@starteasyzambia.com" className="nav-item" style={{ color: '#0A1F12' }}>
              <i className="fas fa-envelope text-gray-500"></i> Contact HR Support
            </a>
            <div className="nav-item" onClick={() => setIsMenuOpen(false)} style={{ borderTop: '1px solid #eee' }}>
              <i className="fas fa-times"></i> Close Menu
            </div>
          </div>
        )}
      </header>

      <main style={{ flex: 1, background: '#F5FAF6', width: '100%', overflowX: 'hidden' }}>
        
        {/* --- LANDING PAGE --- */}
        {view === 'gateway' && (
          <div className="fadein" style={{ width: '100%' }}>
            <section style={{ background: 'linear-gradient(135deg,#0A1F12 0%,#123A1F 100%)', color: '#fff', padding: '80px 24px', textAlign: 'center', width: '100%' }}>
              <div style={{ maxWidth: 800, margin: '0 auto' }}>
                <span style={{ display: 'inline-block', background: 'rgba(232,115,15,0.2)', color: '#F5A623', padding: '6px 16px', borderRadius: 99, fontSize: 12, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 24 }}>Official Partner Portal</span>
                <h1 className="serif" style={{ fontSize: 'clamp(2.5rem,6vw,4rem)', lineHeight: 1.1, marginBottom: 24 }}>
                  Welcome to the <em style={{ fontStyle: 'italic', color: '#F5A623' }}>Founding Team.</em>
                </h1>
                <p style={{ fontSize: 18, lineHeight: 1.7, color: 'rgba(255,255,255,0.8)', marginBottom: 40, maxWidth: 650, margin: '0 auto 40px' }}>
                  This is a secure portal for shortlisted candidates. If you have received an invitation code, enter it below to review your role brief and execute your formal engagement agreement.
                </p>
              </div>
            </section>

            <section style={{ padding: '60px 24px', maxWidth: 1000, margin: '0 auto', width: '100%' }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: 24, marginBottom: 60 }}>
                <div style={{ textAlign: 'center' }}>
                  <div style={{ width: 60, height: 60, borderRadius: '50%', background: '#fff', border: '2px solid #E8730F', color: '#E8730F', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, margin: '0 auto 16px', fontWeight: 800 }}>1</div>
                  <h3 style={{ fontSize: 18, fontWeight: 700, marginBottom: 8, color: '#0A1F12' }}>Verify Code</h3>
                  <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.6)', lineHeight: 1.6 }}>Enter the unique invitation code sent to your email by the StartEasy Admin team.</p>
                </div>
                <div style={{ textAlign: 'center' }}>
                  <div style={{ width: 60, height: 60, borderRadius: '50%', background: '#fff', border: '2px solid #E8730F', color: '#E8730F', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, margin: '0 auto 16px', fontWeight: 800 }}>2</div>
                  <h3 style={{ fontSize: 18, fontWeight: 700, marginBottom: 8, color: '#0A1F12' }}>Review Brief</h3>
                  <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.6)', lineHeight: 1.6 }}>Read the detailed role description, expectations, and compensation structure.</p>
                </div>
                <div style={{ textAlign: 'center' }}>
                  <div style={{ width: 60, height: 60, borderRadius: '50%', background: '#fff', border: '2px solid #E8730F', color: '#E8730F', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, margin: '0 auto 16px', fontWeight: 800 }}>3</div>
                  <h3 style={{ fontSize: 18, fontWeight: 700, marginBottom: 8, color: '#0A1F12' }}>Sign & Onboard</h3>
                  <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.6)', lineHeight: 1.6 }}>Digitally execute the agreement, submit to HR, and unlock your team workspace.</p>
                </div>
              </div>

              <div style={{ maxWidth: 450, margin: '0 auto', background: '#fff', padding: 40, borderRadius: 16, boxShadow: '0 20px 60px rgba(0,0,0,0.08)', border: '1px solid rgba(10,31,18,.08)' }}>
                <h2 className="serif" style={{ fontSize: 24, color: '#0A1F12', margin: '0 0 8px', textAlign: 'center' }}>Secure Login</h2>
                <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.6)', margin: '0 0 24px', textAlign: 'center' }}>Enter your invitation code to proceed.</p>

                <input 
                  type="text" 
                  value={inviteCode} 
                  onChange={e => setInviteCode(e.target.value.toUpperCase())} 
                  placeholder="e.g. INV-CDM-XXXX"
                  style={{ width: '100%', padding: 16, border: '2px solid #E8730F', borderRadius: 8, fontSize: 18, textAlign: 'center', letterSpacing: 2, fontWeight: 700, marginBottom: 16, background: '#FFF9E6' }} 
                />
                
                {codeError && <div style={{ color: '#B8564F', fontSize: 13, marginBottom: 16, textAlign: 'center', fontWeight: 600 }}>{codeError}</div>}
                
                <Btn onClick={validateCode} size="lg" variant="dark" style={{ width: '100%' }}>
                  Unlock Your Role Brief
                </Btn>
              </div>
            </section>
          </div>
        )}

        {/* --- BRIEF --- */}
        {view === 'brief' && selectedRole && (
          <div className="fadein main-container">
            <div style={{ maxWidth: 850, margin: '0 auto', background: '#fff', padding: '40px 50px', borderRadius: 16, border: '1px solid rgba(10,31,18,0.08)', boxShadow: '0 10px 30px rgba(0,0,0,0.03)' }}>
              
              <div style={{ borderBottom: '2px solid #eee', paddingBottom: 24, marginBottom: 24 }}>
                <h1 className="serif" style={{ fontSize: 36, color: '#0A1F12', margin: '0 0 16px' }}>{selectedRole.title}</h1>
                <p style={{ fontSize: 16, color: 'rgba(10,31,18,0.7)', margin: 0, lineHeight: 1.7 }}>{selectedRole.summary}</p>
                <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.6)', marginTop: 12, fontWeight: 600 }}>{selectedRole.reporting}</p>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 32 }}>
                <div>
                  <h4 style={{ fontSize: 16, fontWeight: 800, color: '#0A1F12', marginBottom: 16 }}><i className="fas fa-list-check" style={{ color: '#E8730F', marginRight: 8 }}></i> Specific Duties & Responsibilities</h4>
                  <ul style={{ fontSize: 14.5, color: 'rgba(10,31,18,0.8)', paddingLeft: 20, margin: 0, lineHeight: 1.7 }}>
                    {selectedRole.responsibilities.map((item, i) => <li key={i} style={{ marginBottom: 10 }} dangerouslySetInnerHTML={{__html: item}} />)}
                  </ul>
                </div>

                <div>
                  <h4 style={{ fontSize: 16, fontWeight: 800, color: '#0A1F12', marginBottom: 16 }}><i className="fas fa-calendar-alt" style={{ color: '#E8730F', marginRight: 8 }}></i> Your First 90 Days (Milestones)</h4>
                  <div style={{ background: '#F9FBFA', padding: 16, borderRadius: 8 }}>
                    <p style={{ fontSize: 14.5, color: 'rgba(10,31,18,0.8)', marginBottom: 12, lineHeight: 1.7 }}><strong>Month 1:</strong> {selectedRole.month1}</p>
                    <p style={{ fontSize: 14.5, color: 'rgba(10,31,18,0.8)', marginBottom: 12, lineHeight: 1.7 }}><strong>Month 2:</strong> {selectedRole.month2}</p>
                    <p style={{ fontSize: 14.5, color: 'rgba(10,31,18,0.8)', marginBottom: 0, lineHeight: 1.7 }}><strong>Month 3:</strong> {selectedRole.month3}</p>
                  </div>
                </div>

                <div>
                  <h4 style={{ fontSize: 16, fontWeight: 800, color: '#0A1F12', marginBottom: 16 }}><i className="fas fa-wallet" style={{ color: '#1E7B3C', marginRight: 8 }}></i> Exact Compensation Structure</h4>
                  <ul style={{ fontSize: 14.5, color: 'rgba(10,31,18,0.8)', marginBottom: 24, lineHeight: 1.7, background: '#F9FBFA', padding: '16px 16px 16px 36px', borderRadius: 8 }}>
                    {selectedRole.compensation.map((item, i) => <li key={i} style={{ marginBottom: 8 }} dangerouslySetInnerHTML={{__html: item}} />)}
                  </ul>
                  
                  <h4 style={{ fontSize: 16, fontWeight: 800, color: '#0A1F12', marginBottom: 16 }}><i className="fas fa-tools" style={{ color: '#1B6CA8', marginRight: 8 }}></i> Resources & Environment</h4>
                  <p style={{ fontSize: 14.5, color: 'rgba(10,31,18,0.8)', marginBottom: 12, lineHeight: 1.7 }}>{selectedRole.resources}</p>
                  <p style={{ fontSize: 14.5, color: 'rgba(10,31,18,0.8)', margin: 0, lineHeight: 1.7 }}>{selectedRole.environment}</p>
                </div>
              </div>

              <div style={{ marginTop: 40, paddingTop: 24, borderTop: '1px solid #eee', textAlign: 'center' }}>
                <p style={{ fontSize: 15, color: '#0A1F12', fontWeight: 600, marginBottom: 16 }}>By proceeding, you confirm you have read and understood the detailed role requirements above.</p>
                <Btn onClick={() => { setView('contract'); window.scrollTo(0, 0); }} size="lg" variant="primary" style={{ width: '100%', maxWidth: 400 }}>
                  Proceed to Formal Agreement <i className="fas fa-arrow-right"></i>
                </Btn>
              </div>
            </div>
          </div>
        )}

        {/* --- CONTRACT --- */}
        {view === 'contract' && selectedRole && (
          <div className="fadein main-container">
            <div className="el printable">
              <div className="eh">
                <div>
                  <div className="brand">Start<em>Easy Zambia</em></div>
                  <div className="sub">Founding Team Engagement</div>
                </div>
                <div>
                  <div className="dt">AGREEMENT OF ENGAGEMENT</div>
                  <div className="mt">
                    {new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}
                  </div>
                </div>
              </div>

              <p>
                This Agreement of Engagement is entered into by StartEasy Zambia (the "Company") and <strong>{form.name.trim() ? form.name.trim() : '[Applicant Full Legal Name]'}</strong> (the "Appointee"). By digitally signing this document, the Appointee formally accepts the appointment, terms, and responsibilities outlined herein.
              </p>

              <h4>1. Appointment & Position</h4>
              <p>The Company hereby appoints the Appointee to the position of <strong>{selectedRole.title}</strong>. {selectedRole.reporting}</p>

              <h4>2. Role Summary</h4>
              <p>{selectedRole.summary}</p>

              <h4>3. Specific Duties & Responsibilities</h4>
              <p>The Appointee agrees to perform the following specific duties:</p>
              <ul>
                {selectedRole.responsibilities.map((item, idx) => <li key={idx} dangerouslySetInnerHTML={{__html: item}} />)}
              </ul>

              <h4>4. Performance Milestones (First 90 Days)</h4>
              <p>The Appointee agrees to execute and deliver on the following initial milestones:</p>
              <ul>
                <li><strong>Month 1:</strong> {selectedRole.month1}</li>
                <li><strong>Month 2:</strong> {selectedRole.month2}</li>
                <li><strong>Month 3:</strong> {selectedRole.month3}</li>
              </ul>

              <h4>5. Remuneration & Compensation</h4>
              <p>The Appointee's compensation for services rendered is structured strictly as follows:</p>
              <ul>
                {selectedRole.compensation.map((item, idx) => <li key={idx} dangerouslySetInnerHTML={{__html: item}} />)}
              </ul>

              <h4>6. Resources, Work Environment & Terms</h4>
              <p><strong>Allocated Resources:</strong> {selectedRole.resources}</p>
              <p><strong>Work Environment:</strong> {selectedRole.environment}</p>
              <p><strong>Binding Terms:</strong></p>
              <ul>
                {selectedRole.terms.map((term, idx) => <li key={idx} dangerouslySetInnerHTML={{__html: term}} />)}
                <li><strong>Confidentiality:</strong> You must keep all of our business plans, client information, and strategies completely confidential.</li>
              </ul>

              <h4>7. Appointee Details (For Execution)</h4>
              <div className="form-grid-2">
                <span>
                  <strong>Full Legal Name:</strong><br/>
                  <input className="doc-input-line" placeholder="Enter full legal name" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                </span>
                <span>
                  <strong>Email Address:</strong><br/>
                  <input className="doc-input-line" type="email" placeholder="Enter email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                </span>
                <span>
                  <strong>Phone / WhatsApp:</strong><br/>
                  <input className="doc-input-line" placeholder="Enter phone number" value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} />
                </span>
                <span>
                  <strong>Current Location (City/Country):</strong><br/>
                  <input className="doc-input-line" placeholder="e.g. Lusaka, Zambia" value={form.location} onChange={e => setForm({...form, location: e.target.value})} />
                </span>
              </div>

              <h4>8. Declaration & Acceptance</h4>
              <div className="highlight-box">
                <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', cursor: 'pointer' }}>
                  <input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} style={{ width: 20, height: 20, marginTop: 2, accentColor: '#E8730F', flexShrink: 0 }} />
                  <span style={{ fontSize: 13.5, lineHeight: 1.6, color: '#0A1F12', fontWeight: 600 }}>
                    I, the undersigned Appointee, hereby declare that I have read, understood, and voluntarily accept the terms, compensation structure, and 90-day priorities outlined in this Agreement of Engagement. I acknowledge that this is an Entrepreneurship/Intrapreneurship opportunity and not a standard employment contract.
                  </span>
                </label>
              </div>

              <div className="sign">
                <div>
                  <div className="sigval" style={{ color: '#1B6CA8' }}>Mwaba Lewis</div>
                  <div style={{ fontSize: 13, fontWeight: 700, color: '#0A1F12', marginBottom: 4 }}>MWABA LEWIS</div>
                  <div className="lbl">Founder, StartEasy Zambia</div>
                </div>
                <div>
                  <div className="sigval" style={{ color: '#E8730F' }}>
                    {form.name.trim() || '_________________________'}
                  </div>
                  <div style={{ fontSize: 13, fontWeight: 700, color: '#0A1F12', marginBottom: 4 }}>
                    {form.name.trim() || '[Applicant Name]'}
                  </div>
                  <div className="lbl">Appointee</div>
                </div>
              </div>

              {error && <div style={{ background: '#FFE8E5', color: '#B8564F', padding: 12, borderRadius: 6, marginTop: 20, fontSize: 13, fontWeight: 600 }}>{error}</div>}

              <div className="no-print" style={{ width: '100%' }}>
                <Btn onClick={signAgreement} disabled={busy} size="lg" variant="primary" style={{ width: '100%', marginTop: 24 }}>
                  {busy ? 'Processing...' : 'Execute Agreement & Proceed to HR'}
                </Btn>
              </div>
            </div>
          </div>
        )}

        {/* --- HR ONBOARDING DASHBOARD --- */}
        {view === 'onboarding' && (
          <div className="fadein main-container" style={{ minHeight: '100vh' }}>
            <div style={{ maxWidth: 900, margin: '0 auto', width: '100%' }}>
              
              <div style={{ background: 'linear-gradient(135deg,#0A1F12,#123A1F)', padding: '40px', borderRadius: 16, textAlign: 'center', marginBottom: 32, color: '#fff', boxShadow: '0 20px 40px rgba(0,0,0,0.1)', width: '100%' }}>
                <div style={{ width: 64, height: 64, background: '#EAF7EE', color: '#1E7B3C', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 28, margin: '0 auto 16px' }}>
                  <i className="fas fa-handshake"></i>
                </div>
                <h1 className="serif" style={{ fontSize: 32, margin: '0 0 12px' }}>Welcome to the Team, {form.name.split(' ')[0]}!</h1>
                <p style={{ fontSize: 16, color: 'rgba(255,255,255,0.8)', maxWidth: 600, margin: '0 auto', lineHeight: 1.6 }}>
                  You are now officially part of the StartEasy Zambia founding team.
                </p>
              </div>

              {hrStatus === 'pending' ? (
                <div style={{ background: '#FFF9E6', border: '1px solid #F5A623', borderRadius: 16, padding: 32, marginBottom: 32, textAlign: 'center', width: '100%' }}>
                  <i className="fas fa-file-signature" style={{ fontSize: 40, color: '#E8730F', marginBottom: 16 }}></i>
                  <h2 style={{ fontSize: 22, fontWeight: 800, color: '#0A1F12', marginBottom: 12 }}>Action Required: Submit to HR</h2>
                  <p style={{ fontSize: 15, color: 'rgba(10,31,18,0.8)', marginBottom: 24, lineHeight: 1.6, maxWidth: 600, margin: '0 auto 24px' }}>
                    Your contract is signed, but your official HR file is not yet complete. Please click the button below to submit your digital agreement to the HR team for review and final approval.
                  </p>
                  
                  <div style={{ display: 'flex', gap: 12, justifyContent: 'center', flexWrap: 'wrap', marginBottom: 24 }}>
                    <Btn onClick={handlePrint} variant="dark" size="lg">
                      <i className="fas fa-print"></i> Print / Save PDF
                    </Btn>
                    <Btn onClick={submitToHR} disabled={busy} variant="primary" size="lg">
                      {busy ? 'Submitting...' : 'Submit Contract to HR'}
                    </Btn>
                  </div>

                  <p style={{ fontSize: 12.5, color: 'rgba(10,31,18,0.6)', margin: 0 }}>
                    <em>Fallback: You can also manually email your saved PDF to <a href={hrEmailLink} style={{ color: '#E8730F', fontWeight: 700 }}>hr@starteasyzambia.com</a></em>
                  </p>
                </div>
              ) : (
                <div style={{ background: '#EAF7EE', border: '1px solid #1E7B3C', borderRadius: 16, padding: 32, marginBottom: 32, textAlign: 'center', width: '100%' }}>
                  <i className="fas fa-check-circle" style={{ fontSize: 40, color: '#1E7B3C', marginBottom: 16 }}></i>
                  <h2 style={{ fontSize: 22, fontWeight: 800, color: '#0A1F12', marginBottom: 12 }}>HR File Submitted Successfully</h2>
                  <p style={{ fontSize: 15, color: 'rgba(10,31,18,0.8)', marginBottom: 0, lineHeight: 1.6, maxWidth: 600, margin: '0 auto' }}>
                    The HR team has received your contract. You now have full access to the StartEasy Zambia remote workspace below.
                  </p>
                </div>
              )}

              {hrStatus === 'submitted' && (
                <div className="fadein" style={{ width: '100%' }}>
                  
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: 24, marginBottom: 32, width: '100%' }}>
                    <div style={{ background: '#0A1F12', borderRadius: 16, padding: 32, color: '#fff', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
                      <h3 className="serif" style={{ fontSize: 22, color: '#F5A623', marginBottom: 12 }}>Message from the Founder</h3>
                      <p style={{ fontSize: 14, color: 'rgba(255,255,255,0.8)', lineHeight: 1.7, marginBottom: 20 }}>
                        "Welcome aboard. We are building something truly special here at StartEasy Zambia. Your role is critical to our success. I look forward to working closely with you. Let's get to work."
                      </p>
                      <p style={{ fontSize: 14, fontWeight: 700 }}>— Mwaba Lewis, Founder</p>
                    </div>

                    <div style={{ background: '#fff', borderRadius: 16, padding: 32, border: '1px solid rgba(10,31,18,0.08)' }}>
                      <h3 style={{ fontSize: 18, fontWeight: 800, color: '#0A1F12', marginBottom: 16 }}>Request IT Setup</h3>
                      <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.7)', marginBottom: 16 }}>Do you need a company email address, laptop, or software license?</p>
                      <textarea 
                        value={itRequest}
                        onChange={e => setItRequest(e.target.value)}
                        placeholder="e.g., I need a company email and a Zoom Pro license..."
                        style={{ width: '100%', height: 80, padding: 12, border: '1px solid #ccc', borderRadius: 8, marginBottom: 16, fontFamily: 'inherit' }}
                      />
                      <Btn onClick={() => { alert("IT Request sent to HR!"); setItRequest(''); }} variant="ghost" style={{ width: '100%' }}>Send Request</Btn>
                    </div>
                  </div>

                  <div style={{ background: '#fff', borderRadius: 16, padding: 32, border: '1px solid rgba(10,31,18,0.08)', boxShadow: '0 10px 30px rgba(0,0,0,0.03)', width: '100%' }}>
                    <h2 style={{ fontSize: 20, fontWeight: 800, color: '#0A1F12', marginBottom: 24, display: 'flex', alignItems: 'center', gap: 12 }}>
                      <i className="fas fa-laptop-code" style={{ color: '#E8730F' }}></i> Your Remote Workspace
                    </h2>
                    
                    <div style={{ display: 'grid', gap: 16 }}>
                      {[
                        { title: 'Team WhatsApp Group', desc: 'Join the internal group for instant communication.', icon: 'fa-whatsapp', color: '#25D366', link: 'https://chat.whatsapp.com/mock-invite-link', btn: 'Join WhatsApp' },
                        { title: 'StartEasy Slack Workspace', desc: 'Our primary tool for project channels and daily updates.', icon: 'fa-slack', color: '#4A154B', link: 'https://slack.com/mock-invite', btn: 'Open Slack' },
                        { title: 'Company Notion Wiki', desc: 'Access all SOPs, brand guidelines, and project boards.', icon: 'fa-book', color: '#000000', link: 'https://notion.so/mock-invite', btn: 'Open Notion' },
                      ].map((task, i) => (
                        <div key={i} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: 16, border: '1px solid #eee', borderRadius: 8, flexWrap: 'wrap', gap: 16 }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                            <div style={{ width: 44, height: 44, borderRadius: 10, background: `${task.color}15`, color: task.color, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 22 }}>
                              <i className={`fab ${task.icon}`}></i>
                            </div>
                            <div>
                              <h4 style={{ fontSize: 15, fontWeight: 700, margin: '0 0 4px', color: '#0A1F12' }}>{task.title}</h4>
                              <p style={{ fontSize: 13, color: 'rgba(10,31,18,0.6)', margin: 0 }}>{task.desc}</p>
                            </div>
                          </div>
                          <a href={task.link} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none' }}>
                            <Btn size="md" variant="dark">{task.btn} <i className="fas fa-external-link-alt" style={{ fontSize: 12, marginLeft: 4 }}></i></Btn>
                          </a>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div style={{ background: '#fff', borderRadius: 16, padding: 32, border: '1px solid rgba(10,31,18,0.08)', marginTop: 32, width: '100%' }}>
                    <h2 style={{ fontSize: 20, fontWeight: 800, color: '#0A1F12', marginBottom: 24 }}>Meet the Founding Team</h2>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 16 }}>
                      <div style={{ textAlign: 'center', padding: 20, border: '1px solid #eee', borderRadius: 12 }}>
                        <img src="https://ui-avatars.com/api/?name=Mwaba+Lewis&background=E8730F&color=fff&size=80" alt="Mwaba Lewis" style={{ width: 80, height: 80, borderRadius: '50%', margin: '0 auto 12px' }} />
                        <h4 style={{ fontSize: 16, fontWeight: 700, margin: '0 0 4px' }}>Mwaba Lewis</h4>
                        <p style={{ fontSize: 12, color: '#E8730F', fontWeight: 700, margin: 0, textTransform: 'uppercase' }}>Founder</p>
                      </div>
                      <div style={{ textAlign: 'center', padding: 20, border: '1px solid #eee', borderRadius: 12 }}>
                        <div style={{ width: 80, height: 80, borderRadius: '50%', background: '#EAF7EE', color: '#1E7B3C', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 30, margin: '0 auto 12px' }}>
                          <i className="fas fa-user"></i>
                        </div>
                        <h4 style={{ fontSize: 16, fontWeight: 700, margin: '0 0 4px' }}>{form.name}</h4>
                        <p style={{ fontSize: 12, color: '#1E7B3C', fontWeight: 700, margin: 0, textTransform: 'uppercase' }}>{selectedRole.title}</p>
                      </div>
                    </div>
                  </div>

                </div>
              )}

            </div>
          </div>
        )}

      </main>

      <footer className="no-print" style={{ background: '#0A1F12', padding: '40px 24px', textAlign: 'center', borderTop: '1px solid rgba(255,255,255,0.1)', width: '100%' }}>
        <p style={{ color: 'rgba(255,255,255,0.4)', fontSize: 13, margin: 0 }}>© {new Date().getFullYear()} StartEasy Zambia. All rights reserved.</p>
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
