<style>
:root {
  --forest:#0A1F12; --forest-2:#123A1F; --green:#1E7B3C; --orange:#E8730F; 
  --orange-2:#F5A623; --light:#F5FAF6; --red:#B8564F; --teal:#0E7C7B; --blue:#1B6CA8;
}
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--light); color: var(--forest); overflow-x: hidden; margin: 0;
}
.serif { font-family: 'Playfair Display', Georgia, serif; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--orange) !important; }
.fadein { animation: fi .4s cubic-bezier(.22,.61,.36,1) both; }
@keyframes fi { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.spin { animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* HEADER */
.site-header { position: sticky; top: 0; z-index: 50; background: #0A1F12; border-bottom: 1px solid rgba(245,166,35,.1); padding: 0 16px; }
.header-container { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 64px; width: 100%; }
.header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; background: none; border: none; cursor: pointer; font-family: inherit; padding: 0; }
.header-logo-mark { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,var(--orange),var(--orange-2)); color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-weight: 800; font-size: 16px; }
.header-logo-text { display: flex; flex-direction: column; text-align: left; line-height: 1; }
.header-logo-sub { font-size: 8.5px; letter-spacing: .15em; text-transform: uppercase; font-weight: 700; color: rgba(255,255,255,.4); margin-bottom: 3px; }
.header-logo-main { font-size: 15px; font-weight: 700; color: #fff; }
.header-logo-main em { font-style: normal; color: var(--orange-2); }
.header-nav { display: flex; align-items: center; gap: 20px; }
.header-link { background: none; border: none; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.6); padding: 6px 0; position: relative; text-decoration: none; white-space: nowrap; }
.header-link.active { color: var(--orange-2); font-weight: 700; }
.header-link.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px; background: var(--orange-2); border-radius: 99px; }
.header-btn { background: linear-gradient(135deg,var(--orange),var(--orange-2)); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
.header-mobile-toggle { display: none; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 8px; }
@media (max-width: 900px) {
  .header-nav { display: none; }
  .header-btn { display: none; }
  .header-mobile-toggle { display: block; }
  .header-mobile-menu { background: #0A1F12; padding: 16px 24px 24px; border-top: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 16px; position: absolute; top: 64px; left: 0; right: 0; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .header-mobile-menu .header-link { font-size: 15px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .header-mobile-menu .header-btn { display: block; width: 100%; text-align: center; padding: 14px; font-size: 15px; margin-top: 8px; }
}

/* ENGAGEMENT LETTER */
.el { background:#fff; border:1px solid #D0D0D0; border-radius:8px; padding:34px 42px; font-size:13px; line-height:1.65; color:#222; box-shadow: 0 10px 30px rgba(0,0,0,.05); max-width: 800px; margin: 0 auto; }
.el .eh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:18px;border-bottom:3px solid #0A1F12;margin-bottom:22px;flex-wrap:wrap}
.el .eh .brand{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:800;color:#0A1F12;letter-spacing:1px}
.el .eh .brand em{font-style:normal;color:#E8730F}
.el .eh .sub{font-size:10px;color:#8A6828;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-top:4px}
.el .eh .dt{font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:800;color:#E8730F;letter-spacing:1.2px;text-align:right}
.el .eh .mt{font-size:11px;color:#666;text-align:right;margin-top:6px}
.el h4{font-family:'Playfair Display',Georgia,serif;font-size:15px;color:#0A1F12;font-weight:700;margin:22px 0 10px}
.el h4:first-of-type{margin-top:0}
.el p{margin:0 0 12px}
.el ul{margin:0 0 14px;padding-left:22px}
.el li{margin-bottom:6px;font-size:12.5px}
.el .sign{margin-top:26px;padding-top:20px;border-top:1px solid #E0E0E0;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.el .sign .sigval{font-family:'Playfair Display',Georgia,serif;font-size:16px;font-weight:700;color:#0A1F12;letter-spacing:.04em;font-style:italic;padding-bottom:8px;border-bottom:1px solid #333;margin-bottom:10px;min-height:38px}
.el .sign .siginput{width:100%;font-family:'Playfair Display',Georgia,serif;font-size:16px;font-weight:700;color:#0A1F12;letter-spacing:.04em;font-style:italic;padding:0 0 8px;border:none;border-bottom:1px solid #333;background:transparent;outline:none;margin-bottom:10px;min-height:38px;transition:border-color .2s}
.el .sign .siginput:focus{border-bottom-color:#E8730F}
.el .sign .siginput::placeholder{font-family:'Inter',system-ui,sans-serif;font-size:12px;font-weight:500;font-style:normal;letter-spacing:normal;color:rgba(10,31,18,.4)}
.el .sign .lbl{font-size:10.5px;color:#666;font-weight:600}
.el .ft{margin-top:22px;padding-top:16px;border-top:2px solid #0A1F12;font-size:10.5px;color:#666;line-height:1.6}
.doc-input-line { border-bottom: 1px dashed #999; padding: 0 4px; font-family: inherit; font-size: 13px; color: var(--forest); background: #F9FBFA; border-top: none; border-left: none; border-right: none; width: 100%; margin-top: 4px; padding: 6px; }
.doc-input-line:focus { background: #fff; border-bottom: 1px solid var(--orange); }
@media (max-width: 600px) { .el { padding: 20px; } .el .sign { grid-template-columns: 1fr; gap: 20px; } .el .eh { flex-direction: column; gap: 10px; } .el .eh .dt, .el .eh .mt { text-align: left; } }
@media print { body * { visibility: hidden; } .printable, .printable * { visibility: visible; } .printable { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; background: #fff; box-shadow: none; border: none; } .no-print { display: none !important; } }
</style>

/* ---------------- FIREBASE ---------------- */
let db = null, auth = null, fbReady = false;
try {

  auth = firebase.auth();

/* ---------------- HELPERS ---------------- */
const fmtZmw = n => 'K' + (Number(n) || 0).toFixed(2);
const fmtInt = n => String(Number(n) || 0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const copyText = async t => {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(t); return true; } return false; } catch (e) { return false; }
};
const isMobileUA = () => /android|iphone|ipad|ipod|mobile/i.test((navigator.userAgent || '').toLowerCase());
const waUrl = (msg, phone) => { const p = phone || CONFIG.adminWhatsapp; const e = encodeURIComponent(msg); return isMobileUA() ? 'whatsapp://send?phone=' + p + '&text=' + e : 'https://wa.me/' + p + '?text=' + e; };
const generateAgentCode = name => { const clean = String(name || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 8) || 'USER'; return 'SE-' + clean + '-' + Math.random().toString(36).slice(2, 6).toUpperCase(); };

/* ---------------- UI COMPONENTS ---------------- */
const Btn = ({ children, onClick, variant = 'primary', size = 'md', disabled, style, type = 'button' }) => {
  const base = { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, border: 'none', borderRadius: 8, cursor: disabled ? 'not-allowed' : 'pointer', fontFamily: 'inherit', fontWeight: 700, transition: 'all .2s', opacity: disabled ? 0.55 : 1, whiteSpace: 'nowrap' };
  const sizes = { sm: { padding: '8px 14px', fontSize: 12 }, md: { padding: '11px 20px', fontSize: 13.5 }, lg: { padding: '14px 24px', fontSize: 14.5 } };
  const variants = { primary: { background: 'linear-gradient(135deg,#E8730F,#F5A623)', color: '#fff' }, dark: { background: '#0A1F12', color: '#fff' }, ghost: { background: '#fff', color: '#0A1F12', border: '1px solid rgba(10,31,18,.15)' }, success: { background: '#1E7B3C', color: '#fff' } };
  return <button type={type} onClick={onClick} disabled={disabled} style={{ ...base, ...sizes[size], ...variants[variant], ...style }}>{children}</button>;
};
const Spinner = ({ label }) => (<div style={{ padding: 80, textAlign: 'center' }}><i className="fas fa-circle-notch spin" style={{ fontSize: 28, color: '#E8730F' }}></i>{label && <p style={{ marginTop: 14, fontSize: 13, color: 'rgba(10,31,18,.6)' }}>{label}</p>}</div>);
const Badge = ({ status }) => {
  const m = { active: { label: 'Active', color: '#1E7B3C', bg: '#EAF7EE', icon: 'fa-circle-check' }, pending: { label: 'Pending', color: '#8A6828', bg: '#FFF4E5', icon: 'fa-clock' }, earned: { label: 'Earned', color: '#1E7B3C', bg: '#EAF7EE', icon: 'fa-circle-check' }, paid: { label: 'Paid', color: '#0E7C7B', bg: '#E6F4F4', icon: 'fa-money-bill-wave' } }[status] || { label: status, color: '#666', bg: '#eee', icon: 'fa-circle' };
  return <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 10px', borderRadius: 99, fontSize: 10.5, fontWeight: 800, letterSpacing: '.05em', textTransform: 'uppercase', background: m.bg, color: m.color, border: `1px solid ${m.color}33` }}><i className={`fas ${m.icon}`}></i> {m.label}</span>;
};
const Kpi = ({ label, value, sub, color = '#E8730F', icon }) => (
  <div style={{ background: '#fff', border: '1px solid rgba(10,31,18,.08)', borderRadius: 12, padding: '16px 18px', borderTopWidth: 3, borderTopColor: color }}>

    </div>
    <div className="serif" style={{ fontSize: 24, fontWeight: 800, color: '#0A1F12', lineHeight: 1.1, marginBottom: 2 }}>{value}</div>
    {sub && <div style={{ fontSize: 11, color: 'rgba(10,31,18,.5)' }}>{sub}</div>}
  </div>
);

/* ---------------- NAVIGATION ---------------- */
function Nav({ route, go, agent, onSignOut }) {

  const handleNav = (r) => { setOpen(false); go(r); };

          <button onClick={() => handleNav('')} className={`header-link ${route === '' ? 'active' : ''}`}>Home</button>

function HowItWorks({ go }) {

        {/* Role Cards */}

                {[

                  { tier: 'Standard', ex: 'Business Name, Tax Returns', fee: 'K400', pct: '25%', earn: 'K100' },
                  { tier: 'Complex', ex: 'Company Incorporation', fee: 'K750', pct: '22%', earn: 'K165' },

function JoinPage({ go, onAuth }) {
  const [roleId, setRoleId] = useState('referral_agent');
  const [form, setForm] = useState({ name: '', email: '', phone: '', location: '', password: '' });
  const [agreed, setAgreed] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [showPassword, setShowPassword] = useState(false);

  const selectedRole = ROLES[roleId];

  const submit = async () => {
    setErr('');
    if (!form.name.trim()) return setErr('Please type your full name on the signature line.');
    if (!form.email.trim() || !/^\S+@\S+\.\S+$/.test(form.email)) return setErr('Please enter a valid email.');
    if (!form.phone.trim() || form.phone.replace(/\D/g, '').length < 9) return setErr('Please enter a valid phone number.');
    if (!form.location) return setErr('Please select your location.');
    if (!form.password || form.password.length < 6) return setErr('Password must be at least 6 characters.');
    if (!agreed) return setErr('You must check the agreement box to proceed.');

    setBusy(true);
    try {
      const cred = await auth.createUserWithEmailAndPassword(form.email.trim().toLowerCase(), form.password);
      const agentCode = generateAgentCode(form.name);

      await db.collection(SE_AGENTS).doc(cred.user.uid).set({
        uid: cred.user.uid,
        agentCode: agentCode,
        displayName: form.name.trim(),
        email: form.email.trim().toLowerCase(),
        phone: form.phone.trim(),
        location: form.location,
        role: roleId, // STORE THE SELECTED ROLE
        status: 'active',
        commissionPct: 20,
        createdAt: Date.now(),
        totals: { clicks: 0, conversions: 0, earnedZmw: 0, paidZmw: 0, pendingZmw: 0 }
      });

      onAuth();
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') setErr('This email is already registered. Please sign in.');
      else setErr(e.message || 'Registration failed.');
    } finally { setBusy(false); }
  };

  return (
    <div style={{ background: '#F5FAF6', padding: '40px 16px', minHeight: '100vh' }}>
      
      {/* Role Selector */}
      <div style={{ maxWidth: 800, margin: '0 auto 24px', background: '#fff', padding: 24, borderRadius: 12, border: '1px solid rgba(10,31,18,.08)' }}>
        <label style={{ display: 'block', fontSize: 14, fontWeight: 800, color: '#0A1F12', marginBottom: 12 }}>1. Select the role you are applying for:</label>
        <select 
          value={roleId} 
          onChange={e => setRoleId(e.target.value)}
          style={{ width: '100%', padding: 12, border: '2px solid #E8730F', borderRadius: 8, fontSize: 15, fontWeight: 700, background: '#FFF9E6', color: '#0A1F12', cursor: 'pointer' }}
        >
          {Object.values(ROLES).map(r => <option key={r.id} value={r.id}>{r.title} ({r.type})</option>)}
        </select>
      </div>

      {/* Dynamic Agreement */}
      <div className="el fadein printable">
        <div className="eh">
          <div>
            <div className="brand">Start<em>Easy</em></div>
            <div className="sub">StartEasy Zambia</div>
          </div>
          <div>
            <div className="dt">ENGAGEMENT AGREEMENT</div>
            <div className="mt">
              {new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}<br/>
              Role: {selectedRole.title}
            </div>
          </div>
        </div>

        <p><strong>Dear {form.name.trim() ? form.name.trim() : '___________________'},</strong></p>
        
        <p>Thank you for considering an opportunity engagement with StartEasy Zambia. This agreement sets out the terms of your participation as a <strong>{selectedRole.title}</strong>.</p>

        <h4>1. Nature of Engagement</h4>
        <ul>
          {selectedRole.clauses.map((clause, idx) => <li key={idx}>{clause}</li>)}
        </ul>

        <h4>2. Compensation</h4>
        <p>
          Your compensation model is defined as: <strong>{selectedRole.type}</strong>. 
          {roleId === 'referral_agent' || roleId === 'growth_associate' ? ' You will earn commissions based on the StartEasy Commission Structure (see portal for full table).' : ''}
        </p>

        <h4>3. Personal Details</h4>
        <p style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginTop: 10 }}>
          <span>
            <strong>Email Address:</strong><br/>
            <input className="doc-input-line" type="email" placeholder="you@example.com" value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
          </span>
          <span>
            <strong>Phone / WhatsApp:</strong><br/>
            <input className="doc-input-line" placeholder="+260..." value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} />
          </span>
        </p>
        <p style={{ marginTop: 12 }}>
          <strong>Location:</strong><br/>
          <select className="doc-input-line" value={form.location} onChange={e => setForm({...form, location: e.target.value})}>
            <option value="">Choose location...</option>
            {['Lusaka', 'Copperbelt', 'Southern', 'Central', 'Eastern', 'Northern', 'Western', 'North-Western', 'Luapula', 'Muchinga', 'Diaspora'].map(l => <option key={l} value={l}>{l}</option>)}
          </select>
        </p>

        <h4>4. Acceptance</h4>
        <p>To proceed, create a password for your portal dashboard, confirm your agreement below, and sign on the right.</p>
        
        <div style={{ marginTop: 12, marginBottom: 20, padding: 16, background: '#F9FBFA', borderRadius: 8, border: '1px dashed #ccc' }}>
          <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', cursor: 'pointer' }}>
            <input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} style={{ width: 18, height: 18, marginTop: 2, accentColor: '#E8730F' }} />
            <span style={{ fontSize: 12, lineHeight: 1.5, color: '#0A1F12' }}>I have read and agree to the engagement terms above. I understand my role and compensation structure as a {selectedRole.title}.</span>
          </label>
          
          <div style={{ marginTop: 16 }}>
            <label style={{ display: 'block', fontSize: 11, fontWeight: 700, marginBottom: 4, textTransform: 'uppercase', letterSpacing: '.05em' }}>Create Portal Password:</label>
            <div style={{ position: 'relative' }}>
              <input 
                type={showPassword ? 'text' : 'password'} 
                className="doc-input-line" 
                placeholder="Min 6 characters" 
                value={form.password} 
                onChange={e => setForm({...form, password: e.target.value})} 
                style={{ paddingRight: '40px' }}
              />
              <button type="button" onClick={() => setShowPassword(!showPassword)} style={{ position: 'absolute', right: '8px', top: '50%', transform: 'translateY(-50%)', background: 'none', border: 'none', cursor: 'pointer', color: 'rgba(10,31,18,.5)', fontSize: '16px', padding: '4px' }}>
                <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
              </button>
            </div>
          </div>
        </div>

        <div className="sign">
          <div>
            <div className="sigval">MWABA LEWIS</div>
            <div className="lbl">For StartEasy</div>
          </div>
          <div>
            <input className="siginput" placeholder="Type full name to sign" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
            <div className="lbl">For the {selectedRole.title}</div>
          </div>
        </div>

        {err && <div style={{ background: '#FFE8E5', color: '#B8564F', padding: 12, borderRadius: 6, marginTop: 20, fontSize: 13, fontWeight: 600 }}>{err}</div>}

        <Btn onClick={submit} disabled={busy} size="lg" variant="primary" style={{ width: '100%', marginTop: 24 }}>
          {busy ? 'Processing...' : 'Digitally Sign & Create Account'}
        </Btn>

        <div className="ft">
          <strong>StartEasy</strong> · Lusaka, Zambia · {CONFIG.contactEmail} · +260 762499581
        </div>
      </div>
    </div>
  );
}

function LoginPage({ go, onAuth }) {
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  
  const submit = async () => {
    setErr('');
    if (!email.trim() || !pw) return setErr('Enter your email and password.');
    setBusy(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), pw);
      onAuth();
    } catch (e) {
      if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') setErr('Incorrect email or password.');
      else setErr(e.message || 'Sign in failed.');
    } finally { setBusy(false); }
  };

  return (
    <div style={{ minHeight: '70vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '40px 20px' }}>
      <div style={{ background: '#fff', borderRadius: 14, padding: '32px 28px', maxWidth: 400, width: '100%', boxShadow: '0 20px 60px rgba(0,0,0,.08)' }}>
        <h1 className="serif" style={{ fontSize: 24, color: '#0A1F12', marginBottom: 6 }}>Welcome back</h1>
        <p style={{ fontSize: 13, color: 'rgba(10,31,18,.6)', marginBottom: 24 }}>Sign in to access your portal.</p>
        <label style={{ display: 'block', fontSize: 12.5, fontWeight: 700, marginBottom: 6 }}>Email</label>
        <input type="email" value={email} onChange={e => setEmail(e.target.value)} style={{ width: '100%', padding: 12, border: '1px solid #ccc', borderRadius: 8, marginBottom: 16 }} />
        <label style={{ display: 'block', fontSize: 12.5, fontWeight: 700, marginBottom: 6 }}>Password</label>
        <input type="password" value={pw} onChange={e => setPw(e.target.value)} style={{ width: '100%', padding: 12, border: '1px solid #ccc', borderRadius: 8, marginBottom: 16 }} />
        {err && <div style={{ color: '#B8564F', fontSize: 12.5, marginBottom: 16, lineHeight: 1.5 }}>{err}</div>}
        <Btn onClick={submit} disabled={busy} size="lg" variant="primary" style={{ width: '100%', marginBottom: 16 }}>
          {busy ? 'Signing in...' : 'Sign in'}
        </Btn>
        <p style={{ fontSize: 12, textAlign: 'center', margin: 0 }}>Need a role? <a href="#/join" style={{ color: '#E8730F', fontWeight: 700 }}>Sign agreement here</a>.</p>
      </div>
    </div>
  );
}

      db.collection(SE_COMMISSIONS).where('agentId', '==', agent.id).orderBy('createdAt', 'desc').limit(50).onSnapshot(s => setCommissions(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => {})

      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 16 }}>

function App() {
  const [hash, setHash] = useState(window.location.hash || '#/');
  const [agent, setAgent] = useState(null);
  const [bootChecked, setBootChecked] = useState(false);

  useEffect(() => {
    const onHash = () => setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  useEffect(() => {
    if (!fbReady) { setBootChecked(true); return; }
    const unsub = auth.onAuthStateChanged(async user => {
      if (!user) { setAgent(null); setBootChecked(true); return; }
      try {
        const snap = await db.collection(SE_AGENTS).doc(user.uid).get();
        if (snap.exists) setAgent({ id: user.uid, ...snap.data() });
        else setAgent(null);
      } catch (e) { setAgent(null); }
      setBootChecked(true);
    });
    return unsub;
  }, []);

  const raw = (hash || '#/').replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  const route = parts[0] || '';

  const go = useCallback((r) => { window.location.hash = '#/' + r; window.scrollTo(0, 0); }, []);
  const onSignOut = async () => { await auth.signOut(); setAgent(null); go(''); };
  const onAuth = () => { go('dashboard'); };

  if (!bootChecked) return <Spinner />;

  let page = <Landing go={go} />;
  if (route === 'how-it-works') page = <HowItWorks go={go} />;
  else if (route === 'join') page = <JoinPage go={go} onAuth={onAuth} />;
  else if (route === 'login') page = <LoginPage go={go} onAuth={onAuth} />;
  else if (route === 'dashboard') {
    if (!agent) page = <LoginPage go={go} onAuth={onAuth} />;
    else page = <Dashboard onSignOut={onSignOut} agent={agent} setAgent={setAgent} />;
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
      <Nav route={route} go={go} agent={agent} onSignOut={onSignOut} />
      <main style={{ flex: 1 }}>{page}</main>
      <footer style={{ background: '#0A1F12', padding: '40px 24px', textAlign: 'center' }}>
        <p style={{ color: 'rgba(255,255,255,.5)', fontSize: 14, margin: 0 }}>© {new Date().getFullYear()} StartEasy Zambia. All rights reserved.</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
