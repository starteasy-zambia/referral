<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StartEasy Zambia | Formal Engagement Agreement</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root {
  --forest:#0A1F12; --forest-2:#123A1F; --green:#1E7B3C; --orange:#E8730F; 
  --orange-2:#F5A623; --light:#F5FAF6; --red:#B8564F; --blue:#1B6CA8;
}
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; background: var(--light); color: var(--forest); margin: 0; overflow-x: hidden; }
.serif { font-family: 'Playfair Display', Georgia, serif; }
input:focus, textarea:focus { outline: none; border-color: var(--orange) !important; }
.fadein { animation: fi .4s cubic-bezier(.22,.61,.36,1) both; }
@keyframes fi { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* FORMAL ENGAGEMENT LETTER STYLES */
.el { background:#fff; border:1px solid #D0D0D0; border-radius:8px; padding:40px 50px; font-size:13.5px; line-height:1.7; color:#222; box-shadow: 0 10px 30px rgba(0,0,0,.05); max-width: 800px; margin: 0 auto; }
.el .eh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:18px;border-bottom:3px solid #0A1F12;margin-bottom:24px;flex-wrap:wrap}
.el .eh .brand{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:800;color:#0A1F12;letter-spacing:1px}
.el .eh .brand em{font-style:normal;color:#E8730F}
.el .eh .sub{font-size:10.5px;color:#8A6828;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-top:4px}
.el .eh .dt{font-family:'Playfair Display',Georgia,serif;font-size:15px;font-weight:800;color:#E8730F;letter-spacing:1.2px;text-align:right}
.el .eh .mt{font-size:11.5px;color:#666;text-align:right;margin-top:6px}
.el h4{font-family:'Playfair Display',Georgia,serif;font-size:16px;color:#0A1F12;font-weight:700;margin:24px 0 10px; border-bottom: 1px solid #eee; padding-bottom: 6px;}
.el h4:first-of-type{margin-top:0}
.el p{margin:0 0 14px}
.el ul{margin:0 0 16px;padding-left:24px}
.el li{margin-bottom:8px;font-size:13px}
.el .highlight-box{background:#F9FBFA; border-left:4px solid #E8730F; padding:16px; margin-bottom:20px; font-size:13px; font-weight:500;}
.el .sign{margin-top:30px;padding-top:24px;border-top:1px solid #E0E0E0;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.el .sign .sigval{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;color:#0A1F12;letter-spacing:.04em;font-style:italic;padding-bottom:8px;border-bottom:1px solid #333;margin-bottom:10px;min-height:40px}
.el .sign .lbl{font-size:11px;color:#666;font-weight:600; text-transform:uppercase; letter-spacing:0.05em;}
.el .ft{margin-top:30px;padding-top:16px;border-top:2px solid #0A1F12;font-size:11px;color:#666;line-height:1.6}
.doc-input-line { border-bottom: 1px dashed #999; padding: 0 4px; font-family: inherit; font-size: 14px; color: var(--forest); background: #F9FBFA; border-top: none; border-left: none; border-right: none; width: 100%; margin-top: 4px; padding: 8px; transition: all 0.2s;}
.doc-input-line:focus { background: #fff; border-bottom: 2px solid var(--orange); }
@media (max-width: 600px) { .el { padding: 24px 20px; } .el .sign { grid-template-columns: 1fr; gap: 24px; } .el .eh { flex-direction: column; gap: 12px; } .el .eh .dt, .el .eh .mt { text-align: left; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState } = React;

// EXTREMELY DETAILED FOUNDING TEAM ROLES (Contractual Terms)
const ROLES = {
  cdmo: { 
    id: 'cdmo', 
    title: 'Chief Digital & Marketing Officer', 
    type: 'Fractional or Full-Time (Equity + Retainer)',
    pitch: 'We need an architect to build the StartEasy brand engine from scratch. You will define our digital presence, optimize our acquisition funnels, and position us as the premier business support platform in Zambia.',
    day90Plan: [
      "Month 1 (Foundation): Audit the current platform MVP. Define target personas (Local SMEs, Diaspora, Foreign Investors). Map out the comprehensive Go-To-Market digital strategy.",
      "Month 2 (Activation): Overhaul the digital presence (website copy, LinkedIn strategy, lead magnets) to ensure the brand looks premium and trustworthy to high-net-worth clients.",
      "Month 3 (Execution): Launch initial paid acquisition campaigns (Meta, LinkedIn) to drive high-quality leads into the platform. Analyze conversion metrics and adjust the funnel."
    ],
    compensation: "Hybrid Structure: A fixed monthly fractional retainer + a proposed equity stake (1% - 3%) subject to a 2-year vesting schedule + performance bonuses tied to specific Monthly Recurring Revenue (MRR) targets.",
    resources: "You report directly to the CEO. You will have a lean budget for essential tools (Meta Ads, LinkedIn Sales Navigator, Canva) and execution support from our Growth Associate.",
    environment: "Fully Remote. You can work from anywhere globally. Occasional travel to Zambia for major strategic milestones (e.g., investor pitches) is welcomed but not mandatory.",
    clauses: [
      "You are joining as the Chief Digital & Marketing Officer (CDMO) of StartEasy Zambia on a fractional or full-time basis.",
      "Compensation is a mix of a fixed retainer, equity, and performance-based bonuses as detailed above.",
      "You are responsible for the digital Go-To-Market strategy, brand positioning, and user acquisition."
    ]
  },
  director_finance: { 
    id: 'director_finance', 
    title: 'Director of Finance & Admin', 
    type: 'Hybrid (Equity + Base Salary)',
    pitch: 'You are the operational backbone. You will ensure strict regulatory compliance (PACRA, ZRA), oversee financial reporting, and build the administrative infrastructure that allows us to scale without breaking.',
    day90Plan: [
      "Month 1 (Compliance Setup): Audit all current PACRA/ZRA filings. Establish robust internal financial controls. Set up the company payroll and invoicing structure.",
      "Month 2 (Systems): Implement bookkeeping software. Establish monthly financial reporting dashboards for the CEO and Board.",
      "Month 3 (Optimization): Streamline client onboarding workflows to ensure seamless handoffs between Sales and Operations. Ensure all contracts are legally sound."
    ],
    compensation: "Base Salary + Significant Equity Stake (4-year vesting schedule with a 1-year cliff).",
    resources: "Full access to company bank accounts, legal counsel, and administrative tools. You will work closely with our external accounting partners.",
    environment: "Hybrid. Primarily based in Lusaka, Zambia. You will need to be physically present for PACRA/ZRA submissions when necessary.",
    clauses: [
      "You are joining as the Director of Finance & Administration.",
      "Your compensation includes a base salary and an equity stake, subject to a standard 4-year vesting schedule.",
      "You are legally responsible for the financial integrity and regulatory compliance of StartEasy Zambia."
    ]
  },
  growth_associate: { 
    id: 'growth_associate', 
    title: 'Growth & Client Associate', 
    type: 'Base + Uncapped Commission',
    pitch: 'You are on the frontlines. You will execute aggressive outbound sales strategies, onboard new SMEs, and drive revenue growth by closing service agreements. If you can handle rejection and hustle hard, you will earn heavily here.',
    day90Plan: [
      "Month 1 (Training & Lists): Master the StartEasy service offerings. Build a targeted database of 500+ potential SME leads across Zambia.",
      "Month 2 (Outreach): Execute 50+ calls/emails per day. Book discovery meetings for the CEO and Director of Finance.",
      "Month 3 (Closing): Transition into closing your own deals. Manage the onboarding experience and upsell clients into premium compliance packages."
    ],
    compensation: "A modest fixed monthly retainer + an uncapped 10% - 15% commission on every deal you close.",
    resources: "You will be provided with CRM access, cold-calling scripts, email templates, and direct mentorship from the executive team.",
    environment: "Fully Remote, with flexible hours to overlap with Zambian business hours (CAT).",
    clauses: [
      "You are joining as a Growth & Client Associate on a hybrid compensation structure.",
      "Compensation includes a fixed monthly retainer plus uncapped commission on all closed deals.",
      "You are expected to maintain meticulous records of all client interactions within the CRM."
    ]
  },
  ceo: { 
    id: 'ceo', 
    title: 'Founder & CEO', 
    type: 'Equity Only',
    pitch: 'The visionary leader. You will drive capital raising initiatives, manage investor relations, and oversee strategic execution across all departments. You must be willing to get your hands dirty while also pitching to VCs.',
    day90Plan: [
      "Month 1: Finalize the core founding team. Establish the legal structure. Lock in the Q3 fundraising strategy and update the investor pitch deck.",
      "Month 2: Pitch to impact investors and venture capital firms. Secure initial runway to fund the CDMO and Growth Associate roles.",
      "Month 3: Oversee the Go-To-Market launch alongside the team. Ensure all departments are aligned with company goals and KPIs."
    ],
    compensation: "Primarily equity-based (Founder shares), with terms to be finalized in the Shareholders Agreement.",
    resources: "Full control of company direction, board seats, and the strategic backing of M. Lewis Group / Basiwel Ventures.",
    environment: "On-site in Lusaka, Zambia (or willing to relocate immediately).",
    clauses: [
      "You are joining as the Founder & CEO of StartEasy Zambia.",
      "You will be responsible for overall company strategy, fundraising, and team leadership.",
      "Your compensation is primarily equity-based, detailed in the Shareholders Agreement."
    ]
  }
};

// HARDCODED CODES FOR YOU TO DISTRIBUTE
const LIVE_CODES = {
  'INV-CDM-7B3N': 'cdmo',
  'INV-DIR-2P8Q': 'director_finance',
  'INV-GRO-4M1X': 'growth_associate',
  'INV-CEO-5R9T': 'ceo'
};

const Btn = ({ children, onClick, variant = 'primary', size = 'md', disabled, style }) => {
  const base = { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, border: 'none', borderRadius: 8, cursor: disabled ? 'not-allowed' : 'pointer', fontFamily: 'inherit', fontWeight: 700, transition: 'all .2s', opacity: disabled ? 0.55 : 1, whiteSpace: 'nowrap' };
  const sizes = { sm: { padding: '8px 14px', fontSize: 12 }, md: { padding: '11px 20px', fontSize: 13.5 }, lg: { padding: '14px 24px', fontSize: 14.5 } };
  const variants = { primary: { background: 'linear-gradient(135deg,#E8730F,#F5A623)', color: '#fff' }, dark: { background: '#0A1F12', color: '#fff' }, ghost: { background: '#fff', color: '#0A1F12', border: '1px solid rgba(10,31,18,.15)' } };
  return <button onClick={onClick} disabled={disabled} style={{ ...base, ...sizes[size], ...variants[variant], ...style }}>{children}</button>;
};

function App() {
  // view: 'landing' | 'portal' | 'contract' | 'success'
  const [view, setView] = useState('landing'); 
  const [inviteCode, setInviteCode] = useState('');
  const [selectedRole, setSelectedRole] = useState(null);
  const [codeError, setCodeError] = useState('');
  
  // Form State (Only legal details needed for contract)
  const [form, setForm] = useState({ name: '', email: '', phone: '', location: '' });
  const [agreed, setAgreed] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');

  const handleApplyClick = (role) => {
    setSelectedRole(role);
    setView('portal'); 
    setInviteCode('');
    setCodeError('');
    window.scrollTo(0, 0);
  };

  const validateCode = () => {
    setCodeError('');
    const codeUpper = inviteCode.trim().toUpperCase();
    
    if (LIVE_CODES[codeUpper]) {
      const roleFromCode = ROLES[LIVE_CODES[codeUpper]];
      
      // Security: Do not reveal the actual role if wrong
      if (selectedRole && roleFromCode.id !== selectedRole.id) {
        setCodeError('Invalid or unauthorized invitation code for this specific role.');
        return;
      }
      
      setSelectedRole(roleFromCode);
      setView('contract');
      window.scrollTo(0, 0);
    } else {
      setCodeError('Invalid or expired invitation code. Please contact StartEasy Zambia Admin.');
    }
  };

  const signAgreement = () => {
    setError('');
    if (!form.name.trim()) return setError('Please type your full legal name to sign.');
    if (!form.email.trim() || !/^\S+@\S+\.\S+$/.test(form.email)) return setError('Please enter a valid email address.');
    if (!form.phone.trim()) return setError('Please enter a valid phone number.');
    if (!form.location.trim()) return setError('Please enter your current city/location.');
    if (!agreed) return setError('You must check the acceptance box to execute this agreement.');

    setBusy(true);

    const agreementRecord = {
      roleId: selectedRole.id,
      roleTitle: selectedRole.title,
      legalName: form.name.trim(),
      email: form.email.trim().toLowerCase(),
      phone: form.phone.trim(),
      location: form.location.trim(),
      termsAccepted: true,
      signedAt: new Date().toISOString()
    };

    const existingAgreements = JSON.parse(localStorage.getItem('se_agreements') || '[]');
    existingAgreements.push(agreementRecord);
    localStorage.setItem('se_agreements', JSON.stringify(existingAgreements));

    setTimeout(() => {
      setBusy(false);
      setView('success');
      window.scrollTo(0, 0);
    }, 1000);
  };

  const resetToHome = () => {
    setView('landing');
    setInviteCode('');
    setSelectedRole(null);
    setForm({name:'', email:'', phone:'', location:''});
    setAgreed(false);
    setError('');
    setCodeError('');
    window.scrollTo(0, 0);
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      
      {/* HEADER */}
      <header style={{ background: '#0A1F12', padding: '16px 24px', borderBottom: '1px solid rgba(245,166,35,.1)', position: 'sticky', top: 0, zIndex: 100 }}>
        <div style={{ maxWidth: 1100, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }} onClick={resetToHome}>
            <div style={{ width: 36, height: 36, borderRadius: '50%', background: 'linear-gradient(135deg,#E8730F,#F5A623)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 18, fontFamily: 'Playfair Display' }}>S</div>
            <div>
              <div style={{ fontSize: 9, letterSpacing: '0.15em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.5)', fontWeight: 700 }}>Founding Team</div>
              <div style={{ fontSize: 16, fontWeight: 700, color: '#fff' }}>StartEasy Zambia</div>
            </div>
          </div>
          
          <div style={{ display: 'flex', gap: 16 }}>
            {view === 'landing' && (
              <>
                <a href="#roles" style={{ color: '#fff', fontSize: 14, fontWeight: 600, textDecoration: 'none' }}>Open Roles</a>
                <button onClick={() => setView('portal')} style={{ background: 'none', border: 'none', color: '#F5A623', fontSize: 14, fontWeight: 700, cursor: 'pointer' }}>Team Portal Login</button>
              </>
            )}
            {view !== 'landing' && view !== 'success' && (
              <button onClick={resetToHome} style={{ background: 'none', border: 'none', color: '#fff', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}><i className="fas fa-arrow-left" style={{marginRight: 6}}></i> Back to Home</button>
            )}
          </div>
        </div>
      </header>

      {/* MAIN CONTENT */}
      <main style={{ flex: 1 }}>
        
        {/* --- LANDING VIEW (Public Directory) --- */}
        {view === 'landing' && (
          <div className="fadein">
            {/* Hero */}
            <section style={{ background: 'linear-gradient(135deg,#0A1F12 0%,#123A1F 100%)', color: '#fff', padding: '100px 24px', textAlign: 'center' }}>
              <div style={{ maxWidth: 800, margin: '0 auto' }}>
                <span style={{ display: 'inline-block', background: 'rgba(232,115,15,0.2)', color: '#F5A623', padding: '6px 16px', borderRadius: 99, fontSize: 12, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 24 }}>Female-Led Tech Startup</span>
                <h1 className="serif" style={{ fontSize: 'clamp(2.5rem,6vw,4rem)', lineHeight: 1.1, marginBottom: 24 }}>
                  Build StartEasy Zambia <em style={{ fontStyle: 'italic', color: '#F5A623' }}>From The Ground Up.</em>
                </h1>
                <p style={{ fontSize: 18, lineHeight: 1.7, color: 'rgba(255,255,255,0.8)', marginBottom: 40, maxWidth: 650, margin: '0 auto 40px' }}>
                  We are building the premier business support platform in Zambia. We are not offering standard salaried jobs right now. We are offering equity, commission, and the opportunity to build a legacy. We want founders and intrapreneurs who are ready to execute.
                </p>
                <a href="#roles" style={{ display: 'inline-flex', alignItems: 'center', gap: 10, background: 'linear-gradient(135deg,#E8730F,#F5A623)', color: '#fff', padding: '16px 32px', borderRadius: 8, fontSize: 16, fontWeight: 700, textDecoration: 'none' }}>
                  View Open Roles <i className="fas fa-arrow-down"></i>
                </a>
              </div>
            </section>

            {/* Public Role Directory */}
            <section id="roles" style={{ padding: '80px 24px', background: '#F5FAF6' }}>
              <div style={{ maxWidth: 1000, margin: '0 auto' }}>
                <div style={{ textAlign: 'center', marginBottom: 56 }}>
                  <h2 className="serif" style={{ fontSize: 36, color: '#0A1F12', marginBottom: 16 }}>Founding Team Directory</h2>
                  <p style={{ fontSize: 16, color: 'rgba(10,31,18,0.6)', maxWidth: 600, margin: '0 auto' }}>
                    We believe in total transparency. Read the exact expectations, compensation structures, and 90-day plans before you request an invitation code.
                  </p>
                </div>

                <div style={{ display: 'grid', gap: 32 }}>
                  {Object.values(ROLES).map(role => (
                    <div key={role.id} style={{ background: '#fff', padding: '40px', borderRadius: 16, border: '1px solid rgba(10,31,18,0.08)', boxShadow: '0 10px 30px rgba(0,0,0,0.03)' }}>
                      
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 24, marginBottom: 32, borderBottom: '1px solid #eee', paddingBottom: 32 }}>
                        <div style={{ flex: 1, minWidth: 300 }}>
                          <div style={{ fontSize: 12, fontWeight: 800, textTransform: 'uppercase', color: '#E8730F', letterSpacing: '0.05em', marginBottom: 8 }}>{role.type}</div>
                          <h3 className="serif" style={{ fontSize: 32, color: '#0A1F12', margin: '0 0 12px' }}>{role.title}</h3>
                          <p style={{ fontSize: 16, color: 'rgba(10,31,18,0.7)', margin: 0, lineHeight: 1.6, maxWidth: 650 }}>{role.pitch}</p>
                        </div>
                        <div>
                          <Btn size="lg" variant="dark" onClick={() => handleApplyClick(role)}>Proceed to Agreement <i className="fas fa-lock" style={{marginLeft: 6, fontSize: 12}}></i></Btn>
                          <p style={{ fontSize: 11, color: 'rgba(10,31,18,0.4)', textAlign: 'center', marginTop: 8 }}>Requires Invitation Code</p>
                        </div>
                      </div>

                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: 32 }}>
                        <div>
                          <h4 style={{ fontSize: 14, fontWeight: 800, color: '#0A1F12', marginBottom: 16 }}><i className="fas fa-calendar-alt" style={{ color: '#E8730F', marginRight: 8 }}></i> First 90-Day Priorities</h4>
                          <ul style={{ fontSize: 14, color: 'rgba(10,31,18,0.75)', paddingLeft: 20, margin: 0, lineHeight: 1.6 }}>
                            {role.day90Plan.map((item, i) => <li key={i} style={{ marginBottom: 10 }}>{item}</li>)}
                          </ul>
                        </div>

                        <div>
                          <h4 style={{ fontSize: 14, fontWeight: 800, color: '#0A1F12', marginBottom: 16 }}><i className="fas fa-wallet" style={{ color: '#1E7B3C', marginRight: 8 }}></i> Compensation Structure</h4>
                          <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.75)', marginBottom: 24, lineHeight: 1.6 }}>{role.compensation}</p>
                          
                          <h4 style={{ fontSize: 14, fontWeight: 800, color: '#0A1F12', marginBottom: 16 }}><i className="fas fa-tools" style={{ color: '#1B6CA8', marginRight: 8 }}></i> Resources & Environment</h4>
                          <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.75)', marginBottom: 12, lineHeight: 1.6 }}>{role.resources}</p>
                          <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.75)', margin: 0, lineHeight: 1.6 }}><strong>Environment:</strong> {role.environment}</p>
                        </div>
                      </div>

                    </div>
                  ))}
                </div>
              </div>
            </section>
          </div>
        )}

        {/* --- PORTAL GATEWAY (Strict Security) --- */}
        {view === 'portal' && (
          <div className="fadein" style={{ minHeight: '80vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#F5FAF6', padding: 24 }}>
            <div style={{ maxWidth: 450, width: '100%', background: '#fff', padding: 40, borderRadius: 16, boxShadow: '0 20px 60px rgba(0,0,0,0.08)', border: '1px solid rgba(10,31,18,.08)' }}>
              <div style={{ textAlign: 'center', marginBottom: 32 }}>
                <i className="fas fa-shield-alt" style={{ fontSize: 36, color: '#E8730F', marginBottom: 16 }}></i>
                <h1 className="serif" style={{ fontSize: 26, color: '#0A1F12', margin: '0 0 8px' }}>Secure Portal Access</h1>
                <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.6)', margin: 0, lineHeight: 1.5 }}>
                  Enter the specific invitation code provided to you by the StartEasy Zambia Admin to access your formal engagement agreement.
                </p>
              </div>

              {selectedRole && (
                <div style={{ background: '#FFF9E6', padding: 12, borderRadius: 8, marginBottom: 16, textAlign: 'center', fontSize: 13, color: '#0A1F12', fontWeight: 600 }}>
                  Role: {selectedRole.title}
                </div>
              )}

              <label style={{ display: 'block', fontSize: 12, fontWeight: 700, marginBottom: 8, color: '#0A1F12' }}>Invitation Code</label>
              <input 
                type="text" 
                value={inviteCode} 
                onChange={e => setInviteCode(e.target.value.toUpperCase())} 
                placeholder="e.g. INV-CDM-XXXX"
                style={{ width: '100%', padding: 16, border: '2px solid #E8730F', borderRadius: 8, fontSize: 18, textAlign: 'center', letterSpacing: 2, fontWeight: 700, marginBottom: 16, background: '#FFF9E6' }} 
              />
              
              {codeError && <div style={{ color: '#B8564F', fontSize: 13, marginBottom: 16, textAlign: 'center', fontWeight: 600 }}>{codeError}</div>}
              
              <Btn onClick={validateCode} size="lg" variant="dark" style={{ width: '100%' }}>
                Unlock Agreement
              </Btn>
            </div>
          </div>
        )}

        {/* --- CONTRACT VIEW (Formal Agreement) --- */}
        {view === 'contract' && selectedRole && (
          <div className="fadein" style={{ background: '#F5FAF6', padding: '40px 16px', minHeight: '100vh' }}>
            
            <div className="el printable">
              <div className="eh">
                <div>
                  <div className="brand">Start<em>Easy Zambia</em></div>
                  <div className="sub">Founding Team Engagement</div>
                </div>
                <div>
                  <div className="dt">AGREEMENT OF ENGAGEMENT</div>
                  <div className="mt">
                    {new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}<br/>
                    Role: {selectedRole.title}
                  </div>
                </div>
              </div>

              <p><strong>TO WHOM IT MAY CONCERN,</strong></p>
              
              <p>This document constitutes a formal Agreement of Engagement between StartEasy Zambia and the undersigned party (hereinafter referred to as "the Appointee"). By digitally signing this document, the Appointee formally accepts the position, terms, and responsibilities outlined below.</p>

              <h4>1. Position & Scope</h4>
              <p><strong>Position:</strong> {selectedRole.title} ({selectedRole.type})</p>
              <p>{selectedRole.pitch}</p>

              <h4>2. First 90-Day Priorities (Milestones)</h4>
              <p>The Appointee agrees to execute and deliver on the following initial milestones:</p>
              <ul>
                {selectedRole.day90Plan.map((item, idx) => <li key={idx}>{item}</li>)}
              </ul>

              <h4>3. Compensation & Resources</h4>
              <p><strong>Compensation:</strong> {selectedRole.compensation}</p>
              <p><strong>Resources Provided:</strong> {selectedRole.resources}</p>
              <p><strong>Work Environment:</strong> {selectedRole.environment}</p>

              <h4>4. Nature of Engagement</h4>
              <ul>
                <li>The Appointee is joining as a founding team member (Intrapreneur/Entrepreneur).</li>
                <li><strong>This is NOT an employment contract.</strong> There is no standard salaried structure at this stage.</li>
                {selectedRole.clauses.map((clause, idx) => <li key={idx}>{clause}</li>)}
              </ul>

              <h4>5. Appointee Details (For Execution)</h4>
              <p style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginTop: 10 }}>
                <span>
                  <strong>Full Legal Name:</strong><br/>
                  <input className="doc-input-line" placeholder="Enter full legal name" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                </span>
                <span>
                  <strong>Email Address:</strong><br/>
                  <input className="doc-input-line" type="email" placeholder="Enter email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                </span>
                <span>
                  <strong>Phone / WhatsApp:</strong><br/>
                  <input className="doc-input-line" placeholder="Enter phone number" value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} />
                </span>
                <span>
                  <strong>Current Location (City/Country):</strong><br/>
                  <input className="doc-input-line" placeholder="e.g. Lusaka, Zambia" value={form.location} onChange={e => setForm({...form, location: e.target.value})} />
                </span>
              </p>

              <h4>6. Declaration & Acceptance</h4>
              <div className="highlight-box">
                <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', cursor: 'pointer' }}>
                  <input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} style={{ width: 20, height: 20, marginTop: 2, accentColor: '#E8730F', flexShrink: 0 }} />
                  <span style={{ fontSize: 13, lineHeight: 1.6, color: '#0A1F12', fontWeight: 600 }}>
                    I, the undersigned Appointee, hereby declare that I have read, understood, and voluntarily accept the terms, compensation structure, and 90-day priorities outlined in this Agreement of Engagement. I acknowledge that this is an Entrepreneurship/Intrapreneurship opportunity and not a standard employment contract.
                  </span>
                </label>
              </div>

              <div className="sign">
                <div>
                  <div className="sigval">MWABA LEWIS</div>
                  <div className="lbl">For StartEasy Zambia</div>
                </div>
                <div>
                  <div className="sigval" style={{ borderBottom: form.name ? '1px solid #E8730F' : '1px solid #333' }}>
                    {form.name || <span style={{color: 'rgba(10,31,18,0.2)'}}>Digital Signature</span>}
                  </div>
                  <div className="lbl">For the Appointee (Digitally signed)</div>
                </div>
              </div>

              {error && <div style={{ background: '#FFE8E5', color: '#B8564F', padding: 12, borderRadius: 6, marginTop: 20, fontSize: 13, fontWeight: 600 }}>{error}</div>}

              <Btn onClick={signAgreement} disabled={busy} size="lg" variant="primary" style={{ width: '100%', marginTop: 24 }}>
                {busy ? 'Processing Execution...' : 'Execute Agreement'}
              </Btn>
            </div>
          </div>
        )}

        {/* --- SUCCESS VIEW --- */}
        {view === 'success' && (
          <div className="fadein" style={{ minHeight: '80vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, background: '#F5FAF6' }}>
            <div style={{ maxWidth: 500, background: '#fff', padding: 48, borderRadius: 16, textAlign: 'center', boxShadow: '0 20px 40px rgba(0,0,0,0.05)', border: '1px solid rgba(10,31,18,0.08)' }}>
              <div style={{ width: 72, height: 72, background: '#EAF7EE', color: '#1E7B3C', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 32, margin: '0 auto 24px' }}>
                <i className="fas fa-file-signature"></i>
              </div>
              <h2 className="serif" style={{ fontSize: 28, color: '#0A1F12', marginBottom: 12 }}>Agreement Executed</h2>
              <p style={{ fontSize: 15, color: 'rgba(10,31,18,0.7)', lineHeight: 1.6, marginBottom: 32 }}>
                Thank you, <strong>{form.name}</strong>. Your formal Agreement of Engagement for the <strong>{selectedRole?.title}</strong> role has been successfully signed and recorded. 
                <br/><br/>
                You are now officially onboarded to the founding team. A copy of this signed agreement has been sent to your email at <strong>{form.email}</strong> for your records.
              </p>
              <Btn onClick={resetToHome} size="lg" variant="dark" style={{ width: '100%' }}>Return to Portal Home</Btn>
            </div>
          </div>
        )}

      </main>

      {/* FOOTER */}
      <footer style={{ background: '#0A1F12', padding: '40px 24px', textAlign: 'center', borderTop: '1px solid rgba(255,255,255,0.1)' }}>
        <p style={{ color: 'rgba(255,255,255,0.4)', fontSize: 13, margin: 0 }}>© {new Date().getFullYear()} StartEasy Zambia. All rights reserved.</p>
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
