.header-btn { background: linear-gradient(135deg,var(--orange),var(--orange-2)); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
.header-mobile-toggle { display: none; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 8px; }
@media (max-width: 900px) {
  .header-nav { display: none; }
  .header-btn { display: none; }
  .header-mobile-toggle { display: block; }
  .header-mobile-menu { background: #0A1F12; padding: 16px 24px 24px; border-top: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 16px; position: absolute; top: 64px; left: 0; right: 0; box-shadow: 0 10px 30px rgba(0,0,0,.5); }

function JoinPage({ onAuth }) {
  const [inviteCode, setInviteCode] = useState('');
  const [validatedRole, setValidatedRole] = useState(null);
  const [checking, setChecking] = useState(false);
  const [codeError, setCodeError] = useState('');
  
  const [form, setForm] = useState({ name: '', email: '', phone: '', location: '', password: '' });
  const [agreed, setAgreed] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  const validateCode = () => {
    setCodeError('');
    if (!inviteCode.trim()) return setCodeError('Please enter your invitation code.');
    setChecking(true);
    
    const codeUpper = inviteCode.trim().toUpperCase();

    // 1. Check the hardcoded MASTER CODES first. This guarantees it works instantly.
    if (LIVE_CODES[codeUpper]) {
      setValidatedRole(ROLES[LIVE_CODES[codeUpper]]);
      setChecking(false);
      return;
    }

    // 2. If not a master code, check database (Fallback)
    setTimeout(async () => {
      try {
        if (fbReady) {
          const docRef = await db.collection('se_invites').doc(codeUpper).get();
          if (docRef.exists && docRef.data().status === 'active') {
            setValidatedRole(ROLES[docRef.data().roleId]);
          } else {
            setCodeError('Invalid or already used invitation code.');
          }
        } else {
          setCodeError('Invalid invitation code. Please check your spelling.');
        }
      } catch (e) {
        setCodeError('System error. Please try again.');
      } finally {
        setChecking(false);
      }
    }, 400);
  };

  const submit = async () => {
    setErr('');
    if (!form.name.trim()) return setErr('Please type your full name on the signature line.');
    if (!form.email.trim() || !/^\S+@\S+\.\S+$/.test(form.email)) return setErr('Please enter a valid email.');
    if (!form.phone.trim() || form.phone.replace(/\D/g, '').length < 9) return setErr('Please enter a valid phone number.');
    if (!form.location) return setErr('Please select your location.');
    if (!form.password || form.password.length < 6) return setErr('Password must be at least 6 characters.');
    if (!agreed) return setErr('You must check the agreement box to proceed.');

    setBusy(true);
    const codeUpper = inviteCode.trim().toUpperCase();

    try {
      if (fbReady) {
        // Try to save to Firebase
        try {
          const cred = await auth.createUserWithEmailAndPassword(form.email.trim().toLowerCase(), form.password);
          await db.collection(SE_AGENTS).doc(cred.user.uid).set({
            uid: cred.user.uid, displayName: form.name.trim(), email: form.email.trim().toLowerCase(),
            phone: form.phone.trim(), location: form.location, role: validatedRole.id,
            status: 'active', createdAt: Date.now()
          });
          if (!LIVE_CODES[codeUpper]) {
            await db.collection('se_invites').doc(codeUpper).update({ status: 'used', usedBy: cred.user.uid });
          }
        } catch (firebaseError) {
          console.warn("Firebase auth failed, falling back to local storage.", firebaseError);
          throw new Error("Firebase auth failed.");
        }
      } else {
         throw new Error("Firebase not initialized");
      }
    } catch (e) {
      // SILENT FALLBACK: If Firebase fails, we save locally so the user still gets a dashboard
      console.log("Using local storage fallback for new user.");
      const fakeUid = 'user_' + Date.now();
      localStorage.setItem('se_current_user', JSON.stringify({ 
        uid: fakeUid, 
        displayName: form.name.trim(),
        email: form.email.trim().toLowerCase(),
        role: validatedRole.id
      }));
    } finally {
      setBusy(false);
      onAuth();
    }
  };

  return (
    <div style={{ background: '#F5FAF6', padding: '40px 16px', minHeight: '100vh' }}>
      
      {!validatedRole ? (
        <div style={{ maxWidth: 450, margin: '60px auto', background: '#fff', padding: 32, borderRadius: 12, boxShadow: '0 10px 30px rgba(0,0,0,.05)' }}>
          <h2 className="serif" style={{ fontSize: 24, color: '#0A1F12', marginBottom: 8, textAlign: 'center' }}>Secure Role Access</h2>
          <p style={{ fontSize: 13, color: 'rgba(10,31,18,.6)', textAlign: 'center', marginBottom: 24 }}>
            To prevent unauthorized signups, you must enter the specific invitation code provided by StartEasy Zambia Admin.
          </p>
          <label style={{ display: 'block', fontSize: 12, fontWeight: 700, marginBottom: 6 }}>Invitation Code</label>
          <input 
            type="text" 
            value={inviteCode} 
            onChange={e => setInviteCode(e.target.value.toUpperCase())} 
            placeholder="e.g. INV-CEO-5R9T"
            style={{ width: '100%', padding: 12, border: '2px solid #E8730F', borderRadius: 8, fontSize: 16, textAlign: 'center', letterSpacing: 2, fontWeight: 700, marginBottom: 16 }} 
          />
          {codeError && <div style={{ color: '#B8564F', fontSize: 12.5, marginBottom: 16, textAlign: 'center', fontWeight: 600 }}>{codeError}</div>}
          <Btn onClick={validateCode} disabled={checking} size="lg" variant="primary" style={{ width: '100%' }}>
            {checking ? 'Verifying...' : 'Verify Code'}
          </Btn>
        </div>
      ) : (
        
        <div className="el fadein printable">
          <div className="eh">
            <div>
              <div className="brand">Start<em>Easy Zambia</em></div>
              <div className="sub">Team & Partner Engagement</div>
            </div>
            <div>
              <div className="dt">ENGAGEMENT AGREEMENT</div>
              <div className="mt">
                {new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}<br/>
                Role: {validatedRole.title}
              </div>
            </div>
          </div>

          <p><strong>Dear {form.name.trim() ? form.name.trim() : '___________________'},</strong></p>
          
          <p>Thank you for considering an opportunity engagement with StartEasy Zambia. This agreement sets out the terms of your participation as a <strong>{validatedRole.title}</strong>.</p>

          <h4>1. Scope of Work & Strategic Responsibilities</h4>
          <p>Your primary responsibilities will include:</p>
          <ul>
            {validatedRole.responsibilities.map((resp, idx) => <li key={idx}>{resp}</li>)}
          </ul>

          <h4>2. Key Performance Indicators (KPIs)</h4>
          <p>Your performance will be measured against the following indicators:</p>
          <ul>
            {validatedRole.kpis.map((kpi, idx) => <li key={idx}>{kpi}</li>)}
          </ul>

          <h4>3. Compensation & Terms</h4>
          <ul>
            {validatedRole.clauses.map((clause, idx) => <li key={idx}>{clause}</li>)}
          </ul>

          <h4>4. Personal Details</h4>
          <p style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginTop: 10 }}>
            <span>
              <strong>Email Address:</strong><br/>
              <input className="doc-input-line" type="email" placeholder="you@example.com" value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
            </span>
            <span>
              <strong>Phone / WhatsApp:</strong><br/>
              <input className="doc-input-line" placeholder="+260..." value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} />
            </span>
          </p>
          <p style={{ marginTop: 12 }}>
            <strong>Location:</strong><br/>
            <select className="doc-input-line" value={form.location} onChange={e => setForm({...form, location: e.target.value})}>
              <option value="">Choose location...</option>
              {['Lusaka', 'Copperbelt', 'Southern', 'Central', 'Eastern', 'Northern', 'Western', 'North-Western', 'Luapula', 'Muchinga', 'Diaspora'].map(l => <option key={l} value={l}>{l}</option>)}
            </select>
          </p>

          <h4>5. Acceptance</h4>
          <div style={{ marginTop: 12, marginBottom: 20, padding: 16, background: '#F9FBFA', borderRadius: 8, border: '1px dashed #ccc' }}>
            <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', cursor: 'pointer' }}>
              <input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} style={{ width: 18, height: 18, marginTop: 2, accentColor: '#E8730F' }} />
              <span style={{ fontSize: 12, lineHeight: 1.5, color: '#0A1F12' }}>I have read and agree to the engagement terms above. I understand my role as a {validatedRole.title}.</span>
            </label>
            
            <div style={{ marginTop: 16 }}>
              <label style={{ display: 'block', fontSize: 11, fontWeight: 700, marginBottom: 4, textTransform: 'uppercase' }}>Create Portal Password:</label>
              <input type="password" className="doc-input-line" placeholder="Min 6 characters" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
            </div>
          </div>

          <div className="sign">
            <div>
              <div className="sigval">MWABA LEWIS</div>
              <div className="lbl">For StartEasy Zambia</div>
            </div>
            <div>
              <input className="siginput" placeholder="Type full name to sign" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
              <div className="lbl">For the {validatedRole.title}</div>
            </div>
          </div>

          {err && <div style={{ background: '#FFE8E5', color: '#B8564F', padding: 12, borderRadius: 6, marginTop: 20, fontSize: 13, fontWeight: 600 }}>{err}</div>}

          <Btn onClick={submit} disabled={busy} size="lg" variant="primary" style={{ width: '100%', marginTop: 24 }}>
            {busy ? 'Processing...' : 'Digitally Sign & Create Account'}
          </Btn>
        </div>
      )}
    </div>
  );
}

function Dashboard({ agent }) {
  const roleInfo = ROLES[agent.role] || ROLES.referral_agent;

  return (
    <div className="fadein" style={{ minHeight: '100vh', background: '#F5FAF6', padding: '32px 16px' }}>
      <div style={{ maxWidth: 900, margin: '0 auto' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
          <div>
            <h1 className="serif" style={{ fontSize: 28, color: '#0A1F12', margin: 0 }}>Welcome, {agent.displayName.split(' ')[0]}</h1>
            <p style={{ fontSize: 14, color: '#E8730F', fontWeight: 700 }}>{roleInfo.title}</p>
          </div>
          <Btn onClick={() => { localStorage.removeItem('se_current_user'); window.location.hash = '#/'; window.location.reload(); }} variant="ghost" size="sm">Sign Out</Btn>
        </div>

        <div style={{ background: '#fff', padding: 24, borderRadius: 12, border: '1px solid rgba(10,31,18,.08)', marginBottom: 24 }}>
          <h2 style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>Role Overview</h2>
          <div style={{ background: '#FFF9E6', padding: 16, borderRadius: 8, border: '1px solid #F0E0A0', marginBottom: 24 }}>
            <p style={{ fontSize: 15, color: '#0A1F12', margin: 0, fontWeight: 600 }}>{roleInfo.desc}</p>
          </div>
          
          <h4 style={{ fontSize: 13, fontWeight: 800, textTransform: 'uppercase', color: '#0A1F12', marginBottom: 12 }}>Key Performance Indicators</h4>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 24 }}>
            {roleInfo.kpis.map((k, i) => <span key={i} style={{ background: '#EAF7EE', color: '#1E7B3C', padding: '6px 12px', borderRadius: 6, fontSize: 12.5, fontWeight: 600 }}>{k}</span>)}
          </div>

          <h4 style={{ fontSize: 13, fontWeight: 800, textTransform: 'uppercase', color: '#0A1F12', marginBottom: 12 }}>Strategic Responsibilities</h4>
          <ul style={{ fontSize: 14, color: 'rgba(10,31,18,.8)', paddingLeft: 20, margin: 0 }}>
            {roleInfo.responsibilities.map((r, i) => <li key={i} style={{ marginBottom: 6 }}>{r}</li>)}
          </ul>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [hash, setHash] = useState(window.location.hash || '#/');
  const [agent, setAgent] = useState(null);
  const [bootChecked, setBootChecked] = useState(false);

  useEffect(() => {
    const onHash = () => setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  useEffect(() => {
    // Check local storage for fake session
    const localUser = localStorage.getItem('se_current_user');
    if (localUser) setAgent(JSON.parse(localUser));
    setBootChecked(true);
  }, []);

  const raw = (hash || '#/').replace(/^#\/?/, '');
  const route = raw.split('/').filter(Boolean)[0] || '';

  const go = useCallback((r) => { window.location.hash = '#/' + r; window.scrollTo(0, 0); }, []);
  const onAuth = () => { go('dashboard'); };

  if (!bootChecked) return <Spinner />;

  let page = <Landing go={go} />;
  if (route === 'roles') page = <RoleDirectory go={go} />;
  else if (route === 'join') page = <JoinPage onAuth={onAuth} />;
  else if (route === 'dashboard') {
    if (!agent) page = <JoinPage onAuth={onAuth} />; // Redirect to join if not logged in
    else page = <Dashboard agent={agent} />;
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
      <Nav route={route} go={go} />
      <main style={{ flex: 1 }}>{page}</main>
      <footer style={{ background: '#0A1F12', padding: '40px 24px', textAlign: 'center' }}>
        <p style={{ color: 'rgba(255,255,255,.5)', fontSize: 14, margin: 0 }}>© {new Date().getFullYear()} StartEasy Zambia. All rights reserved.</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
